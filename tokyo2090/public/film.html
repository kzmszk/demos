<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TOKYO 2090 — Film</title>
<meta name="description" content="TOKYO 2090, a one-minute film of the game: a full turn at street level on the Shibuya crossing, the ruined Tocho, Maman at Roppongi Hills' 66 Plaza, a spiral up the lift off Mori Tower, and a slow glide from Shibuya to Shinjuku.">
<style>
  :root { --fg: #f2ece2; --dim: rgba(242, 236, 226, .6); --cape: #c4533a; --bg: #0b0a09;
    --sans: -apple-system, "Helvetica Neue", Helvetica, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 1600px; margin: 0 auto; padding: clamp(16px, 3vw, 40px) 16px 40px; box-sizing: border-box; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: clamp(12px, 2vw, 24px); }
  .word { font-weight: 800; font-size: clamp(40px, 8vw, 110px); letter-spacing: -.045em; line-height: .88; margin-left: -.04em; }
  .word small { display: block; font-weight: 400; font-size: 11px; letter-spacing: .34em; color: var(--dim); margin: 14px 0 0 .3em; }
  .top a, .meta a { color: var(--dim); text-decoration: none; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .top a:hover, .meta a:hover { color: var(--fg); }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px 24px; margin-top: 14px; font-size: 13px; letter-spacing: .06em; color: var(--dim); }
  .meta .open { color: var(--fg); border-bottom: 1px solid var(--cape); padding-bottom: 2px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="top"><span class="word">TOKYO 2090<small>渋谷 · 新宿 · 六本木 — 滑空する廃都</small></span><a class="back" href="../">← Gallery</a></div>
  <!-- the site's media route first: it answers byte ranges (Safari plays nothing without them, and seeking needs them);
       the copy among the static files (which answer every range with the whole file) is the fallback, and what a local server has -->
  <video poster="movie/poster.jpg" controls playsinline preload="metadata">
    <source src="/media/movies/tokyo2090-film/video.mp4" type="video/mp4">
    <source src="movie/tokyo2090.mp4" type="video/mp4">
  </video>
  <div class="meta"><span class="cap"></span><a class="open" href="index.html"></a></div>
</main>
<script>
  (function () {
    var en = location.hash === '#en' || ((navigator.language || '').slice(0, 2) !== 'ja' && location.hash !== '#ja');
    document.documentElement.lang = en ? 'en' : 'ja';
    document.querySelector('.cap').textContent = en ? 'A film of the game · 66 s · its own piano (Satie, Gymnopédie No. 1) and evening cicadas' : '紹介動画 · 66秒 · ピアノ（サティ《ジムノペディ第1番》）とひぐらしはゲームのもの';
    document.querySelector('.open').textContent = en ? 'Play the game ↗' : 'ゲームを開く ↗';
  })();
</script>
</body>
</html>
