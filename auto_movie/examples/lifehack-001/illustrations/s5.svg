  2. 誇張と省略：丸眼鏡を1.4倍に大きくする。ボブのふくらみを1.3倍にする。似顔としては「小さくとがったあご」と「上を向いた視線（黒目を眼鏡の上寄せ）」を1.5倍に誇張する。耳・指・服のしわは省く。
  3. 場面：ノートを閉じて、あごに手を当て、斜め上の電球を見上げて必死に思い出している。
  4. 目印の座標：頭頂(255,104)／生え際(262,140)／あご(265,227)／目の高さ y=172〜177（左目247,右目277）／肩 左(188,262)右(336,280)／手(286,238)／ひじ(330,320)／電球の中心(330,74)／？の中心(412,80)／ノート中心(218,308)
