  設計
  1. 特徴：黒いショートボブ（ぱっつんぎみの前髪）／丸い眼鏡／細い眉／セーラー服の襟とリボン／頭を抱える両手
  2. 誇張と省略：丸眼鏡を1.4倍に大きくする。ボブのふくらみを1.3倍に広げる。似顔のズレは「小さくとがったあご」と「目と目の間が広いこと」を1.5倍に誇張。耳、指の関節、服のしわは省く。
  3. 場面：昨日覚えたことが頭から抜けて、困り顔で頭を抱えている。文字のかけらが右上の空へ逃げていく。
  4. 目印の座標：頭頂(272,80)／生え際y=118／あご(266,196)／目(254,145)(282,143)／鼻先y=162／口y=174／肩(212,232)(340,232)／手(204,140)(340,140)／肘(184,292)(363,294)／ノート中心(288,316)／かけらの中心(410,92)／時計の中心(86,80)
