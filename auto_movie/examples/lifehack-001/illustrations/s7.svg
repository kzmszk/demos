  <!-- 設計
  1. 特徴：角の丸い細長い板のスマホ／上端のスピーカーの溝と下端のホームバー／画面いっぱいのカレンダーの格子／印をつけた3つの日／画面を押す指
  2. 誇張と省略：画面のカレンダーの格子と3つの印を1.5倍に誇張する。ボタン類、アイコン、数字、爪、しわは省く。スマホは厚みを1本の線だけで見せる。
  3. 場面：勉強した日（赤いハート）から先の日に3つの復習の予定を入れ終えて、指でトンと押したところ。ベルが「予定が入った」と鳴っている。
  4. 目印の座標：スマホの中心(285,195)、時計回りに12°傾ける。角は左上(244,74)、右上(372,101)、右下(326,316)、左下(199,289)。画面は(249,95)-(359,119)-(320,301)-(210,277)。
     今日(257,174)、復習1(273,177)、復習2(298,213)、復習3(238,262)。押す指先(310,230)、持つ手(205,240)。ベル(402,58)。チェック(492-584, 138-222)。
