  <!--
  設計
  1. 特徴：くりくりの短い巻き毛とアホ毛1本／大きすぎるヘッドホン（耳あては黄色）／大きな丸い頬と赤い斜線／太くてよく動く眉／ぶかぶかの白いパーカー（フードは首の後ろ）
  2. 誇張と省略：ヘッドホンの耳あて1.5倍、前に出た頬のふくらみ1.4倍。似顔としてのズレは「丸顔（頬が張る）」と「太い眉」を1.5倍にする。耳（耳あてに隠れる）、指、パーカーの細かいしわは省く。
  3. 場面：左（画面の中央）を向き、話を聞いて「へえ？」と目を丸くしている、好奇心いっぱいの聞き役。
  4. 目印の座標：アホ毛の先 (142,38)、ヘッドバンドの頂点 (148,58)、生え際 y≈115、あご (130,236)、顔の高さ H≈121（画面の約32%）、目 奥 (105,178)・手前 (147,176)、眉 y≈157、鼻 (114,194)、口の中心 (124,213)、手前の耳あての中心 (195,186)、首の付け根の中心 (151,248)、肩 左 (62,292)・右 (222,276)、マイク (62,237)
  -->
