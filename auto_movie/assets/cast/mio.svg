  <!--
  設計
  1. 特徴：あごラインのボブ（片側を耳にかける）／斜めに流した前髪とヘアピン1つ／黄色い耳あての大きなヘッドホン／白シャツ＋黒っぽいゆるカーディガン／細い弧の眉と、外にはねるまつげ1本
  2. 誇張と省略：ヘッドホンの耳あてを約1.5倍に。似顔としては「小さくとがったあご」と「斜めに流れる前髪の量」を約1.5倍に。耳・手・ボタン・服のしわはほぼ省く
  3. 場面：マイクの前で、少しからかうように微笑みながら右（画面中央）の相手に話を振るところ
  4. 目印の座標：頭頂(146,38)、生え際 y≈80、あご(169,200)、目 y=134（手前の目x146／奥の目x184）、鼻先(172,158)、口(170,175)、耳あて中心(104,146)、首の付け根(152,214)、肩：手前(74,256)／奥(226,252)、マイク(250,214)
  -->
