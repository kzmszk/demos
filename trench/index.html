<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TRENCH RUN — ワイヤーフレームの要塞を駆け抜けろ</title>
<meta name="description" content="ベクタースキャンのワイヤーフレームで描く、巨大要塞のトレンチ・ラン。隔壁のすき間をすり抜け、砲台の火球を撃ち落とし、最後の一発を排気口へ。日本語と英語に対応。">
<meta name="theme-color" content="#02050a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#02050a; --ink:#d9f3ff; --dim:#6aa6bf; --amb:#ffb347; --red:#ff503c;
  --m:clamp(16px, 3.4vmin, 44px);
  --sans:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
body[data-phase=run] #cv,body[data-phase=kill] #cv{cursor:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 46%,transparent 55%,rgba(0,0,0,.55) 100%)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* centre caption under the vector banner */
#cap{position:absolute;left:50%;top:40%;transform:translate(-50%,0);width:min(88vw,760px);text-align:center;
  font-weight:300;font-size:clamp(14px,2.05vmin,22px);line-height:1.7;letter-spacing:.2em;color:var(--ink);
  text-shadow:0 0 6px rgba(120,210,255,.55),0 0 18px rgba(80,170,255,.3);opacity:0;transition:opacity .28s}
#cap.on{opacity:1}
#cap small{display:block;margin-top:.4em;font-size:.72em;letter-spacing:.16em;color:var(--dim);text-shadow:none}
#cap.amb{color:#ffd9a0;text-shadow:0 0 6px rgba(255,170,60,.6),0 0 18px rgba(255,140,40,.35)}
#cap.red{color:#ffb3a8;text-shadow:0 0 6px rgba(255,80,60,.6),0 0 18px rgba(255,60,40,.35)}

/* title sheet */
#title{display:none;position:absolute;left:var(--m);right:var(--m);bottom:var(--m);
  grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:clamp(18px,3vw,48px);align-items:start;pointer-events:none}
body[data-phase=title] #title{display:grid}
#title .tag{font-weight:300;font-size:clamp(13px,1.7vmin,18px);line-height:1.85;letter-spacing:.08em;margin:0}
#title ol{margin:0;padding:0;list-style:none;counter-reset:s;font-size:clamp(11px,1.45vmin,15px);line-height:2;letter-spacing:.1em;color:var(--dim)}
#title ol li{counter-increment:s;display:grid;grid-template-columns:2.4em 1fr}
#title ol li::before{content:counter(s,decimal-leading-zero);color:var(--amb);letter-spacing:.06em}
#title dl{margin:0;font-size:clamp(11px,1.45vmin,15px);line-height:2;letter-spacing:.1em;color:var(--dim);display:grid;grid-template-columns:auto 1fr;column-gap:1.2em}
#title dt{color:var(--ink)} #title dd{margin:0}
#title .cta{align-self:end;justify-self:end;text-align:right;font-size:clamp(12px,1.6vmin,17px);letter-spacing:.22em;color:var(--ink);white-space:nowrap;animation:blink 1.15s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:1100px){
  #title{grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) auto}
  #title ol{display:none}
}
@media (max-width:820px){
  #title{grid-template-columns:1fr;gap:10px}
  #title .cta{justify-self:start;text-align:left}
}

/* tools: language / sound */
#tools{position:absolute;right:var(--m);top:var(--m);display:none;gap:6px;pointer-events:auto}
body[data-phase=title] #tools,body[data-phase=over] #tools,body.paused #tools{display:flex}
body[data-phase=over] #tools,body.paused #tools{top:64%;right:auto;left:50%;transform:translateX(-50%)}
#tools button{all:unset;cursor:pointer;font-size:11px;letter-spacing:.2em;padding:8px 10px;color:var(--dim);border:1px solid rgba(106,166,191,.35)}
#tools button:hover,#tools button:focus-visible{color:var(--ink);border-color:var(--ink)}

/* touch fire */
#fire{all:unset;position:absolute;right:calc(var(--m) + env(safe-area-inset-right));bottom:calc(var(--m) + env(safe-area-inset-bottom) + 84px);
  width:92px;height:92px;border-radius:50%;border:1.5px solid rgba(255,179,71,.85);color:var(--amb);text-align:center;line-height:92px;
  font-size:12px;letter-spacing:.2em;background:rgba(255,179,71,.06);box-shadow:0 0 18px rgba(255,170,60,.25);display:none;pointer-events:auto;touch-action:none}
body.touch[data-phase=run] #fire{display:block}
#fire.down{background:rgba(255,179,71,.22)}
</style>
</head>
<body data-phase="title">
<canvas id="cv" aria-label="TRENCH RUN — wireframe trench run game"></canvas>
<div id="ui">
  <div id="cap" role="status"></div>
  <section id="title">
    <p class="tag" id="t-tag"></p>
    <ol id="t-how"><li></li><li></li><li></li></ol>
    <dl class="keys-d" id="t-keys"></dl>
    <div class="cta" id="t-cta"></div>
  </section>
  <div id="tools"><button id="b-lang" type="button">JA / EN</button><button id="b-snd" type="button">SOUND ON</button></div>
  <button id="fire" type="button">FIRE</button>
</div>
<script>
(() => {
'use strict';

/* =====================================================================
   TRENCH RUN — a wireframe trench run.
   One file, no assets: every line, letter and sound is drawn or synthesised here.
   Coordinates: x right, y up, z forward along the trench. The ship flies +z.
   ===================================================================== */

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(i, j) { let h = Math.imul((i * 374761393 + j * 668265263) ^ 0x5bd1e995, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const pad = (n, w) => String(Math.max(0, Math.floor(n))).padStart(w, '0');

/* ---------- constants ---------- */
const HW = 5, HT = 14, SL = 4;            // trench half-width, wall height, slab length
const ZFAR = 220, NEAR = 0.6;
const XB = 4.2, YLO = 0.95, YHI = 11.6, YC = 6.3; // where the ship may fly
const BOLT_V = 240, ARM_R = 200;
const TRAIL = 0.42;
const BG = '2,5,10';
const COL = ['#79d3f0', '#eef9ff', '#ffb347', '#ff503c', '#82ffa6', '#3f8fb0'];
const C_WALL = 0, C_WHITE = 1, C_AMB = 2, C_RED = 3, C_GRN = 4, C_DIM = 5;

/* ---------- language ---------- */
const TXT = {
  ja: {
    tag: '巨大要塞の溝を、ワイヤーフレームで駆け抜ける。<br>狙うのは、排気口ただひとつ。',
    how: ['隔壁と梁のすき間をすり抜ける', '砲台と火球を撃ち落とす', '排気口を照準に収め、魚雷を撃つ'],
    keys: [['移動', 'マウス ／ 矢印・WASD ／ ドラッグ'], ['発射', 'クリック ／ Space'], ['その他', 'P 一時停止 ／ M 音 ／ L 言語']],
    keysTouch: [['移動', '画面をドラッグ'], ['発射', 'FIRE ボタン']],
    start: 'クリック か Space で出撃',
    approach: '要塞に接近', enter: 'トレンチ突入', armed: '魚雷、装填。排気口を照準に収めて撃て', locked: '照準、合致。撃て',
    miss: '外れた。もう一周', wall: '間に合わなかった。もう一周', boom: '要塞、爆散', dead: '撃墜された',
    low: 'シールド残りわずか', paused: '一時停止', next: '次の要塞へ', retry: 'クリック か Space でもう一度', hi: 'ハイスコア更新',
    snd: ['SOUND ON', 'SOUND OFF'], pausedSub: 'P か クリックで再開',
  },
  en: {
    tag: 'Fly the trench of a wireframe battle station.<br>There is exactly one exhaust port.',
    how: ['Thread the gaps in bulkheads and beams', 'Shoot down turrets and fireballs', 'Put the port in your sights, fire the torpedo'],
    keys: [['Move', 'Mouse / Arrows, WASD / Drag'], ['Fire', 'Click / Space'], ['Other', 'P pause / M sound / L language']],
    keysTouch: [['Move', 'Drag the screen'], ['Fire', 'FIRE button']],
    start: 'Click or press Space to launch',
    approach: 'Closing on the station', enter: 'Entering the trench', armed: 'Torpedo loaded. Centre the port and fire.', locked: 'Locked. Fire.',
    miss: 'Missed. Going around.', wall: 'Out of room. Going around.', boom: 'Station destroyed', dead: 'You were shot down',
    low: 'Shields critical', paused: 'Paused', next: 'On to the next station', retry: 'Click or Space to try again', hi: 'New high score',
    snd: ['SOUND ON', 'SOUND OFF'], pausedSub: 'P or click to resume',
  },
};
const BANNER = { approach: 'APPROACH', enter: 'ENTER THE TRENCH', armed: 'TORPEDO ARMED', miss: 'MISSED', wall: 'MISSED', boom: 'STATION DESTROYED', dead: 'SHOT DOWN', low: 'SHIELD LOW', next: 'NEXT STATION', paused: 'PAUSED' };
const BANNER_CI = { armed: 2, miss: 3, wall: 3, dead: 3, low: 3, boom: 1 };
let LANG = (() => {
  if (/(^|[#,&])en\b/i.test(location.hash)) return 'en';
  if (/(^|[#,&])ja\b/i.test(location.hash)) return 'ja';
  try { const s = localStorage.getItem('trench-lang'); if (s === 'en' || s === 'ja') return s; } catch (e) { /* storage may be blocked */ }
  return 'ja';
})();

/* ---------- canvas, projection, batched line pen ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, F = 800, cx0 = 0, cy0 = 0, rulerY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  F = Math.min(H * 0.95, Math.max(W * 0.75, H * 0.5));
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, W, H);
  const t = $('#title').getBoundingClientRect();
  rulerY = t.height ? t.top - Math.max(14, H * 0.03) : H * 0.8;
}
const cam = { x: 0, y: 0, z: 0, roll: 0 };
let cr = 1, sr = 0, pX = 0, pY = 0, bw = 1.35;
function pr(x, y, z) {
  let X = x - cam.x, Y = y - cam.y; const Z = z - cam.z;
  if (Z < NEAR) return false;
  if (cr !== 1) { const t = X * cr - Y * sr; Y = X * sr + Y * cr; X = t; }
  const s = F / Z; pX = cx0 + X * s; pY = cy0 - Y * s; return true;
}
const bins = []; for (let i = 0; i < COL.length * 16; i++) bins.push([]);
function seg(x1, y1, x2, y2, ci, a) {
  if (a < 0.03) return;
  bins[ci * 16 + (a >= 1 ? 15 : (a * 15) | 0)].push(x1, y1, x2, y2);
}
function flush() {
  for (let k = 0; k < bins.length; k++) {
    const b = bins[k]; if (!b.length) continue;
    const al = Math.min(1, ((k & 15) + 0.5) / 15);
    ctx.strokeStyle = COL[k >> 4];
    ctx.beginPath();
    for (let j = 0; j < b.length; j += 4) { ctx.moveTo(b[j], b[j + 1]); ctx.lineTo(b[j + 2], b[j + 3]); }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = al * 0.2; ctx.lineWidth = bw * 4.2; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = al; ctx.lineWidth = bw; ctx.stroke();
    b.length = 0;
  }
  ctx.globalAlpha = 1;
}
function setW(w) { flush(); bw = w; }
function fillPoly(p) { // black fill so nearer solids hide what is behind them
  flush();
  ctx.fillStyle = `rgb(${BG})`; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
  ctx.closePath(); ctx.fill();
}
function L3(x1, y1, z1, x2, y2, z2, ci, a) {
  let r1 = z1 - cam.z, r2 = z2 - cam.z;
  if (r1 < NEAR && r2 < NEAR) return;
  if (r1 < NEAR) { const t = (NEAR - r1) / (r2 - r1); x1 += (x2 - x1) * t; y1 += (y2 - y1) * t; z1 = cam.z + NEAR; }
  else if (r2 < NEAR) { const t = (NEAR - r2) / (r1 - r2); x2 += (x1 - x2) * t; y2 += (y1 - y2) * t; z2 = cam.z + NEAR; }
  if (!pr(x1, y1, z1)) return; const ax = pX, ay = pY;
  if (!pr(x2, y2, z2)) return;
  seg(ax, ay, pX, pY, ci, a);
}
const fz = (d) => Math.pow(clamp(1 - d / ZFAR, 0, 1), 0.75);

/* ---------- vector font (4×6 grid, drawn as strokes) ---------- */
const GLYPHS = {
  A: ['062046', '1434'], B: ['06003041423303', '3344453606'], C: ['4130100105163645'], D: ['00304145360600'],
  E: ['40000646', '0333'], F: ['400006', '0333'], G: ['41301001051636454323'], H: ['0006', '4046', '0343'],
  I: ['1030', '1636', '2026'], J: ['4045361605'], K: ['0006', '400346'], L: ['000646'], M: ['0600234046'],
  N: ['06004640'], O: ['100105163645413010'], P: ['06003041423303'], Q: ['100105163645413010', '2446'],
  R: ['06003041423303', '2346'], S: ['413010010213334445361605'], T: ['0040', '2026'], U: ['000516364540'],
  V: ['002640'], W: ['0016233640'], X: ['0046', '4006'], Y: ['002340', '2326'], Z: ['00400646'],
  0: ['100105163645413010'], 1: ['112026', '1636'], 2: ['01103041420646'], 3: ['004022324345361605'], 4: ['36300444'],
  5: ['400003334445361605'], 6: ['4130100105163645443303'], 7: ['004026'], 8: ['13020110304142331304051636454433'], 9: ['4313020110304145361605'],
  '-': ['1333'], '.': ['2526'], ':': ['2122', '2425'], '/': ['0640'], '!': ['2023', '2526'], '+': ['2125', '0343'], x: ['0141', '4101'],
};
const GLP = {};
for (const k in GLYPHS) GLP[k] = GLYPHS[k].map((s) => Array.from(s, Number));
const tw = (s, h) => String(s).length * h - h * 0.333;
function text(s, x, y, h, ci, a, al) { // y = top; al 0 left / 1 centre / 2 right
  s = String(s).toUpperCase();
  if (al === 1) x -= tw(s, h) / 2; else if (al === 2) x -= tw(s, h);
  const u = h / 6;
  for (let i = 0; i < s.length; i++) {
    const g = GLP[s[i]]; if (!g) continue;
    const ox = x + i * h;
    for (const st of g) for (let k = 0; k < st.length - 2; k += 2) seg(ox + st[k] * u, y + st[k + 1] * u, ox + st[k + 2] * u, y + st[k + 3] * u, ci, a);
  }
}

/* ---------- the station: a wireframe sphere with an equatorial trench and a dish ---------- */
const SPH = (() => {
  const V = [], E = [], D = Math.PI / 180;
  const add = (p) => { V.push(p[0], p[1], p[2]); return V.length / 3 - 1; };
  const sp = (lat, lon) => [Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon)];
  const poly = (pts, kind, dash) => { const ids = pts.map(add); for (let i = 0; i < ids.length - 1; i++) { if (dash && i % 2) continue; E.push(ids[i], ids[i + 1], kind); } };
  const ring = (lat) => { const a = []; for (let j = 0; j <= 72; j++) a.push(sp(lat, j * 5 * D)); return a; };
  for (let k = -5; k <= 5; k++) if (k) poly(ring(k * 15 * D), 0);
  poly(ring(-2.6 * D), 1); poly(ring(2.6 * D), 1); poly(ring(0), 2, true);
  for (let m = 0; m < 24; m++) {
    const lon = m * 15 * D, s = [], n = [];
    for (let j = 0; j <= 12; j++) s.push(sp((-90 + j * 7.5) * D, lon)); s[12] = sp(-2.6 * D, lon);
    for (let j = 12; j <= 24; j++) n.push(sp((-90 + j * 7.5) * D, lon)); n[0] = sp(2.6 * D, lon);
    poly(s, 0); poly(n, 0);
  }
  for (let t = 0; t < 120; t++) poly([sp(-2.6 * D, t * 3 * D), sp(2.6 * D, t * 3 * D)], 1);
  // the dish
  const c = sp(40 * D, 32 * D);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const nrm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
  const u = nrm(cross([0, 1, 0], c)), v = cross(c, u);
  const dp = (rho, th) => [0, 1, 2].map((i) => c[i] * Math.cos(rho) + Math.sin(rho) * (Math.cos(th) * u[i] + Math.sin(th) * v[i]));
  for (const r of [13, 9, 4.5]) { const a = []; for (let j = 0; j <= 40; j++) a.push(dp(r * D, (j / 40) * TAU)); poly(a, 3); }
  for (let k = 0; k < 8; k++) poly([dp(4.5 * D, (k / 8) * TAU), dp(13 * D, (k / 8) * TAU)], 3);
  return { V: Float32Array.from(V), E: Uint16Array.from(E), n: V.length / 3, m: E.length / 3 };
})();
const SKIND = [[C_WALL, 0.55], [C_WHITE, 0.95], [C_AMB, 0.6], [C_AMB, 0.95]];
const TX = new Float32Array(SPH.n * 3), SX = new Float32Array(SPH.n), SY = new Float32Array(SPH.n), FC = new Float32Array(SPH.n), OK = new Uint8Array(SPH.n);
function rotSphere(ry, rx) {
  const c1 = Math.cos(ry), s1 = Math.sin(ry), c2 = Math.cos(rx), s2 = Math.sin(rx);
  for (let i = 0; i < SPH.n; i++) {
    const x = SPH.V[i * 3], y = SPH.V[i * 3 + 1], z = SPH.V[i * 3 + 2];
    const x1 = x * c1 + z * s1, z1 = -x * s1 + z * c1;
    TX[i * 3] = x1; TX[i * 3 + 1] = y * c2 - z1 * s2; TX[i * 3 + 2] = y * s2 + z1 * c2;
  }
}
function drawSphere(wx, wy, wz, R, ry, rx, al) { // camera at the origin, no roll
  rotSphere(ry, rx);
  for (let i = 0; i < SPH.n; i++) {
    const nx = TX[i * 3], ny = TX[i * 3 + 1], nz = TX[i * 3 + 2];
    const X = wx + R * nx, Y = wy + R * ny, Z = wz + R * nz;
    if (Z < NEAR) { OK[i] = 0; continue; }
    const s = F / Z; SX[i] = cx0 + X * s; SY[i] = cy0 - Y * s;
    FC[i] = -(nx * X + ny * Y + nz * Z) / Math.hypot(X, Y, Z); OK[i] = 1;
  }
  for (let e = 0; e < SPH.m; e++) {
    const a = SPH.E[e * 3], b = SPH.E[e * 3 + 1], kd = SKIND[SPH.E[e * 3 + 2]];
    if (!OK[a] || !OK[b]) continue;
    const f = (FC[a] + FC[b]) * 0.5;
    seg(SX[a], SY[a], SX[b], SY[b], kd[0], al * kd[1] * (f > 0 ? 0.3 + 0.7 * Math.sqrt(f) : 0.08));
  }
}
const sphereR = (D, rpx) => D * rpx / Math.hypot(F, rpx);

/* ---------- state ---------- */
const G = { phase: 'title', t: 0, tt: 0, score: 0, hi: 0, level: 1, shield: 6, attempt: 0, inv: 0, flash: 0, wflash: 0, shake: 0, slow: 1, paused: false, frozen: false, pt: 0, kt: 0, bt: 0, ot: 0, banner: null, capT: 0 };
try { G.hi = +localStorage.getItem('trench-hi') || 0; } catch (e) { /* storage may be blocked */ }
let run = null;
const S = { x: 0, y: YC, vx: 0, vy: 0, tx: 0, ty: YC };
let FX = [];       // flying line fragments (world space)
let BOOM = null;   // exterior explosion state
const inp = { mx: 0.5, my: 0.5, mouse: false, kx: 0, ky: 0, fire: false, press: false, keys: {}, tid: null, tx0: 0, ty0: 0 };

/* ---------- audio: everything synthesised ---------- */
let AC = null, MG = null, NBUF = null, SND = true, drone = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MG = AC.createGain(); MG.gain.value = 0.55; MG.connect(AC.destination);
    NBUF = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NBUF.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, dl) {
  if (!AC || !SND) return; const t = AC.currentTime + (dl || 0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;

/* ---------- the run ---------- */
function mkBox(x0, x1, y0, y1, z0, z1, grp, hi) { return { x0, x1, y0, y1, z0, z1, grp, hi, hit: false }; }
function buildRun() {
  const lvl = G.level, rnd = mulberry(7919 * lvl + 104729 * G.attempt + 13);
  const v = Math.min(38 + (lvl - 1) * 3.2, 58);
  const Zend = Math.round((v * 42) / 10) * 10;
  const R = {
    z: 0, v, Zend, boxes: [], groups: [], turrets: [], ties: [], balls: [], bolts: [], torps: [],
    cool: 0, armed: false, torpLeft: 2, locked: false, stop: false, endT: 0, crash: 0, won: false, lockBeep: 0,
    port: { x: (rnd() - 0.5) * 4.4, y: 4.6 + rnd() * 3.6, h: Math.max(0.62, 0.95 - 0.08 * (lvl - 1)) },
    bonus: [], flares: 0,

  const diffAt = (z) => clamp(0.1 + (z / Zend) * 0.7 + (lvl - 1) * 0.12, 0, 1);
  let z = 175, pcx = 0, pcy = YC; const gaps = [], end = Zend - 340;
  while (z < end) {

    const grp = { z0: z, z1: z, hit: false, scored: false, open: null };
    if (r < 0.36) { // bulkhead with one opening
      const w = lerp(4.4, 2.9, diff), h = lerp(3.9, 2.7, diff), th = 1.6;
      let cx = pcx + (rnd() - 0.5) * 7, cy = pcy + (rnd() - 0.5) * 6;
      cx = clamp(cx, -HW + w / 2 + 0.35, HW - w / 2 - 0.35); cy = clamp(cy, h / 2 + 0.4, YHI - h / 2 + 0.6);
      const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
      R.boxes.push(mkBox(-HW, x0, 0, HT, z, z + th, grp, 'x1'), mkBox(x1, HW, 0, HT, z, z + th, grp, 'x0'),
        mkBox(x0, x1, 0, y0, z, z + th, grp, 'y1'), mkBox(x0, x1, y1, HT, z, z + th, grp, 'y0'));

    } else if (r < 0.5) { // low wall: fly over

    } else if (r < 0.64) { // high beam: fly under
      const y0 = 4.8 + rnd() * 2.6; R.boxes.push(mkBox(-HW, HW, y0, HT, z, z + 1.6, grp, 'y0')); grp.z1 = z + 1.6; len = 1.6; pcx = 0; pcy = y0 - 3;
    } else if (r < 0.82) { // pillars, slalom
      const n = 2 + (rnd() < 0.4 ? 1 : 0), sp = 26, dir = rnd() < 0.5 ? -1 : 1; let lx = 0;
      for (let k = 0; k < n; k++) { const x = dir * (k % 2 ? -1 : 1) * (1.6 + rnd() * 1.2), zz = z + k * sp; R.boxes.push(mkBox(x - 1.1, x + 1.1, 0, HT, zz, zz + 2.2, grp)); lx = x; }

}

function enterRun() {
  run = buildRun(); FX = [];
  S.x = S.tx = 0; S.y = S.ty = YC; S.vx = S.vy = 0; S.roll = 0;
  G.phase = 'run'; G.inv = 0; G.slow = 1; G.flash = 0; G.wflash = 0.9;
  if (G.attempt === 0) say('enter', 2200);

}

function beginApproach() {
  G.phase = 'approach'; G.pt = 0; G.wflash = 0; FX = []; droneOff(); hideCap(); say('approach', 2000);
}
function startGame() {

  beginApproach();
}

/* ---------- damage ---------- */
function hit(n, force) {

  G.shield = Math.max(0, G.shield - n); G.inv = 1.3; G.flash = 1; G.shake = 1; sfx('hit');
  if (G.shield <= 0) die(); else if (G.shield <= 2) say('low', 1600);
  return true;
}
function die() {
  G.phase = 'dead'; G.ot = 0; droneOff(); sfx('big');
  burst(cam.x, cam.y, cam.z + 6, 90, 22, [C_WHITE, C_AMB, C_RED], 1.6, 2.4);
  G.wflash = 1; G.shake = 1.4; say('dead', 3000); G.banner.dur = 1e9;
  if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('trench-hi', G.hi); } catch (e) { /* storage may be blocked */ } }
}

/* ---------- fragments ---------- */
function burst(x, y, z, n, spd, cis, life, len) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1), s = spd * (0.25 + Math.random() * 0.9);
    const dx = Math.sin(b) * Math.cos(a), dy = Math.sin(b) * Math.sin(a), dz = Math.cos(b), l = (len || 1.4) * (0.3 + Math.random());
    FX.push({ x, y, z, vx: dx * s, vy: dy * s, vz: dz * s, dx: dx * l, dy: dy * l, dz: dz * l, ci: cis[(Math.random() * cis.length) | 0], l: life * (0.5 + Math.random() * 0.6), L: life, w: (Math.random() - 0.5) * 6 });
  }
}
function updateFX(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i]; f.l -= dt; if (f.l <= 0) { FX.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    const k = Math.exp(-dt * 1.1); f.vx *= k; f.vy *= k; f.vz *= k;
    const c = Math.cos(f.w * dt), s = Math.sin(f.w * dt), x = f.dx * c - f.dy * s; f.dy = f.dx * s + f.dy * c; f.dx = x;
  }
}
function drawFX() { for (const f of FX) L3(f.x, f.y, f.z, f.x + f.dx, f.y + f.dy, f.z + f.dz, f.ci, Math.pow(f.l / f.L, 1.2)); }

/* ---------- weapons ---------- */
function targetsList() {
  const R = run, out = [];
  for (const t of R.turrets) if (t.alive && t.z - R.z > 6 && t.z - R.z < 140) out.push({ o: t, r: 1.4, k: 't' });
  for (const t of R.ties) if (t.alive && t.z - R.z > 6 && t.z - R.z < 140) out.push({ o: t, r: 2.3, k: 'e' });
  for (const b of R.balls) if (b.z - R.z > 4) out.push({ o: b, r: 1.2, k: 'b' });
  return out;
}
function fireLaser() {
  const R = run; R.cool = 0.14; sfx('laser');
  let best = null, bs = 1e9;
  for (const t of targetsList()) {
    const dz = t.o.z - R.z, dx = t.o.x - S.x, dy = t.o.y - S.y, ang = Math.hypot(dx, dy) / dz;
    if (ang < 0.17 && ang + dz * 0.0004 < bs) { bs = ang + dz * 0.0004; best = t; }
  }
  for (const sd of [-1, 1]) {
    const bx = S.x + sd * 0.8, by = S.y - 0.5, bz = R.z + 1;
    let ax = S.x, ay = S.y, az = R.z + 90, tt = (az - bz) / BOLT_V;
    if (best) {
      const o = best.o, dz = o.z - bz, vz = o.vz || 0; tt = Math.max(0.03, dz / (BOLT_V - vz));
      ax = o.x + (o.vx || 0) * tt; ay = o.y + (o.vy || 0) * tt; az = o.z + vz * tt;
    }
    R.bolts.push({ x: bx, y: by, z: bz, vx: (ax - bx) / tt, vy: (ay - by) / tt, vz: (az - bz) / tt, l: 0.9 });

}
function fireTorp() {
  const R = run; if (R.torpLeft <= 0 || !R.armed || R.stop) return;
  R.torpLeft--; R.cool = 0.4; R.torps.push({ x: S.x, y: S.y, z: R.z + 1.5, vz: 190, t: 0 }); sfx('torp');
}
function ballFrom(x, y, z) {
  const R = run, lvl = G.level, dz = z - R.z;
  const T0 = Math.max(0.85, 1.75 - 0.1 * (lvl - 1) - 0.25 * (R.z / R.Zend));
  const T = Math.min(T0, (dz / R.v) * 0.92); if (T < 0.6) return;
  const tx = S.x, ty = S.y, tz = R.z + R.v * T;
  R.balls.push({ x, y, z, vx: (tx - x) / T, vy: (ty - y) / T, vz: (tz - z) / T, age: 0, rel: z - R.z });

}
function killScore(k) { return (k === 't' ? 150 : k === 'e' ? 600 : 30) * G.level; }

/* ---------- run update ---------- */
function steer(dt) {

  else if (inp.mouse) { S.tx = (inp.mx - 0.5) * 2 * XB * 1.12; S.ty = YC + (0.5 - inp.my) * 2 * (YHI - YC) * 1.1; }

    const gp = (navigator.getGamepads && navigator.getGamepads()[0]) || null;

      const ax = Math.abs(gp.axes[0]) > 0.15 ? gp.axes[0] : 0, ay = Math.abs(gp.axes[1]) > 0.15 ? gp.axes[1] : 0;
      if (ax || ay) { S.tx += ax * 15 * dt; S.ty -= ay * 15 * dt; inp.mouse = false; }
      if (gp.buttons[0] && gp.buttons[0].pressed) inp.fire = true; else if (inp.gpHeld) inp.fire = false;

function updateRun(dt) {

  const range = R.Zend - R.z;

  if (R.armT > 0) R.armT -= dt;
  R.cool -= dt;

    if (ddx * ddx + ddy * ddy < 0.42 * 0.42) { b.hit = true; b.grp.hit = true; hit(1); burst(S.x, S.y, R.z + 2, 26, 14, [C_WHITE, C_AMB], 0.7, 0.9); }
  }
  for (const g of R.groups) if (!g.scored && g.z1 < R.z - 1) { g.scored = true; if (!g.hit) { G.score += 50 * G.level; sfx('ping'); } }

    if (dz < 32 || dz > 110) { t.glow = 0; continue; }
    if (t.t < 0) t.t = 0.5 + Math.random() * 0.9;
    t.t -= dt; t.glow = t.t < 0.4 ? 1 : 0;
    if (t.t <= 0) { ballFrom(t.x - t.s * 0.8, t.y, t.z - 0.8); t.t = lerp(2.6, 1.5, diff) + Math.random() * 0.5; }
  }

    }

  get run() { return run; },
  shot(name) { // deterministic frames for the gallery cover and for tests
    G.frozen = false; G.paused = false; G.score = 0; G.hi = Math.max(G.hi, 12300); inp.mouse = false; G.t = 3.3; G.inv = 0;
    const T = window.TRENCH, lvl = (n) => { G.level = n; G.shield = 6; G.attempt = 0; };
    const ball = (x, y, z, vx, vy, vz) => run.balls.push({ x, y, z, vx, vy, vz, age: 0.3, rel: z - run.z });
    if (name === 'title') { G.phase = 'title'; G.tt = 4; G.banner = null; hideCap(); }
    else if (name === 'approach') { lvl(1); G.phase = 'approach'; G.pt = 3.35; G.banner = null; hideCap(); }
    else if (name === 'gate' || name === 'gate2' || name === 'pillars') {
      lvl(1); G.shield = 5; G.score = 4350; runTo(0, { fresh: true });
      const gi = name === 'pillars' ? run.groups.findIndex((g) => !g.open && g.z1 - g.z0 > 20) : name === 'gate2' ? run.groups.findIndex((g, i) => g.open && i > 3) : run.groups.findIndex((g) => g.open);
      const g = run.groups[Math.max(0, gi)], o = g.open || { x0: 0, x1: 0, y0: YC, y1: YC };
      runTo(g.z0 - (name === 'gate' ? 26 : 40), { x: ((o.x0 + o.x1) / 2) * 0.5 - 0.5, y: ((o.y0 + o.y1) / 2) * 0.75 + 1.3, roll: 0.07 });
      run.armed = false; G.banner = null;
      if (name === 'gate') ball(S.x + 2.2, S.y + 1.6, run.z + 30, -2, -3, -38);
    } else if (name === 'tie') {
      lvl(2); G.shield = 4; G.score = 9150; runTo(0, { fresh: true });
      const e = run.ties[0]; e.ph = Math.asin(1.7 / e.amp) - G.t * e.w; e.x = 1.7; e.y = YC + 2.4 * Math.sin(G.t * e.w * 0.8 + e.ph);
      runTo(e.z - 46, { x: -0.6, y: 5.4, roll: -0.05 }); run.armed = false; G.banner = null;
      ball(1.2, 8.4, run.z + 20, -1, -2, -36); run.bolts.push({ x: -1.4, y: 4.9, z: run.z + 14, vx: 3, vy: 0.4, vz: BOLT_V, l: 1 }, { x: 0.2, y: 4.9, z: run.z + 14, vx: 1, vy: 0.4, vz: BOLT_V, l: 1 });
    } else if (name === 'tie2') {
      lvl(2); runTo(0, { fresh: true });
      const e = run.ties[0]; e.ph = Math.asin(1.2 / e.amp) - G.t * e.w; e.x = 1.2; e.y = YC + 2.4 * Math.sin(G.t * e.w * 0.8 + e.ph);
      runTo(e.z - 14, { x: -0.4, y: 5.6 }); run.armed = false; G.banner = null;
    } else if (name === 'port' || name === 'lock' || name === 'torpedo') {
      lvl(1); G.score = 18950; runTo(0, { fresh: true });
      const p = run.port; run.armed = true; run.z = run.Zend - (name === 'torpedo' ? 120 : 90);
      S.x = S.tx = name === 'port' ? p.x - 1.3 : p.x + 0.1; S.y = S.ty = name === 'port' ? p.y + 0.9 : p.y - 0.1; S.roll = name === 'port' ? 0.05 : 0;
      run.locked = name !== 'port';
      if (name === 'torpedo') { run.locked = false; run.torpLeft = 1; run.torps.push({ x: p.x, y: p.y, z: run.z + 62, vz: 190, t: 0.3 }); S.x = S.tx = p.x - 0.2; S.y = S.ty = p.y - 0.15; }
      G.banner = null; hideCap();
    } else if (/^boom/.test(name)) {
      lvl(1); G.shield = 5; G.score = 24350; runTo(0, { fresh: true }); run.bonus = [['TORPEDO HIT', 10000], ['SHIELD 5 x 1000', 5000]];
      startBoom(); G.banner = null; hideCap();
      T.step(name === 'boom0' ? 1.15 : name === 'boom' ? 1.6 : name === 'boom2' ? 2.2 : name === 'boom4' ? 3.0 : 5.8);
    } else if (name === 'over') {
      lvl(1); G.shield = 0; G.score = 8300; runTo(0, { fresh: true }); run.z = 260; die(); T.step(3.2);
    }
    G.frozen = true; G.t = G.t || 1; document.body.dataset.phase = G.phase;
  },
};

/* ---------- boot ---------- */
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
setText();
window.addEventListener('load', resize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
requestAnimationFrame(frame);
})();
</script>
