<!DOCTYPE html>
<html lang="ja" data-phos="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>HELIOS/OS 2.3 — Heliograph HX-14 端末（架空）</title>
<meta name="description" content="1987年の架空の OS「HELIOS/OS」を、蛍光管の CRT ごと再現した端末シミュレーション。起動画面、動くシェル、文字の雨、宇宙天気、スネークゲーム。日本語と英語に対応。">
<meta name="theme-color" content="#1f2023">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
:root{
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono", "BIZ UDGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans Mono CJK JP", "Yu Gothic", "MS Gothic", monospace;
  --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  --fg: #33ff66; --bg: #031a07; --rgb: 51,255,102; --bgrgb: 3,26,7; --hot: #d2ffdc;
  --fs: clamp(12.5px, min(1.5vw, 2.3vh), 23px);
  --lh: 1.32;
  --sl: calc(var(--fs) * 1.8);
  --bz: clamp(10px, 2.4vmin, 30px);
  --padx: clamp(12px, 2.9vmin, 40px);
  --pady: clamp(10px, 2.3vmin, 30px);
  --glow: 0 0 1px rgba(var(--rgb), .9), 0 0 5px rgba(var(--rgb), .42), 0 0 15px rgba(var(--rgb), .2);
  --glow-hot: 0 0 1px #fff, 0 0 4px rgba(var(--rgb), .95), 0 0 12px rgba(var(--rgb), .6), 0 0 30px rgba(var(--rgb), .3);
  color-scheme: dark;
}
:root[data-phos="amber"]{ --fg: #ffb000; --bg: #1a0f00; --rgb: 255,176,0; --bgrgb: 26,15,0; --hot: #ffe7b3; }
:root[data-phos="ice"]{ --fg: #9fe7ff; --bg: #03111a; --rgb: 159,231,255; --bgrgb: 3,17,26; --hot: #f0fcff; }

*, *::before, *::after{ box-sizing: border-box; }
html, body{ margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
body{ font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
.sr{ position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- the monitor: bezel, mask, tube ---------- */
.monitor{
  position: fixed; left: 0; top: 0; width: 100%; height: var(--vvh, 100vh);
  display: grid; grid-template-rows: minmax(0, 1fr) auto;
  padding: calc(var(--bz) + env(safe-area-inset-top)) calc(var(--bz) + env(safe-area-inset-right)) 0 calc(var(--bz) + env(safe-area-inset-left));
  background:
    radial-gradient(90% 55% at 50% 0%, rgba(255,255,255,.06), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #2c2d31 0%, #232427 42%, #1b1c1f 100%);
}
.mask{
  position: relative; min-height: 0; padding: clamp(3px, .7vmin, 9px);
  border-radius: clamp(14px, 3vmin, 38px);
  background: linear-gradient(180deg, #0c0c0e, #141518);
  box-shadow: inset 0 3px 9px rgba(0,0,0,.95), inset 0 -1px 1px rgba(255,255,255,.07), 0 -1px 0 rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.08);
}
.tube{
  position: relative; height: 100%; overflow: hidden; isolation: isolate; cursor: text; touch-action: manipulation;
  border-radius: clamp(12px, 2.7vmin, 34px) / clamp(15px, 3.5vmin, 44px);
  background: radial-gradient(ellipse 78% 72% at 50% 46%, rgba(var(--rgb), .085), rgba(var(--rgb), .025) 58%, transparent 86%), var(--bg);
  transition: background-color .4s;
}
.tube.game{ touch-action: none; cursor: default; }
.flick, .raster{ position: absolute; inset: 0; }
.flick{ animation: flicker 6.3s steps(1, end) infinite; }
.raster{ transform-origin: 50% 50%; }
.raster.off{ transform: scale(0, 0); }

/* ---------- terminal text ---------- */
.term{
  position: absolute; left: 0; right: 0; top: 0; bottom: var(--sl);
  padding: var(--pady) var(--padx);
  font: 400 var(--fs)/var(--lh) var(--mono); color: var(--fg); text-shadow: var(--glow);
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all; tab-size: 8;
  font-variant-ligatures: none; font-kerning: none; font-synthesis: none;
}
.screen{ overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; transition: opacity .6s; }
.screen::-webkit-scrollbar{ display: none; }
.screen.hush{ opacity: 0; }
.o{ min-height: calc(var(--fs) * var(--lh)); }
.h{ color: var(--hot); text-shadow: var(--glow-hot); }
.d{ color: rgba(var(--rgb), .56); text-shadow: 0 0 4px rgba(var(--rgb), .25); }
.i{ background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 12px rgba(var(--rgb), .45); }
.w{ display: inline-block; width: 2ch; text-align: center; }
.blink{ animation: blink2 .9s steps(1, end) infinite; }
.post{ position: relative; }
.post-badge{ position: absolute; right: 0; top: 0; margin: 0; font: inherit; text-align: center; animation: fadein .5s ease-out both; }
.inp[hidden]{ display: none; }
.caret{ background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 10px rgba(var(--rgb), .65); animation: cblink 1.06s steps(1, end) infinite; }
.caret.solid{ animation: none; }
.blurred .caret{ animation: none; background: transparent; color: var(--fg); text-shadow: var(--glow); box-shadow: inset 0 0 0 1px var(--fg), 0 0 6px rgba(var(--rgb), .35); }
.ghost{ overflow: hidden; pointer-events: none; opacity: 0; }
.ghost.on{ animation: ghost 1.5s cubic-bezier(.2,.6,.3,1) forwards; }
.rain{ position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--sl)); opacity: 0; transition: opacity .8s; pointer-events: none; }
.rain.on{ opacity: 1; }
.snake{ margin: 0; font: inherit; white-space: pre; }
.snake .pel{ animation: blink2 .5s steps(1, end) infinite; }

/* ---------- status line (inverse video) ---------- */
.status{
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--sl);
  display: flex; align-items: center; padding: 0 calc(var(--padx) - .6ch);
  background: rgba(var(--rgb), .9); color: var(--bg);
  font: 700 calc(var(--fs) * .76)/1 var(--mono); letter-spacing: .02em; white-space: nowrap; overflow: hidden;
  box-shadow: 0 0 18px rgba(var(--rgb), .45), 0 0 2px rgba(var(--rgb), .9);
}
.status > *{ flex: none; padding: 0 .6ch; }
.status .sp{ flex: 1; }
.status .sep{ padding: 0; width: 1px; height: 46%; background: rgba(var(--bgrgb), .35); }
.sbtn{ appearance: none; border: 0; margin: 0; height: 100%; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; }
.sbtn:hover{ background: rgba(var(--bgrgb), .16); }
.sbtn:focus-visible{ outline: 2px solid var(--bg); outline-offset: -4px; }

/* ---------- glass: scanlines, grille, grain, roll, vignette, reflection ---------- */
.fx{ position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
.scan{ background: repeating-linear-gradient(180deg, transparent 0 2px, rgba(0,0,0,.32) 2px 3px); }
.grille{ background: repeating-linear-gradient(90deg, rgba(255,50,50,.06) 0 1px, rgba(50,255,80,.06) 1px 2px, rgba(70,90,255,.06) 2px 3px); mix-blend-mode: screen; }
.grain{ width: 100%; height: 100%; opacity: .055; mix-blend-mode: screen; }
.roll{ inset: 0 0 auto 0; height: 24%; border-radius: 0; background: linear-gradient(180deg, transparent, rgba(var(--rgb), .035) 40%, rgba(var(--rgb), .065) 50%, rgba(var(--rgb), .035) 60%, transparent); animation: roll 9s linear infinite; }
.vig{
  background: radial-gradient(ellipse 74% 70% at 50% 50%, transparent 58%, rgba(0,0,0,.32) 84%, rgba(0,0,0,.78) 100%);
  box-shadow: inset 0 0 clamp(24px, 6vmin, 80px) rgba(0,0,0,.8), inset 0 0 clamp(4px, 1vmin, 12px) rgba(0,0,0,.95), inset 0 clamp(6px, 1.4vmin, 16px) clamp(10px, 2.4vmin, 28px) -6px rgba(0,0,0,.6);
}
.glass{
  background:
    radial-gradient(ellipse 46% 30% at 24% 10%, rgba(255,255,255,.075), transparent 72%),
    radial-gradient(ellipse 30% 18% at 82% 92%, rgba(255,255,255,.025), transparent 70%),
    linear-gradient(166deg, rgba(255,255,255,.04) 0%, transparent 34%, transparent 72%, rgba(255,255,255,.018) 100%);
}
.beam{ position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(var(--rgb), .9) 12%, #fff 50%, rgba(var(--rgb), .9) 88%, transparent);
  box-shadow: 0 0 12px 2px rgba(var(--rgb), .85), 0 0 44px 8px rgba(var(--rgb), .35); }
.spot{ position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; opacity: 0; pointer-events: none; background: #fff;
  box-shadow: 0 0 10px 4px rgba(var(--rgb), .95), 0 0 34px 12px rgba(var(--rgb), .4); }
.kbd{ position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; }

/* power, degauss, glitch */
.raster.pon{ animation: rasterOn .95s cubic-bezier(.2,.7,.2,1) both; }
.beam.pon{ animation: beamOn .95s ease-out both; }
.raster.poff{ animation: rasterOff .75s cubic-bezier(.6,0,.8,.4) forwards; }
.spot.poff{ animation: spotOff 1.4s ease-out forwards; }
.raster.degauss{ animation: degauss 1s cubic-bezier(.2,.7,.3,1); }
.raster.glitch{ animation: glitch .2s steps(3, end); }
.raster.vbell{ animation: vbell .18s ease-out; }

@keyframes flicker{ 0%{opacity:1} 7%{opacity:.968} 7.6%{opacity:1} 31%{opacity:.986} 32%{opacity:1} 55%{opacity:.958} 55.5%{opacity:.992} 56.2%{opacity:1} 78%{opacity:.975} 79%{opacity:1} 93%{opacity:.985} 93.4%{opacity:1} }
@keyframes roll{ from{ transform: translateY(-100%); } to{ transform: translateY(520%); } }
@keyframes rasterOn{ 0%{ transform: scale(0, .004); filter: brightness(4); } 34%{ transform: scale(1, .004); filter: brightness(4); } 68%{ transform: scale(1, 1.025); filter: brightness(1.6); } 100%{ transform: none; filter: none; } }
@keyframes beamOn{ 0%{ opacity: 1; transform: scaleX(0); } 34%{ opacity: 1; transform: scaleX(1); } 62%{ opacity: 0; transform: scaleX(1) scaleY(24); } 100%{ opacity: 0; } }
@keyframes rasterOff{ 0%{ transform: none; filter: none; } 48%{ transform: scale(1, .004); filter: brightness(5); } 85%{ transform: scale(.003, .004); filter: brightness(9); } 100%{ transform: scale(0, 0); filter: brightness(9); } }
@keyframes spotOff{ 0%, 48%{ opacity: 0; transform: scale(1); } 58%{ opacity: 1; transform: scale(1.4); } 100%{ opacity: 0; transform: scale(.3); } }
@keyframes degauss{
  0%{ transform: none; filter: none; }
  9%{ transform: skewX(7deg) scale(1.035, .975); filter: hue-rotate(110deg) saturate(2.2) brightness(1.3); }
  22%{ transform: skewX(-5deg) scale(.98, 1.025); filter: hue-rotate(-80deg) saturate(1.8); }
  38%{ transform: skewX(3deg) scale(1.012, .992); filter: hue-rotate(45deg); }
  56%{ transform: skewX(-1.5deg) scale(.996, 1.006); filter: hue-rotate(-22deg); }
  76%{ transform: skewX(.6deg); filter: hue-rotate(8deg); }
  100%{ transform: none; filter: none; }
}
@keyframes glitch{ 0%{ transform: translate(0, -1.6%) skewX(-4deg); filter: brightness(1.4); } 33%{ transform: translate(1.1%, .9%); } 66%{ transform: translate(-.6%, 0) skewX(1.5deg); } 100%{ transform: none; filter: none; } }
@keyframes vbell{ 0%{ filter: brightness(2) contrast(1.2); } 100%{ filter: none; } }
@keyframes ghost{ 0%{ opacity: .72; filter: blur(0); } 100%{ opacity: 0; filter: blur(4px); } }
@keyframes cblink{ 50%{ background: transparent; color: var(--fg); box-shadow: none; text-shadow: var(--glow); } }
@keyframes blink2{ 50%{ opacity: .15; } }
@keyframes fadein{ from{ opacity: 0; } to{ opacity: 1; } }
@keyframes ledact{ 50%{ opacity: .35; } }

/* ---------- chin: badge, keys, power ---------- */
.chin{
  display: flex; align-items: center; gap: clamp(12px, 2.2vw, 30px); min-width: 0;
  padding: clamp(9px, 1.6vmin, 18px) calc(var(--bz) + env(safe-area-inset-right)) calc(clamp(9px, 1.6vmin, 18px) + env(safe-area-inset-bottom)) calc(var(--bz) + env(safe-area-inset-left));
}
.badge{
  flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 10px; border-radius: 3px;
  background: linear-gradient(180deg, #3c3e43, #2d2f33); color: #131416; text-shadow: 0 1px 0 rgba(255,255,255,.15);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.6);
}
.badge svg{ width: 18px; height: 18px; flex: none; filter: drop-shadow(0 1px 0 rgba(255,255,255,.14)); }
.badge b{ font: 800 10px/1 var(--sans); letter-spacing: .36em; margin-right: -.36em; }
.badge span{ font: 700 9px/1 var(--mono); letter-spacing: .14em; padding-left: 10px; border-left: 1px solid rgba(0,0,0,.4); box-shadow: -1px 0 0 rgba(255,255,255,.07); }
.keys{ flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 3px 2px 7px; }
.keys::-webkit-scrollbar{ display: none; }
.row{ display: flex; align-items: flex-end; gap: clamp(12px, 1.7vw, 24px); width: max-content; margin: 0 auto; }
.grp{ display: flex; flex-direction: column; gap: 7px; }
.grp[hidden]{ display: none; }
.grp > span{ font: 700 8px/1 var(--sans); letter-spacing: .28em; color: #64666b; text-shadow: 0 1px 0 rgba(0,0,0,.6); padding-left: 2px; }
.grp > div{ display: flex; gap: 6px; }
.key{
  appearance: none; border: 0; margin: 0; position: relative; flex: none; height: 30px; min-width: 44px; padding: 0 12px; border-radius: 5px; cursor: pointer;
  font: 700 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: #c3c5c9;
  background: linear-gradient(180deg, #37393e, #2b2d31 58%, #26282b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09), inset 0 -2px 0 rgba(0,0,0,.32), 0 2px 0 #111214, 0 3px 7px rgba(0,0,0,.45);
  transition: transform .07s, box-shadow .07s, color .2s;
}
.key:hover{ color: #eceef1; }
.key:active, .key.down{ transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3), 0 0 0 #111214, 0 1px 2px rgba(0,0,0,.5); }
.key:focus-visible, .pwr:focus-visible{ outline: 2px solid var(--fg); outline-offset: 3px; }
.key.wide{ min-width: 64px; }
.key.arw{ font-size: 15px; letter-spacing: 0; }
.pip{ display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; background: #111214; box-shadow: inset 0 1px 1px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06); transition: background .2s, box-shadow .2s; }
.key[aria-pressed="true"] .pip{ background: var(--c, var(--fg)); box-shadow: 0 0 5px var(--c, var(--fg)), 0 0 11px var(--c, var(--fg)); }
.power{ flex: none; display: flex; align-items: center; gap: 12px; }
.power > span{ font: 700 8px/1 var(--sans); letter-spacing: .28em; color: #64666b; }
.led{ width: 7px; height: 7px; border-radius: 50%; background: #1c281e; box-shadow: inset 0 1px 1px rgba(0,0,0,.85); transition: background .3s, box-shadow .3s; }
.led.on{ background: #86ffa6; box-shadow: 0 0 4px #5dff88, 0 0 12px rgba(93,255,136,.55); }
.led.act{ animation: ledact .16s steps(1, end) infinite; }
.pwr{ width: 30px; height: 30px; min-width: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.pwr svg{ width: 13px; height: 13px; }

.keys.ovf{ -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.keys.ovf.end{ -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px); mask-image: linear-gradient(90deg, transparent, #000 36px); }
@media (max-width: 1340px){
  .badge span, .power > span{ display: none; }
  .key{ padding: 0 9px; min-width: 40px; }
  .grp > div{ gap: 5px; }
  .row{ gap: 14px; }
}
@media (max-width: 1080px){
  .badge b{ display: none; }
  .badge{ padding: 7px; }
}
@media (max-width: 600px), (max-height: 520px){
  .badge{ display: none; }
  .grp > span{ display: none; }
  .key{ height: 36px; }
  .pwr{ width: 36px; height: 36px; }
  .s-os, .s-host, .s-baud{ display: none; }
}
@media (max-width: 420px){
  .s-tty{ display: none; }
  .key{ min-width: 40px; padding: 0 8px; }
  .key.wide{ min-width: 0; }
  .grp > div{ gap: 4px; }
  .power{ gap: 8px; }
}
@media (prefers-reduced-motion: reduce){
  .flick, .roll{ animation: none; }
  .roll, .beam, .spot{ display: none; }
  .raster.pon, .raster.degauss, .raster.glitch, .raster.vbell{ animation: none; }
  .caret{ animation: none; }
  .ghost.on{ animation-duration: .4s; }
}
</style>
</head>
<body>
<main class="monitor" id="monitor">
  <h1 class="sr" id="title">HELIOS/OS 2.3 — Heliograph HX-14</h1>
  <div class="mask">
    <section class="tube" id="tube" aria-labelledby="title">
      <div class="flick"><div class="raster off" id="raster">
        <div class="term screen" id="screen" role="log" aria-live="off"><div id="log"></div><div class="inp o" id="inp" hidden><span id="ps"></span><span id="ib"></span><span class="caret" id="car"> </span><span id="ia"></span></div></div>
        <div class="term ghost" id="ghost" aria-hidden="true"></div>
        <canvas class="rain" id="rain" aria-hidden="true"></canvas>
        <div class="status" id="status" role="toolbar" aria-label="Status line">
          <span class="s-os">HELIOS/OS 2.3</span><span class="sep s-os"></span>
          <span class="s-tty">tty1</span><span class="sep s-tty"></span>
          <span class="s-host">operator@relay-7</span>
          <span class="sp"></span>
          <button type="button" class="sbtn" id="sPhos">[P1:GRN]</button>
          <button type="button" class="sbtn" id="sSnd" aria-pressed="false">[SND:OFF]</button>
          <button type="button" class="sbtn" id="sLang">[JA]</button>
          <span class="sep s-baud"></span><span class="s-baud" id="sBaud">19200bd</span>
          <span class="sep"></span><span class="s-clk" id="sClk">--:--:--</span>
        </div>
      </div></div>
      <div class="fx scan"></div>
      <div class="fx grille"></div>
      <canvas class="fx grain" id="grain" width="160" height="100"></canvas>
      <div class="fx roll"></div>
      <div class="fx vig"></div>
      <div class="fx glass"></div>
      <div class="beam" id="beam"></div>
      <div class="spot" id="spot"></div>
      <input class="kbd" id="kbd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal input">
    </section>
  </div>
  <footer class="chin">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1"/></svg>
      <b>HELIOGRAPH</b><span>HX-14</span>
    </div>
    <nav class="keys" id="keys" aria-label="Terminal keys">
      <div class="row">
        <div class="grp" id="gCmd"><span>COMMAND</span><div>
          <button type="button" class="key" data-cmd="help">Help</button>
          <button type="button" class="key" data-cmd="ls">Ls</button>
          <button type="button" class="key" data-cmd="cat poem.txt">Poem</button>
          <button type="button" class="key" data-cmd="cat mission.log">Log</button>
          <button type="button" class="key" data-cmd="weather">Weather</button>
          <button type="button" class="key" data-cmd="snake">Snake</button>
          <button type="button" class="key" data-cmd="matrix">Matrix</button>
          <button type="button" class="key" data-cmd="clear">Clear</button>
        </div></div>
        <div class="grp" id="gPad" hidden><span>SNAKE</span><div>
          <button type="button" class="key arw" data-dir="left" aria-label="Left">←</button>
          <button type="button" class="key arw" data-dir="up" aria-label="Up">↑</button>
          <button type="button" class="key arw" data-dir="down" aria-label="Down">↓</button>
          <button type="button" class="key arw" data-dir="right" aria-label="Right">→</button>
          <button type="button" class="key wide" data-dir="pause">Pause</button>
          <button type="button" class="key wide" data-dir="quit">Quit</button>
        </div></div>
        <div class="grp"><span>PHOSPHOR</span><div>
          <button type="button" class="key" data-phos="green" style="--c:#33ff66" aria-pressed="true"><i class="pip"></i>P1</button>
          <button type="button" class="key" data-phos="amber" style="--c:#ffb000" aria-pressed="false"><i class="pip"></i>P3</button>
          <button type="button" class="key" data-phos="ice" style="--c:#9fe7ff" aria-pressed="false"><i class="pip"></i>Ice</button>

/* paths */
const normPath = (p) => {
  if (!p) return S.cwd;
  if (p === '~' || p.startsWith('~/')) p = HOME + p.slice(1);
  const out = [];
  for (const s of (p.startsWith('/') ? p : S.cwd + '/' + p).split('/')) {
    if (!s || s === '.') continue;
    if (s === '..') out.pop();
    else out.push(s);
  }
  return '/' + out.join('/');
};
const lookup = (abs) => {
  let n = FS;
  if (abs === '/') return n;
  for (const s of abs.slice(1).split('/')) {
    if (!n || n.t !== 'd' || !Object.prototype.hasOwnProperty.call(n.c, s)) return null;
    n = n.c[s];
  }
  return n;
};
const tilde = (abs) => (abs === HOME ? '~' : abs.startsWith(HOME + '/') ? '~' + abs.slice(HOME.length) : abs);
const bodyOf = (n) => {
  const b = pick(n.body);
  return (typeof b === 'function' ? b() : b || '').replace(/\{rule\}/g, () => '{d|' + '─'.repeat(clamp(M.cols - 1, 16, 58)) + '}');
};
const enc = new TextEncoder();
const sizeOf = (n) => (n.t === 'd' ? 512 : n.bin ? n.size : enc.encode(bodyOf(n).replace(/\{\w\|([^}]*)\}/g, '$1')).length);

/* ---------- screen, columns and the line printer ---------- */
const screen = $('screen'), logEl = $('log'), inp = $('inp'), psEl = $('ps'), ib = $('ib'), car = $('car'), ia = $('ia');
const kbd = $('kbd'), raster = $('raster'), tube = $('tube'), ghost = $('ghost'), led = $('led'), srEl = $('sr');

/* East Asian wide characters take two cells; each one sits in a 2ch box so the grid holds */
const isWide = (c) =>
  (c >= 0x1100 && c <= 0x115f) || (c >= 0x2e80 && c <= 0x303e) || (c >= 0x3040 && c <= 0x33ff) ||
  (c >= 0x3400 && c <= 0x4dbf) || (c >= 0x4e00 && c <= 0x9fff) || (c >= 0xa000 && c <= 0xa4cf) ||
  (c >= 0xac00 && c <= 0xd7a3) || (c >= 0xf900 && c <= 0xfaff) || (c >= 0xfe30 && c <= 0xfe4f) ||
  (c >= 0xff00 && c <= 0xff60) || (c >= 0xffe0 && c <= 0xffe6) || (c >= 0x1f300 && c <= 0x1faff) || (c >= 0x20000 && c <= 0x3fffd);

const padL = (s, n) => ' '.repeat(Math.max(0, n - wlen(s))) + s;

const appendText = (el, s) => {
  const last = el.lastChild;
  if (last && last.nodeType === 3) last.appendData(s);
  else el.appendChild(document.createTextNode(s));
};
const appendChars = (el, str) => {
  let run = '';
  for (const ch of str) {
    if (isWide(ch.codePointAt(0))) {
      if (run) { appendText(el, run); run = ''; }
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = ch;
      el.appendChild(w);
    } else run += ch;
  }
  if (run) appendText(el, run);
};
const setRich = (el, s) => { el.replaceChildren(); appendChars(el, s); };

/* markup: {h|hot} {d|dim} {i|inverse}; a segment is [text, class] */
const fmt = (str, cls = '') => {
  const segs = [], re = /\{([hdi])\|([^}]*)\}/g;
  let last = 0, m;
  while ((m = re.exec(str))) {
    if (m.index > last) segs.push([str.slice(last, m.index), cls]);
    segs.push([m[2], m[1]]);
    last = re.lastIndex;
  }
  if (last < str.length) segs.push([str.slice(last), cls]);
  return segs;
};
const toSegs = (x) => (typeof x === 'string' ? fmt(x) : x.flatMap((y) => (typeof y === 'string' ? fmt(y) : [y])));
const writeSegs = (el, segs) => {
  for (const [tx, c] of segs) {
    const sp = document.createElement('span');
    if (c) sp.className = c;
    appendChars(sp, tx);
    el.appendChild(sp);
  }
};
const plain = (s) => s.replace(/\{[hdi]\|([^}]*)\}/g, '$1');

/* measuring the character grid */
const M = { cols: 80, rows: 24, cw: 9, lh: 20, fs: 15 };
const probe = document.createElement('span');
probe.className = 'term';
probe.setAttribute('aria-hidden', 'true');
probe.style.cssText = 'position:fixed;left:-9999px;top:0;right:auto;bottom:auto;padding:0;visibility:hidden;white-space:pre';
probe.textContent = '0'.repeat(100);
document.body.appendChild(probe);
const measure = () => {
  const r = probe.getBoundingClientRect(), cs = getComputedStyle(screen);
  M.cw = r.width / 100 || 9;
  M.lh = r.height || 20;
  M.fs = parseFloat(cs.fontSize) || 15;
  const w = screen.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = screen.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (w > 0) M.cols = Math.max(20, Math.floor(w / M.cw + 0.02));
  if (h > 0) M.rows = Math.max(6, Math.floor(h / M.lh + 0.02));
};

/* the queue: text streams at the line speed; waits, calls and small animations keep their place */
const Q = [];
let budget = 0, dirty = false, lastBlock = null, wasBusy = false, srMark = null;
const cps = () => (reduced || S.baud === 'max' ? Infinity : S.baud / 10);
const out = (x, cls) => Q.push({ k: 'text', segs: toSegs(x), cls });
const more = (x) => Q.push({ k: 'text', segs: toSegs(x), cont: true });
const into = (el, x) => Q.push({ k: 'text', segs: toSegs(x), into: el });

const anim = (step, end) => Q.push({ k: 'anim', step, end });

const newBlock = (cls) => {
  const b = document.createElement('div');
  b.className = 'o' + (cls ? ' ' + cls : '');
  logEl.appendChild(b);
  lastBlock = b;
  if (logEl.childElementCount > 520) for (let i = 0; i < 60; i++) logEl.firstElementChild.remove();
  return b;
};
const begin = (it) => {
  const b = it.into || (it.cont && lastBlock) || newBlock(it.cls);
  it.parts = it.segs.map(([tx, c]) => {
    const sp = document.createElement('span');
    if (c) sp.className = c;
    b.appendChild(sp);
    return { el: sp, chars: Array.from(tx) };
  });
  it.si = 0; it.ci = 0;
};
const pump = (dt, fast) => {
  let time = dt;
  if (!fast) budget = Math.min(budget + (cps() * dt) / 1000, 1e9);
  while (Q.length) {
    const it = Q[0];
    if (it.k === 'text') {
      if (!it.parts) begin(it);
      while (it.si < it.parts.length) {
        const p = it.parts[it.si];
        const n = fast ? p.chars.length - it.ci : Math.min(p.chars.length - it.ci, Math.floor(budget));
        if (n > 0) {
          appendChars(p.el, p.chars.slice(it.ci, it.ci + n).join(''));
          it.ci += n; dirty = true;
          if (!fast) budget -= n;
          if (S.sound && !fast && S.baud !== 'max' && S.baud <= 2400) tick();
        }
        if (it.ci < p.chars.length) return;
        it.si++; it.ci = 0;
      }
      Q.shift();
    } else if (it.k === 'wait') {
      if (!fast && !reduced) {
        it.left = (it.left ?? it.ms) - time;
        time = 0; budget = 0;
        if (it.left > 0) return;
      }
      Q.shift();
    } else if (it.k === 'call') {
      Q.shift(); it.fn(fast);
    } else if (it.k === 'put') {
      Q.shift();
      const el = it.make();
      if (el) { logEl.appendChild(el); lastBlock = el; dirty = true; }
    } else if (it.k === 'anim') {
      if (!fast && !reduced) {
        const done = it.step(time);
        time = 0; budget = 0; dirty = true;
        if (!done) return;
      }
      Q.shift(); it.end(); dirty = true;
    }
  }
};
const flush = () => { pump(0, true); settle(); };
const settle = () => {
  if (dirty) { screen.scrollTop = screen.scrollHeight; dirty = false; }
  const busy = Q.length > 0;
  if (busy !== wasBusy) {
    wasBusy = busy;
    led.classList.toggle('act', busy && !reduced);
    if (!busy) { budget = 0; idle(); }
  }
  showInput();
};
const idle = () => {
  if (S.mode !== 'shell') return;
  if (srMark !== undefined) {
    let n = srMark ? srMark.nextElementSibling : logEl.firstElementChild, s = '';
    while (n && s.length < 700) { s += n.textContent + '\n'; n = n.nextElementSibling; }
    srEl.textContent = s.trim();
    srMark = undefined;
  }
  if (pendingReply) deliverReply();
};

/* the input line: an invisible <input> mirrored into the glowing text */
const promptSegs = () => [[`${USER}@${HOST}`, 'h'], [':', ''], [tilde(S.cwd), 'd'], ['$ ', '']];
const renderPrompt = () => { psEl.replaceChildren(); writeSegs(psEl, promptSegs()); };
const renderInput = () => {

const showInput = () => {

/* ---------- the sun emblem (procedural, block-shaded) and the logo ---------- */
const sunArt = (w, h, R, rays, g0, L1, L2, rw) => {
  const cx = (w - 1) / 2, cy = (h - 1) / 2, rows = [];
  for (let y = 0; y < h; y++) {
    let row = '';
    for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = (y - cy) * 2.1, r = Math.hypot(dx, dy);
      const k = (Math.atan2(dy, dx) / (2 * Math.PI)) * rays, n = Math.round(k);
      const off = Math.abs(k - n) * ((2 * Math.PI) / rays) * r, len = n % 2 === 0 ? L1 : L2;
      let c = ' ';
      if (r < R * 0.72) c = '█';
      else if (r < R * 0.9) c = '▓';
      else if (r < R + 0.4) c = '▒';
      else if (r > R + g0 && r < R + len && off < rw) c = r < R + g0 + len * 0.45 ? '▒' : '░';
      row += c;
    }
    rows.push(row);
  }
  while (rows.length && !rows[0].trim()) rows.shift();
  while (rows.length && !rows[rows.length - 1].trim()) rows.pop();
  return rows;
};
const SUN_BIG = sunArt(29, 11, 6.1, 16, 1.2, 6.4, 3.6, 0.62);
const SUN_SMALL = sunArt(17, 7, 3.9, 8, 1.1, 4.6, 3.2, 0.62);
/* a row of text split into runs by character class */
const runs = (row, cls) => {
  const segs = [];
  for (const ch of row) {
    const c = cls(ch), last = segs[segs.length - 1];
    if (last && last[1] === c) last[0] += ch;
    else segs.push([ch, c]);
  }
  return segs;
};
const sunCls = (ch) => (ch === '█' ? 'h' : ch === '░' ? 'd' : '');
const logoCls = (ch) => (ch === '█' ? 'h' : ch === ' ' ? '' : 'd');
const LOGO_BIG = (() => {
  const G = [
    ['██╗  ██╗', '██║  ██║', '███████║', '██╔══██║', '██║  ██║', '╚═╝  ╚═╝'],
    ['███████╗', '██╔════╝', '█████╗  ', '██╔══╝  ', '███████╗', '╚══════╝'],
    ['██╗     ', '██║     ', '██║     ', '██║     ', '███████╗', '╚══════╝'],
    ['██╗', '██║', '██║', '██║', '██║', '╚═╝'],
    [' ██████╗ ', '██╔═══██╗', '██║   ██║', '██║   ██║', '╚██████╔╝', ' ╚═════╝ '],
    ['███████╗', '██╔════╝', '███████╗', '╚════██║', '███████║', '╚══════╝'],
  ];
  return G[0].map((_, i) => G.map((g) => g[i]).join(''));
})();
const LOGO_SMALL = ['╦ ╦╔═╗╦  ╦╔═╗╔═╗', '╠═╣║╣ ║  ║║ ║╚═╗', '╩ ╩╚═╝╩═╝╩╚═╝╚═╝'];

/* ---------- the welcome banner: logo, sun beside a system card, message of the day ---------- */
const UP0 = 412 * 86400 + 7 * 3600 + 22 * 60;
const upSecs = () => UP0 + Math.floor((Date.now() - S.t0) / 1000);
const upText = () => {
  const s = upSecs(), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return S.lang === 'ja' ? `${d}日 ${h}時間${p2(m)}分` : `${d}d ${p2(h)}h ${p2(m)}m`;
};
const cardRows = () => {
  const K = S.lang === 'ja'
    ? ['OS', '機種', 'カーネル', '稼働時間', 'シェル', '端末', 'CPU', 'メモリ', '回線']
    : ['OS', 'Host', 'Kernel', 'Uptime', 'Shell', 'Term', 'CPU', 'Memory', 'Link'];
  const V = [
    'HELIOS/OS 2.3 "Aphelion"', 'Heliograph HX-14', 'helix 2.3.11-rt hx68k', upText(), 'hsh 1.4',
    `${M.cols}×${M.rows} · ${PHOS[S.phos][S.lang]}`, 'HX-68020 @ 16.67 MHz', '1.3M / 4.0M', 'UPLINK-7 · 2400 bd',
  ];
  const kw = Math.max(...K.map(wlen)) + 2;
  return [
    [[`${USER}@${HOST}`, 'h']],
    [['─'.repeat(USER.length + HOST.length + 1), 'd']],
    ...K.map((k, i) => [[padR(k, kw), 'h'], [V[i], '']]),
    [['███', 'h'], [' ', ''], ['▓▓▓', ''], [' ', ''], ['▒▒▒', ''], [' ', ''], ['░░░', 'd']],
  ];
};
const rowWidth = (r) => r.reduce((a, [tx]) => a + wlen(tx), 0);
const bannerSegs = (cols) => {
  const segs = [], nl = () => segs.push(['\n', '']);
  const logo = cols >= 44 ? LOGO_BIG : LOGO_SMALL;
  for (const r of logo) { segs.push(...runs(r, logoCls)); nl(); }

  let rows;

    const so = Math.floor((n - sun.length) / 2), co = Math.floor((n - card.length) / 2);
    rows = [];

      const s = sun[i - so], c = card[i - co] || [];
      rows.push([...(s ? runs(s, sunCls) : [[' '.repeat(sw), '']]), [' '.repeat(gap), ''], ...c]);
    }

    rows = [...(cols >= SUN_SMALL[0].length ? SUN_SMALL.map((r) => runs(r, sunCls)).concat([[]]) : []), ...card];
  }
  for (const r of rows) { segs.push(...r); nl(); }
  nl();
  segs.push(...fmt(motd(cols)));
  return segs;
};
const banner = () => {
  const el = document.createElement('div');
  el.className = 'o banner';
  const cols = M.cols;
  put(() => { banners.push(el); return el; });
  into(el, bannerSegs(cols));
  then(() => { el.dataset.cols = cols; if (cols !== M.cols) rebanner(); });

const rebanner = () => {

const pushHist = (line) => {
  if (S.hist[S.hist.length - 1] !== line) S.hist.push(line);
  if (S.hist.length > 200) S.hist.splice(0, S.hist.length - 200);
  store.set('hist', S.hist);
  S.hi = S.hist.length; S.draft = '';
};
const run = (line) => {
  pushHist(line);
  const [c0, ...args] = tokenize(line), cmd = c0.toLowerCase();
  const f = Object.prototype.hasOwnProperty.call(CMD, cmd) ? CMD[cmd] : null;
  if (!f) return err(t('notfound', c0));

};
const submit = () => {
  const v = kbd.value;
  kbd.value = '';

  srMark = logEl.lastElementChild;
  thock();
  S.hi = S.hist.length; S.draft = '';

};
const histMove = (d) => {
  if (!S.hist.length) return;

  S.hi = clamp(S.hi + d, 0, S.hist.length);
  kbd.value = S.hi === S.hist.length ? S.draft : S.hist[S.hi];
  const n = kbd.value.length;
  kbd.setSelectionRange(n, n);

};

/* tab completion: commands, directory-aware paths, arguments */
const ARGS = { theme: ['green', 'amber', 'ice'], sound: ['on', 'off'], baud: ['300', '1200', '2400', '9600', '19200', '38400', 'max'], lang: ['ja', 'en'], uname: ['-a'] };
const common = (a) => a.reduce((p, s) => { let i = 0; while (i < p.length && p[i] === s[i]) i++; return p.slice(0, i); });
const complete = () => {
  const v = kbd.value, p = kbd.selectionStart ?? v.length;
  const left = v.slice(0, p), word = left.match(/\S*$/)[0], before = left.slice(0, left.length - word.length);
  const first = !before.trim(), cmd = first ? '' : before.trim().split(/\s+/)[0].toLowerCase();
  let cands = [];
  if (first) cands = CMDNAMES.filter((c) => c.startsWith(word)).map((c) => [c, c + ' ']);
  else if (ARGS[cmd]) cands = ARGS[cmd].filter((a) => a.startsWith(word)).map((a) => [a, a + ' ']);
  else {
    const cut = word.lastIndexOf('/') + 1, dir = word.slice(0, cut), base = word.slice(cut);
    const dn = lookup(normPath(dir || '.'));
    if (dn && dn.t === 'd') {
      cands = Object.keys(dn.c).sort()
        .filter((k) => k.startsWith(base) && (base[0] === '.' || k[0] !== '.') && (cmd !== 'cd' || dn.c[k].t === 'd'))
        .map((k) => { const d = dn.c[k].t === 'd'; return [k + (d ? '/' : ''), dir + k + (d ? '/' : ' ')]; });
    }
  }
  if (!cands.length) return bell();
  let ins = cands[0][1];
  if (cands.length > 1) {
    ins = common(cands.map((c) => c[1]));
    if (ins.length <= word.length) {
      echoLine(v);
      grid(cands.map(([d]) => [[d, d.endsWith('/') ? 'h' : '']]));
      settle();
      return;
    }
  }
  kbd.value = before + ins + v.slice(p);
  const np = (before + ins).length;
  kbd.setSelectionRange(np, np);
  renderInput();
};

const MODS = ['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Fn', 'OS'];
const onKey = (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  const k = e.key;
  if (S.mode === 'off') return;
  if (S.mode === 'boot') { if (!MODS.includes(k)) { e.preventDefault(); flush(); } return; }
  if (S.mode === 'matrix') { if (!MODS.includes(k)) { e.preventDefault(); stopMatrix(); } return; }
  if (S.mode === 'snake') { snakeKey(e); return; }
  if (Q.length) {
    if (k === 'Enter' || k === 'Escape' || (e.ctrlKey && k.toLowerCase() === 'c')) { e.preventDefault(); flush(); }
    return;
  }
  if (e.ctrlKey && !e.altKey && !e.metaKey) {
    const kk = k.toLowerCase();
    if (kk === 'c') {
      e.preventDefault();
      const b = echoLine(kbd.value);
      writeSegs(b, [['^C', 'd']]);
      kbd.value = ''; S.hi = S.hist.length; renderInput(); settle();
      return;
    }
    if (kk === 'l') { e.preventDefault(); clearScreen(); renderInput(); settle(); return; }
    if (kk === 'u') { e.preventDefault(); kbd.value = kbd.value.slice(kbd.selectionStart); kbd.setSelectionRange(0, 0); renderInput(); return; }
    if (kk === 'a') { e.preventDefault(); kbd.setSelectionRange(0, 0); renderInput(); return; }
    if (kk === 'e') { e.preventDefault(); const n = kbd.value.length; kbd.setSelectionRange(n, n); renderInput(); return; }
  }
  if (k === 'Enter') { e.preventDefault(); submit(); return; }
  if (k === 'Tab') { e.preventDefault(); complete(); return; }
  if (k === 'ArrowUp') { e.preventDefault(); histMove(-1); return; }
  if (k === 'ArrowDown') { e.preventDefault(); histMove(1); return; }
  if (k.length === 1 || k === 'Backspace' || k === 'Delete') { click(); solid(); }
  setTimeout(renderInput, 0);
};

/* ---------- matrix: glyph rain on canvas ---------- */
const rain = $('rain'), rctx = rain.getContext('2d');
const GLYPHS = (() => {
  const a = [];
  for (let c = 0xff66; c <= 0xff9d; c++) a.push([String.fromCharCode(c), true]); /* half-width katakana, mirrored */
  for (let c = 0x391; c <= 0x3a9; c++) if (c !== 0x3a2) a.push([String.fromCharCode(c), false]);
  for (let d = 0; d < 10; d++) a.push([String(d), false]);
  return a;
})();
const rg = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
let MX = null;
const glyph = (g, x, y) => {
  if (g[1]) { rctx.save(); rctx.translate(x + MX.cw, y); rctx.scale(-1, 1); rctx.fillText(g[0], 0, 0); rctx.restore(); }
  else rctx.fillText(g[0], x, y);
};
const startMatrix = () => {
  if (S.mode !== 'shell') return;
  S.mode = 'matrix';
  showInput();
  const dpr = Math.min(2, devicePixelRatio || 1), w = rain.clientWidth, h = rain.clientHeight;
  rain.width = Math.max(1, Math.round(w * dpr)); rain.height = Math.max(1, Math.round(h * dpr));
  const cs = getComputedStyle(root), fs = Math.round(M.fs * 1.05);
  MX = {
    w, h, fs, cw: fs * 0.9, lh: fs * 1.12,
    rgb: cs.getPropertyValue('--rgb').trim(), bgrgb: cs.getPropertyValue('--bgrgb').trim(), hot: cs.getPropertyValue('--hot').trim(),
    ending: false, raf: 0, last: performance.now(), timer: 0,
  };
  MX.cols = Math.ceil(w / MX.cw); MX.rows = Math.ceil(h / MX.lh);
  MX.drops = Array.from({ length: MX.cols }, () => ({ y: -Math.random() * MX.rows * 0.55, v: rnd(8, 22), cell: -99, g: null }));
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rctx.fillStyle = `rgb(${MX.bgrgb})`;
  rctx.fillRect(0, 0, w, h);
  rctx.font = `${fs}px ${getComputedStyle(screen).fontFamily}`;
  rctx.textBaseline = 'top';
  screen.classList.add('hush');
  rain.classList.add('on');
  if (reduced) {
    rctx.fillStyle = `rgba(${MX.rgb},.5)`;
    for (let i = 0; i < MX.cols; i++) for (let j = 0; j < MX.rows; j++) if (Math.random() < 0.28) glyph(rg(), i * MX.cw, j * MX.lh);
    MX.timer = setTimeout(stopMatrix, 3200);
  } else {
    MX.raf = requestAnimationFrame(rainFrame);
    MX.timer = setTimeout(stopMatrix, 7600);
  }
};
const rainFrame = (now) => {
  const m = MX;
  if (!m) return;
  const dt = Math.min(64, now - m.last);
  m.last = now;
  /* translucent wash, identical at any frame rate */
  rctx.shadowBlur = 0;
  rctx.fillStyle = `rgba(${m.bgrgb},${(1 - Math.pow(0.915, dt / 16.67)).toFixed(4)})`;
  rctx.fillRect(0, 0, m.w, m.h);
  for (let i = 0; i < m.cols; i++) {
    const d = m.drops[i], x = i * m.cw;
    d.y += (d.v * dt) / 1000;
    const cell = Math.floor(d.y);
    if (cell !== d.cell) {
      if (d.g && d.cell >= 0) {
        rctx.fillStyle = `rgb(${m.bgrgb})`;
        rctx.fillRect(x, d.cell * m.lh, m.cw, m.lh);
        rctx.fillStyle = `rgb(${m.rgb})`;
        glyph(d.g, x, d.cell * m.lh);
      }
      d.g = null;
      if (cell >= 0 && cell < m.rows) {
        d.g = rg();
        rctx.fillStyle = m.hot;
        rctx.shadowColor = `rgb(${m.rgb})`;
        rctx.shadowBlur = 18;
        glyph(d.g, x, cell * m.lh);
        rctx.shadowBlur = 0;
      }
      d.cell = cell;
    }
    if (d.y > m.rows + 8 && !m.ending) { d.y = -rnd(0, 14); d.v = rnd(7, 21); d.cell = -99; d.g = null; }
  }
  /* shimmer: a few trail glyphs change their minds */
  for (let k = 0; k < 4; k++) {
    const i = (Math.random() * m.cols) | 0, d = m.drops[i];
    if (d.cell < 3) continue;
    const j = d.cell - 1 - ((Math.random() * Math.min(d.cell, 18)) | 0), x = i * m.cw;
    rctx.fillStyle = `rgba(${m.bgrgb},.7)`;
    rctx.fillRect(x, j * m.lh, m.cw, m.lh);
    rctx.fillStyle = `rgba(${m.rgb},${(0.35 + Math.random() * 0.45).toFixed(2)})`;
    glyph(rg(), x, j * m.lh);
  }
  m.raf = requestAnimationFrame(rainFrame);
};
const stopMatrix = () => {
  const m = MX;
  if (!m || m.ending) return;
  m.ending = true;
  clearTimeout(m.timer);
  rain.classList.remove('on');
  screen.classList.remove('hush');
  setTimeout(() => {
    cancelAnimationFrame(m.raf);
    if (MX === m) MX = null;
    rctx.setTransform(1, 0, 0, 1, 0, 0);
    rctx.clearRect(0, 0, rain.width, rain.height);
    S.mode = 'shell';
    settle();
    focusKbd();
  }, 850);
};

$('kSnd').addEventListener('click', () => {
  if (!S.sound) audio();
  if (shellIdle()) autotype('sound ' + (S.sound ? 'off' : 'on'));
  else setSound(!S.sound);
});
$('sSnd').addEventListener('click', () => setSound(!S.sound));
$('kLang').addEventListener('click', () => {
  const next = S.lang === 'ja' ? 'en' : 'ja';
  if (shellIdle()) autotype('lang ' + next);
  else setLang(next);
});
$('sLang').addEventListener('click', () => setLang(S.lang === 'ja' ? 'en' : 'ja'));
$('sPhos').addEventListener('click', () => {
  const ks = Object.keys(PHOS);
  setPhos(ks[(ks.indexOf(S.phos) + 1) % ks.length]);
});
$('pwr').addEventListener('click', () => {
  if (S.mode === 'off') return;
  hardStop();
  S.mode = 'off';
  Q.length = 0;
  settle();
  powerOff(boot);
});

document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over) pauseSnake(true); });
mq.addEventListener('change', (e) => { reduced = e.matches; });
let rzT = 0;
const onResize = () => {
  const vv = window.visualViewport;
  root.style.setProperty('--vvh', Math.round(vv ? vv.height : innerHeight) + 'px');
  $('monitor').style.top = (vv ? Math.max(0, vv.offsetTop) : 0) + 'px';
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    measure();
    rebanner();
    makeGrain();
    keysOverflow();
    screen.scrollTop = screen.scrollHeight;
    if (MX) stopMatrix();
  }, 120);
};
addEventListener('resize', onResize);
if (window.visualViewport) { visualViewport.addEventListener('resize', onResize); visualViewport.addEventListener('scroll', onResize); }

/* ---------- power on ---------- */
setLang(S.lang);
setPhos(S.phos, false);
setBaud(S.baud);
setSound(false);
screen.classList.add('blurred');
onResize();
measure();
makeGrain();
keysOverflow();
tickClock();
setInterval(tickClock, 1000);
requestAnimationFrame(loop);
glitchLater();
window.HELIOS = {
  skip: flush,
  type: autotype,
  run(c) { flush(); if (S.mode !== 'shell') return; kbd.value = c; submit(); flush(); },
  state: S,
};
boot();
if (!coarse.matches) kbd.focus({ preventScroll: true });
})();
