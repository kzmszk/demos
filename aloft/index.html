/* ---------- looking around: pointer, touch, or the phone's own tilt ---------- */
const LOOK = { tx: 0, ty: 0, gyro: null, base: null, idle: 0 };
function askGyro() {
  const D = window.DeviceOrientationEvent;
  if (!D || !matchMedia('(pointer:coarse)').matches) return;
  const on = () => window.addEventListener('deviceorientation', (e) => {
    if (e.beta == null) return;
    const portrait = innerHeight > innerWidth;
    const a = portrait ? e.gamma : e.beta, b = portrait ? e.beta : -e.gamma;
    if (!LOOK.base) LOOK.base = [a, b];
    LOOK.gyro = [a - LOOK.base[0], b - LOOK.base[1]];
  });
  if (typeof D.requestPermission === 'function') D.requestPermission().then((r) => r === 'granted' && on()).catch(() => {});
  else on();
}
function onPointer(e) {
  ST.ptrT = 0;
  document.body.classList.add('ptr');
  if (e.pointerType === 'mouse' || e.buttons || e.pointerType === 'pen') {
    LOOK.tx = clamp((e.clientX / innerWidth - 0.5) * 2, -1, 1);
    LOOK.ty = clamp((e.clientY / innerHeight - 0.5) * 2, -1, 1);
    LOOK.idle = 0;
  }
}
function updateLook(dt) {
  LOOK.idle += dt;
  if (ST.frozen && LOOK.idle > 50) return;
  let ty = LOOK.tx * 0.2, tp = -LOOK.ty * 0.11;
  if (LOOK.gyro) { ty = clamp(-LOOK.gyro[1] * DEG * 0.6, -0.35, 0.35); tp = clamp(-LOOK.gyro[0] * DEG * 0.5, -0.2, 0.2); }
  else if (LOOK.idle > 3) { const k = Math.min(1, (LOOK.idle - 3) * 0.4); ty *= 1 - k; tp *= 1 - k; }
  const a = 1 - Math.exp(-dt * 2.2);
  ST.look.yaw += (ty - ST.look.yaw) * a;
  ST.look.pitch += (tp - ST.look.pitch) * a;
}

/* =====================================================================
   PERFORMANCE: hold the frame rate by moving the render resolution
   ===================================================================== */
const PERF = { q: [], gpu: [], refresh: 1 / 60, rafs: [], lastChange: 0, slow: 0, fast: 0, fixed: Q.has('scale') ? +Q.get('scale') : 0 };
if (Q.has('q')) R.q = clamp(+Q.get('q'), 0, 2);
function gpuBegin() {
  if (!EXT.timer) return null;
  const q = gl.createQuery();
  gl.beginQuery(EXT.timer.TIME_ELAPSED_EXT, q);
  return q;
}
function gpuEnd(q) {
  if (!q) return;
  gl.endQuery(EXT.timer.TIME_ELAPSED_EXT);
  PERF.q.push(q);
  while (PERF.q.length) {
    const h = PERF.q[0];
    if (!gl.getQueryParameter(h, gl.QUERY_RESULT_AVAILABLE)) break;
    const ns = gl.getQueryParameter(h, gl.QUERY_RESULT);
    PERF.gpu.push(ns / 1e6); if (PERF.gpu.length > 24) PERF.gpu.shift();
    gl.deleteQuery(h); PERF.q.shift();
  }
  /* a disjoint event (clock change, power state) spoils the recent timings; asking costs a round trip, so ask rarely */
  const t = performance.now();
  if (t - (PERF.djT || 0) > 2000) { PERF.djT = t; if (gl.getParameter(EXT.timer.GPU_DISJOINT_EXT)) PERF.gpu.length = 0; }
  if (PERF.q.length > 8) { gl.deleteQuery(PERF.q.shift()); }
}
function adaptScale(now, dt) {
  PERF.rafs.push(dt); if (PERF.rafs.length > 90) PERF.rafs.shift();
  /* the display's own frame interval; uniformly slow frames must not pass for a slow display */
  if (PERF.rafs.length > 30) { const s = PERF.rafs.slice().sort((a, b) => a - b); PERF.refresh = clamp(s[Math.floor(s.length * 0.3)], 1 / 165, 1 / 50); }
  if (PERF.fixed) { if (R.scale !== PERF.fixed) { R.scale = PERF.fixed; setRenderSize(); } return; }
  const budget = PERF.refresh * 1000 * 0.85;
  const over = PERF.gpu.length >= 4 && PERF.gpu.slice(-4).reduce((a, b) => a + b, 0) / 4 > budget * 1.2;
  if (ST.frozen || now - PERF.lastChange < (over ? 200 : 500)) return;
  let next = R.scale;
  if (PERF.gpu.length >= (over ? 4 : 8)) {
    const n = over ? 4 : 8, cost = PERF.gpu.slice(-n).reduce((a, b) => a + b, 0) / n;
    if (cost > budget * 0.95) next = R.scale * clamp(Math.sqrt(budget / cost) * 0.96, 0.6, 0.98);
    else if (cost < budget * 0.6 && now - PERF.lastChange > 2500) next = Math.min(R.scale * 1.05, maxScale());
  } else if (!EXT.timer) {
    /* no GPU timer: watch for dropped frames */
    const late = dt > PERF.refresh * 1.45;
    PERF.slow = late ? PERF.slow + 1 : Math.max(0, PERF.slow - 0.25);
    PERF.fast = late ? 0 : PERF.fast + 1;
    if (PERF.slow > 6) { next = R.scale * 0.9; PERF.slow = 0; }
    else if (PERF.fast > 200) { next = R.scale * 1.03; PERF.fast = 0; }
  }
  next = clamp(Math.round(next * 100) / 100, Math.min(0.35, maxScale()), maxScale());
  if (next !== R.scale) {
    HITCH.scaleLog.push([+(ST.T).toFixed(2), R.scale, next]);
    R.scale = next; setRenderSize(); PERF.lastChange = now; PERF.gpu.length = 0;
    if (next <= 0.35 && R.q > 0) { R.q--; PERF.lastChange = now + 1500; }
  }
}

/* =====================================================================
   THE LOOP
   ===================================================================== */
const HITCH = { log: [], scaleLog: [] };
function frame(now) {
  requestAnimationFrame(frame);
  if (ST.last && now - ST.last > 45 && ST.phase === 'fly') HITCH.log.push([+(ST.T).toFixed(2), Math.round(now - ST.last), R.scale]);
  const dt = ST.last ? Math.min(0.1, (now - ST.last) / 1000) : 1 / 60;
  ST.last = now;
  ST.dts.push(dt); if (ST.dts.length > 60) ST.dts.shift();
  for (const k in POST) if (!programReady(POST[k])) return;
  ST.phaseT += dt; ST.ptrT += dt;
  if (ST.ptrT > 2.6 && !document.querySelector('#ctl:hover')) document.body.classList.remove('ptr');
  updateLook(dt);

  /* load: the dawn first (it is the title), then the rest, one per frame */
  if (ST.phase === 'boot' || ST.phase === 'title') {
    for (const sc of SCENES) if (!sc.ready) { try { prepare(sc); } catch (e) { console.error(e); } break; }
    updateGo();
    if (ST.phase === 'boot' && SCENES[0].ready) { setPhase('title'); applyLang(); }
  }
  if (!SCENES[0].ready) return;

  let sc, lt, cam, fade = { f: 0, col: [1, 1, 1] }, curtain = [0, 0, 0, 0];
  if (ST.phase === 'title' || ST.phase === 'boot' || (ST.phase === 'board' && ST.phaseT < 1.6)) {
    ST.titleT += dt;
    ({ sc, lt, cam } = titleCamera());
    if (ST.phase === 'board') curtain = [0.02, 0.02, 0.035, smooth(clamp(ST.phaseT / 1.4, 0, 1))];
    else if (ST.phase === 'title' && ST.phaseT < 2.5) curtain = [0.02, 0.02, 0.035, 1 - smooth(clamp(ST.phaseT / 2.5, 0, 1))];
  } else if (ST.phase === 'board') {
    /* the dome goes dark; then we lift off */
    sc = SCENES[0]; lt = 0; cam = cameraAt(sc, 0, ST.look);
    curtain = [0.02, 0.02, 0.035, 1];
    if (ST.phaseT > 4.4) { message(T_().lift, 1600); startFlight(0); }
  } else {
    if (ST.phase === 'fly' && ST.playing && !ST.frozen) {
      ST.T = (window.AUDIO && AUDIO.clock) ? AUDIO.clock(now, ST.T, dt) : ST.T + dt;
      if (ST.T >= TOTAL) { ST.T = TOTAL; land(); }
    }
    sc = sceneAt(Math.min(ST.T, TOTAL - 1e-3));
    if (!prepare(sc)) return;
    lt = Math.min(ST.T, TOTAL - 1e-3) - sc.t0;
    cam = cameraAt(sc, lt, ST.look);
    fade = ST.noFade ? fade : fadeAt(sc, lt);
    if (ST.phase === 'fly') {
      if (ST.T < 2.2) curtain = [0.02, 0.02, 0.035, 1 - smooth(clamp(ST.T / 2.2, 0, 1))];
      if (lt > (SCENES.indexOf(sc) ? FADE_IN : 1.6) && lt < sc.dur - FADE_OUT - 2) showCaption(sc);
      if (lt > sc.dur - FADE_OUT - 1) hideCaption();
      const tail = TOTAL - ST.T;
      if (tail < 4) curtain = [0.06, 0.05, 0.07, smooth(clamp(1 - tail / 4, 0, 1))];
      if (now - (ST.domT || 0) > 250) {
        ST.domT = now;
        if (document.body.classList.contains('ptr')) { $('#bar i').style.width = `${(ST.T / TOTAL) * 100}%`; $('#c-time').textContent = `${fmt(ST.T)} / ${fmt(TOTAL)}`; }
        if (ST.T > 5 && ST.T < 5.6) updateHint();
      }
    } else if (ST.phase === 'end') curtain = [0.06, 0.05, 0.07, 1];
  }
  if (ST.phase === 'fly') AUDIO.update(sc, lt, cam, ST.T);
  const q = gpuBegin();
  const bursts = sc.fw ? burstsAt(sc, lt) : null;
  renderFrame(sc, lt, cam, { fade: fade.f, fadeC: fade.col, curtain, map: ST.map, bursts, pcam: bursts ? cameraAt(sc, lt - FW_SHUTTER, ST.look) : null, bloomK: sc.bloomK });
  gpuEnd(q);
  adaptScale(now, dt);
  if (DEBUG) {
    const avg = ST.dts.reduce((a, b) => a + b, 0) / ST.dts.length;
    const g = PERF.gpu.length ? (PERF.gpu.reduce((a, b) => a + b, 0) / PERF.gpu.length).toFixed(1) : '-';
    $('#dbg').textContent = `${ST.phase} ${sc.id}  t=${lt.toFixed(2)}  u=${cam.u.toFixed(3)}  v=${cam.v.toFixed(1)}m/s\npos ${cam.pos.map((x) => x.toFixed(0)).join(', ')}  agl ${(cam.pos[1] - groundAt(sc, cam.s)).toFixed(0)}\n${(1 / avg).toFixed(0)} fps  gpu ${g} ms  ${R.w}×${R.h} (${R.scale.toFixed(2)}) q${R.q}`;
  }
}
function groundAt(sc, s) { const P = sc.P; return P.ground[clamp(Math.round(s / P.ds), 0, P.N - 1)]; }

/* =====================================================================
   SOUND — a piano, and the water where there is water. Nothing else.
   The piano is built from the physics of a struck string (stiff-string partials,
   two-stage decay of the unison strings, the hammer's comb and felt, the
   soundboard), rendered once per key in a worker. The score is written per place
   at 72 bpm: a D major prelude and theme, B minor river to D major spray, a G
   major bossa on the atoll, E minor canyon, F# minor ice, and the lift to E.
   ===================================================================== */
function synthKit() {
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  let seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gauss = () => { let s = 0; for (let i = 0; i < 4; i++) s += rnd(); return (s - 2) * 1.7; };

  /* one struck note: stiff-string partials (each a pair of slightly detuned strings decaying fast, plus
     a slow aftersound), the hammer's comb and felt, the soundboard's weak bass radiation, and the knock */
  function note(m, need = 99) {
    seed = 1000 + m * 7;
    const rate = m < 50 ? 22050 : 32000;
    const f0 = 440 * Math.pow(2, (m - 69) / 12);
    const B = m >= 48 ? Math.pow(10, -3.7 + 0.035 * (m - 48)) : Math.pow(10, -3.7 + 0.011 * (48 - m));
    const dur = Math.max(1.2, Math.min(clamp(11 - (m - 24) * 0.115, 2.6, 11), need + 0.6));
    const N = Math.floor(dur * rate), acc = new Float64Array(N);
    const b1 = 0.2 + 0.35 * Math.pow(2, (m - 60) / 12), b3 = 3e-7;
    const fmax = Math.min(rate * 0.45, 12000);
    const beta = 0.122;                                   /* the hammer strikes an eighth of the way along */
    const fc = 900 * Math.pow(2, (m - 60) / 24);          /* felt corner: harder and higher in the treble */
    const strings = m < 34 ? 1 : m < 46 ? 2 : 3;
    for (let n = 1; ; n++) {
      const fn = n * f0 * Math.sqrt(1 + B * n * n);
      if (fn > fmax) break;
      let a = Math.abs(Math.sin(Math.PI * n * beta)) + 0.05;
      a *= 1 / (1 + (fn / fc) * (fn / fc));
      a *= (fn * fn) / (fn * fn + 110 * 110);              /* the soundboard barely radiates the lowest fundamentals */
      if (a < 1e-5) continue;
      const aft = b1 + b3 * fn * fn, prompt = aft * 2.6 + 0.3;
      const comps = [[0.6, prompt, 0]];
      if (strings > 1) comps.push([0.32, prompt * 1.12, 0.00019 * (1 + 0.3 * gauss())]);
      if (strings > 2) comps.push([0.22, prompt * 0.9, -0.00014 * (1 + 0.3 * gauss())]);
      comps.push([0.16, aft, 0.00008 * gauss()]);
      for (const [k, alpha, det] of comps) {
        const amp = a * k, w = (2 * Math.PI * fn * (1 + det)) / rate, r = Math.exp(-alpha / rate);
        const life = Math.min(N, Math.ceil((Math.log(amp / 2e-6) / alpha) * rate));
        if (life < 4) continue;
        const c1 = 2 * r * Math.cos(w), c2 = r * r;
        let y1 = 0, y0 = amp * r * Math.sin(w);
        acc[1] += y0;
        for (let i = 2; i < life; i++) { const y = c1 * y0 - c2 * y1; y1 = y0; y0 = y; acc[i] += y; }
      }
    }
    /* the knock: the hammer and key against the frame, ringing a few soundboard modes */
    const knock = 0.05 + 0.25 * clamp((m - 40) / 60, 0, 1);
    for (const [fk, tk] of [[96, 0.05], [143, 0.04], [212, 0.03], [287, 0.025], [415, 0.018], [620, 0.012]]) {
      const w = (2 * Math.PI * fk * (1 + 0.04 * gauss())) / rate, r = Math.exp(-1 / (tk * rate)), c1 = 2 * r * Math.cos(w), c2 = r * r;
      let y1 = 0, y0 = knock * 0.012 * (0.6 + 0.8 * rnd()) * r * Math.sin(w);
      const life = Math.min(N, Math.ceil(tk * 9 * rate));
      for (let i = 1; i < life; i++) { const y = c1 * y0 - c2 * y1; y1 = y0; y0 = y; acc[i] += y; }
    }
    /* level: equal loudness across the keyboard, measured over the first moments */
    let e = 0; const win = Math.floor(0.35 * rate);
    for (let i = 0; i < win; i++) e += acc[i] * acc[i];
    const rms = Math.sqrt(e / win) || 1, tilt = m < 60 ? 1 + (60 - m) * 0.004 : 1 - (m - 60) * 0.006;
    const g = (0.2 * tilt) / rms, out = new Float32Array(N), fin = Math.floor(0.0006 * rate), fout = Math.floor(0.25 * rate);
    for (let i = 0; i < N; i++) {
      let s = acc[i] * g;
      if (i < fin) s *= i / fin;
      if (i > N - fout) s *= 0.5 + 0.5 * Math.cos((Math.PI * (i - (N - fout))) / fout);
      out[i] = s;
    }
    return { m, rate, data: [out] };
  }

  /* ---------- water: synthesised once, periodic so it loops without a seam ---------- */
  function biquad(type, f, q, rate) {
    const w = (2 * Math.PI * f) / rate, cs = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al;
    let b0, b1, b2;
    if (type === 'bp') { b0 = al; b1 = 0; b2 = -al; }
    else if (type === 'hp') { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = (1 + cs) / 2; }
    else { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = (1 - cs) / 2; }
    const B0 = b0 / a0, B1 = b1 / a0, B2 = b2 / a0, A1 = (-2 * cs) / a0, A2 = (1 - al) / a0;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    return (x) => { const y = B0 * x + B1 * x1 + B2 * x2 - A1 * y1 - A2 * y2; x2 = x1; x1 = x; y2 = y1; y1 = y; return y; };
  }
  /* run a filter chain over noise twice around the loop, so the end flows into the start */
  function loopNoise(N, chain) {
    const out = new Float32Array(N), pre = Math.min(N, 20000);
    for (let i = N - pre; i < N; i++) chain(rnd() * 2 - 1, i);
    for (let i = 0; i < N; i++) out[i] = chain(rnd() * 2 - 1, i);
    return out;
  }
  /* a splash: a short burst of band-limited noise; thousands of them are what make noise sound wet */
  function splash(buf, N, rate, at, f, len, amp) {
    const bp = biquad('bp', f, 1.4, rate), n = Math.floor(len * rate), atk = Math.max(4, Math.floor(n * 0.08));
    for (let i = 0; i < n; i++) buf[(at + i) % N] += bp(rnd() * 2 - 1) * amp * Math.min(1, i / atk) * Math.pow(1 - i / n, 2);
  }
  /* a slosh: a wash of water swelling and draining away, its pitch falling as it recedes (a swept state-variable filter) */
  function slosh(buf, N, rate, at, f, rise, fall, amp) {
