<script type="x-glsl" id="g-clouds">
/* ---- volumetric cumulus in a slab: uCL = base, top, coverage, density; uCW = wind x, wind z, scale, detail ----
   scenes using this define cloudLocal(p) (extra coverage at p, e.g. a banner cloud on a peak) */
uniform vec4 uCL;
uniform vec4 uCW;
uniform float uFrame;
float cloudLocal(vec3 p);
float remap(float v, float a, float b, float c, float d){ return c + (v - a)*(d - c)/(b - a); }
float cloudD(vec3 p, bool detail){
  float hf = (p.y - uCL.x)/(uCL.y - uCL.x);
  if (hf <= 0.0 || hf >= 1.0) return 0.0;
  vec3 q = p*uCW.z + vec3(uCW.x, 0.0, uCW.y)*uGT;
  vec4 lo = textureLod(uCl, q*0.00011, 0.0);
  float loc = cloudLocal(p);
  float cov = sat(uCL.z + loc);
  /* low-frequency field, contrast-stretched to 0..1; local boosts also build the cloud taller */
  float shape = sat((lo.g*0.6 + lo.r*0.4 - 0.5)*3.2 + 0.5 + max(loc, 0.0)*0.9);
  /* flat bases, rounded tops that rise where the field is strong */
  float prof = smoothstep(0.0, 0.16, hf)*smoothstep(0.35 + 0.65*shape, 0.2 + 0.4*shape, hf);
  float d = sat((shape*prof - (1.0 - cov))/max(cov, 0.05));
  if (d <= 0.0 && loc <= 0.02) return 0.0;
  /* billows */
  float sh = textureLod(uCl, q*0.00045 + vec3(0.0, uGT*0.0008, 0.0), 0.0).g;
  d = sat(d - (1.0 - sh)*0.42);
  /* local clouds (a banner on a peak, the cloud we rise out of) are solid masses */
  if (loc > 0.02) d = max(d, sat(loc*1.4 - 0.15)*smoothstep(0.0, 0.08, hf)*(1.0 - smoothstep(0.8, 0.98, hf))*(0.55 + 0.45*sh));
  if (d <= 0.0) return 0.0;
  if (detail && d > 0.0){
    float de = textureLod(uCl, q*0.0024 + vec3(uGT*0.003, 0.0, 0.0), 0.0).b;
    d = sat(d - (1.0 - de)*uCW.w*(1.0 - d*0.7));
  }
  return d*uCL.w;
}
float hg(float c, float g){ float g2 = g*g; return (1.0 - g2)/(4.0*PI*pow(1.0 + g2 - 2.0*g*c, 1.5)); }
/* returns in-scattered light (rgb) and transmittance (a); depth = where the cloud got dense */
vec4 marchClouds(vec3 ro, vec3 rd, float tmax, vec2 fc, out float cdep){
  cdep = 1e9;
  float ta, tb;
  if (abs(rd.y) < 1e-4){ if (ro.y < uCL.x || ro.y > uCL.y) return vec4(0.0, 0.0, 0.0, 1.0); ta = 0.0; tb = 60000.0; }
  else {
    float t0 = (uCL.x - ro.y)/rd.y, t1 = (uCL.y - ro.y)/rd.y;
    ta = max(min(t0, t1), 0.0); tb = max(t0, t1);
  }
  tb = min(tb, min(tmax, 60000.0));
  if (tb <= ta) return vec4(0.0, 0.0, 0.0, 1.0);
  tb = min(tb, ta + 26000.0);
  /* steps grow with distance: fine near the eye, coarse in the haze */
  float k = uQ == 0 ? 0.05 : uQ == 1 ? 0.032 : 0.021;
  float t = ta + max(14.0, ta*k)*fract(ign(fc) + uFrame*0.618034);
  float mu = dot(rd, uSun);
  float ph = mix(hg(mu, 0.75), hg(mu, -0.25), 0.3);
  vec3 L = vec3(0.0); float T = 1.0;
  float zero = 0.0;
  for (int i = 0; i < 260; i++){
    if (t >= tb || T < 0.02) break;
    float dt = max(14.0, t*k);
    vec3 p = ro + rd*t;
    float d = cloudD(p, true);
    if (d > 0.002){
      /* light marched toward the sun */
      float ls = 0.0, lstep = 70.0;
      for (int j = 0; j < 5; j++){
        ls += cloudD(p + uSun*lstep*(float(j) + 0.5), false)*lstep;
        lstep *= 1.6;
      }
      float sig = 0.045;
      float beer = exp(-ls*sig) + 0.25*exp(-ls*sig*0.25);
      float hf = sat((p.y - uCL.x)/(uCL.y - uCL.x));
      vec3 S = uSunC*beer*ph*(1.0 - exp(-d*2.0*sig*90.0))*11.0 + uAmb*mix(0.42, 0.95, hf) + uFogC*0.08;
      float tr = exp(-d*sig*dt);
      L += T*S*(1.0 - tr);
      if (T > 0.5 && T*tr <= 0.5) cdep = t;
      T *= tr;
      t += dt;
    } else {
      t += dt*1.7;
    }
  }
  return vec4(L, T);
}
</script>

<script type="x-glsl" id="g-dawn">
/* ABOVE THE CLOUDS — dawn over a sea of cumulus, far peaks catching the first light.
   uP0: -, -, -, - */
float cloudLocal(vec3 p){
  /* we rise out of a cloud at the start and dive into another at the end */
  vec2 a = (p.xz - vec2(0.0, 120.0))/vec2(520.0, 620.0);
  vec2 b = (p.xz - vec2(70.0, 1260.0))/vec2(650.0, 520.0);
  return 0.7*exp(-dot(a, a)) + 0.5*exp(-dot(b, b));
}
/* far peaks, only the biggest pierce the deck */
float mapH(vec2 xz, float lod){
  vec2 p = xz*(1.0/16000.0) + vec2(5.3, 1.1);
  float r = 0.0, a = 0.5, w = 1.0;
  int n = int(ceil(lod));
  for (int i = 0; i < 10; i++){
    if (i >= n) break;
    float k = min(1.0, lod - float(i));
    float v = 1.0 - abs(noise(p)); v *= v;
    r += a*k*v*w; w = sat(v*1.7);
    a *= 0.5; p = M2*p*2.0;
  }
  /* keep the near field clear: peaks only far from the route */
  float far = smoothstep(9000.0, 20000.0, length(xz - vec2(0.0, 6000.0)));
  return mix(-500.0, -6000.0 + 14000.0*pow(r, 1.6), far);
}
float probeH(vec2 xz){ return max(mapH(xz, 6.0), uCL.y); }

vec3 dawnTerrain(vec3 ro, vec3 rd, float t){
  vec3 p = ro + rd*t;
  vec3 n = normalH(p.xz, t);
  float dif = sat(dot(n, uSun));
  float sh = dif > 0.0 ? shadowH(p + n*4.0, 8.0) : 0.0;
  float snow = smoothstep(0.55, 0.75, n.y + 0.15*noise(p.xz*0.004));
  vec3 alb = mix(vec3(0.09, 0.085, 0.09), vec3(0.9, 0.9, 0.95), snow);
  /* alpenglow: the low sun paints the snow rose and gold */
  vec3 col = alb*(uSunC*dif*sh*1.15 + uAmb*(0.45 + 0.4*n.y));
  return col;
}

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  vec3 col = skyCol(rd, 1.0);
  /* a few stars still out, high and away from the sun */
  if (rd.y > 0.15){
    vec2 sp = rd.xz/(rd.y + 0.4)*420.0;
    vec2 cell = floor(sp), fr = fract(sp) - 0.5;
    float hsh = hash12(cell);
    float star = step(0.985, hsh)*smoothstep(0.08, 0.0, length(fr - (hash22(cell) - 0.5)*0.6));
    col += star*vec3(0.9, 0.95, 1.0)*0.6*smoothstep(0.15, 0.7, rd.y)*(1.0 - sat(dot(rd, uSun)*1.5));
  }
  float dep = SKYT;
  float t = rd.y < 0.2 ? marchH(ro, rd, 50.0, 60000.0, uQ == 0 ? 110 : 160, 0.0) : -1.0;
  if (t > 0.0){
    col = dawnTerrain(ro, rd, t);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else col = applyFog(col, ro, rd, 50000.0);
  float cdep;
  vec4 cl = marchClouds(ro, rd, dep, fc, cdep);
  col = overClouds(col, cl, cdep, ro, rd);
  if (cl.a < 0.5) dep = min(dep, cdep);
  return vec4(col, dep);
}
</script>

<script type="x-glsl" id="g-falls">
/* THE GREAT FALLS — a jungle river spills over a long cliff into a gorge; a U-shaped throat
   takes the most water. uP0: plateau water level, gorge water level, plateau ground, gorge floor
   uP1: throat centre x, z, radius, -;  uP2: gorge band centre z, half width, falls half length, - */
float cloudLocal(vec3 p){ return 0.0; }
/* signed distance to the gorge (negative inside): a long band plus the throat */
float gorgeBase(vec2 xz){
  float band = abs(xz.y - uP2.x - 40.0*noise(vec2(xz.x*0.002, 3.0))) - uP2.y;
  float disc = length(xz - uP1.xy) - uP1.z;
  return smin(band, disc, 120.0);
}
float gorgeD(vec2 xz){
  return gorgeBase(xz) + 22.0*noise(xz*0.006) + 8.0*noise(xz*0.025);
}
/* water on the plateau: a jungle river, spreading into a sheet along the lip of the falls */
float riverMask(vec2 xz, float g){
  float cx = 70.0*sin(xz.y*0.0021) + 30.0*sin(xz.y*0.0057 + 1.0);
  float w = 50.0 + 45.0*smoothstep(-100.0, 380.0, xz.y);
  float r = 1.0 - smoothstep(w - 5.0, w + 3.0, abs(xz.x - cx) + 14.0*noise(xz*0.02));
  float near = 1.0 - smoothstep(70.0, 210.0, g);
  float front = 1.0 - smoothstep(uP2.z*0.55, uP2.z, abs(xz.x));
  float sheet = near*front*step(xz.y, uP2.x);
  float isl = smoothstep(0.12, 0.34, noise(xz*0.012 + 3.0) + 0.45*noise(xz*0.035));
  return max(r, sheet*(1.0 - isl));
}
float canopy(vec2 xz, float lod){
  /* the size of a pixel's footprint here: detail much smaller than it is let go, so the rim does not crawl */
  float fp = LAMBDA0*exp2(-lod);
  float c1 = 1.0 - abs(noise(xz*0.03 + 5.0));
  float c2 = 1.0 - abs(noise(xz*0.078 + 9.0));
  float emerg = smoothstep(0.62, 0.85, noise(xz*0.011 + 2.0));
  float k2 = smoothstep(1.0, 2.5, 12.8/fp), k3 = smoothstep(1.0, 2.5, 3.3/fp);
  return 15.0 + 10.0*c1*c1 + 5.0*mix(0.33, c2*c2, k2) + 10.0*emerg*c1*c1 + 4.0*noise(xz*0.006) + 0.6*k3*noise(xz*0.3);
}
float floorH(vec2 xz){
  float isl = smoothstep(0.55, 0.7, noise(xz*0.011 + 1.0) + 0.3*noise(xz*0.04));
  return uP0.w + 3.0*noise(xz*0.012) + 14.0*isl + 4.0*isl*(1.0 - abs(noise(xz*0.09)));
}
float mapH(vec2 xz, float lod){
  float g = gorgeD(xz);
  float wet = riverMask(xz, g);
  float top = uP0.z + 3.0*noise(xz*0.01);
  float can = canopy(xz, lod);
  float land = top + can*(1.0 - smoothstep(0.0, 0.35, wet))*smoothstep(8.0, 30.0, g);
  land -= 8.0*wet;
  float fl = floorH(xz);
  /* the cliff: a basalt step with a ledge part way down */
  float c = smoothstep(-36.0, 8.0, g);
  float ledge = 0.12*smoothstep(-26.0, -18.0, g);
  return mix(fl, land, sat(c*0.88 + ledge));
}
float probeH(vec2 xz){
  float g = gorgeD(xz);
  float h = mapH(xz, 8.0);
  return max(h, g > 0.0 ? uP0.x : uP0.y);
}

/* the rim point above a cliff, and the wall's along-coordinate */
vec2 gGrad(vec2 xz){
  vec2 e = vec2(6.0, 0.0);
  return normalize(vec2(gorgeBase(xz + e.xy) - gorgeBase(xz - e.xy), gorgeBase(xz + e.yx) - gorgeBase(xz - e.yx)) + 1e-5);
}
/* how much water pours down this stretch of wall */
float fallsAt(vec2 xz, float g, vec2 gg){
  vec2 rim = xz + gg*(28.0 - g);
  float gr = gorgeD(rim);
  return riverMask(rim, gr)*step(xz.y, uP2.x + 30.0);
}

vec3 spectrum(float x){
  return sat3(vec3(smoothstep(0.45, 0.75, x)*(1.0 - smoothstep(0.92, 1.0, x)),
                  1.0 - abs(x - 0.5)*2.6,
                  (1.0 - smoothstep(0.25, 0.55, x))*smoothstep(0.0, 0.08, x)));
}

vec3 jungleShade(vec3 p, vec3 n, vec3 rd, float t){
  float g = gorgeD(p.xz);
  vec2 gg = gGrad(p.xz);
  float n1 = noise(p.xz*0.02), n2 = noise(p.xz*0.11), n3 = noise3(p*0.15) - 0.5;
  vec3 col;
  float steep = 1.0 - smoothstep(0.45, 0.75, n.y);
  vec3 rock = mix(vec3(0.07, 0.065, 0.06), vec3(0.16, 0.14, 0.12), sat(0.5 + n2 + n3));
  float cr = 1.0 - abs(noise(p.xz*0.03 + 5.0));
  float hue = noise(p.xz*0.028 + 11.0);
  vec3 leaf = mix(vec3(0.035, 0.085, 0.03), vec3(0.11, 0.2, 0.05), sat(0.5 + 0.9*hue));
  leaf = mix(leaf, vec3(0.2, 0.25, 0.07), smoothstep(0.45, 0.7, noise(p.xz*0.05 + 4.0))*0.7);
  leaf = mix(leaf, vec3(0.42, 0.22, 0.12), smoothstep(0.72, 0.8, noise(p.xz*0.06 + 21.0))*0.6);
  leaf *= 0.45 + 0.75*cr*cr;
  leaf *= 0.75 + 0.5*sat(n.y + 0.3*n3);
  float inCanopy = smoothstep(uP0.z + 3.0, uP0.z + 7.0, p.y)*smoothstep(0.0, 20.0, g);
  col = mix(leaf, rock, steep*(0.6 + 0.4*smoothstep(-0.2, 0.3, n3))*(1.0 - inCanopy));
  /* the canopy edge seen from the river: shadowy understory below the crowns */
  col *= mix(1.0, 0.45 + 0.55*smoothstep(uP0.z + 4.0, uP0.z + 22.0, p.y), inCanopy*steep);
  if (g < -30.0) col = mix(vec3(0.035, 0.035, 0.035)*(0.8 + 0.6*(n2 + 0.5)), leaf*0.6, smoothstep(0.55, 0.7, n2 + 0.3*n3)*smoothstep(0.88, 0.97, n.y));
  /* waterfalls: bright streaks racing down the wet cliff */
  float wall = smoothstep(-44.0, -32.0, g)*(1.0 - smoothstep(6.0, 16.0, g));
  float falls = wall*fallsAt(p.xz, g, gg);
  if (falls > 0.01){
    vec2 tg = vec2(-gg.y, gg.x);
    float along = dot(p.xz, tg);
    float s1 = noise(vec2(along*0.21, (p.y + uT*15.0)*0.0042));
    float s2 = noise(vec2(along*0.66 + 7.0, (p.y + uT*19.0)*0.011));
    float s3 = noise(vec2(along*1.9 + 3.0, (p.y + uT*24.0)*0.028));
    float water = sat(0.45 + 0.55*s1 + 0.35*s2 + 0.25*s3);
    float split = smoothstep(-0.25, 0.1, noise(vec2(along*0.018, 2.0)));
    falls *= split;
    vec3 wc = mix(vec3(0.42, 0.46, 0.45), vec3(1.0, 1.0, 0.98), water);
    float foot = smoothstep(uP0.y + 70.0, uP0.y + 5.0, p.y);
    wc = mix(wc, vec3(1.0), foot*0.7);
    col = mix(col, wc, falls*(0.55 + 0.45*water));
  }
  if (g < -30.0 && t < 400.0){
    vec3 b1 = noised(p.xz*0.35 + 3.0), b2 = noised(p.xz*1.1 + 7.0);
    n = normalize(n - vec3(b1.y*0.35*0.6 + b2.y*1.1*0.12, 0.0, b1.z*0.35*0.6 + b2.z*1.1*0.12)*(1.0 - smoothstep(60.0, 400.0, t)));
  }
  float dif = sat(dot(n, uSun));
  float sh = dif > 0.0 ? shadowH(p + n*1.0, 10.0) : 0.0;
  float occ = 0.5 + 0.5*sat((p.y - mapH(p.xz, 4.0))/10.0 + 0.6);
  vec3 lin = uSunC*dif*sh + uAmb*occ*(0.55 + 0.45*n.y);
  vec3 c = col*lin;
  c += falls*uAmb*0.25;
  return c;
}

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  float t = marchH(ro, rd, 0.3, 30000.0, uQ == 0 ? 160 : 260, 0.0);
  float tmax = t > 0.0 ? t : 1e9;
  /* two water levels: the river above the falls and the river in the gorge */
  float tw = -1.0; float lvl = 0.0;
  if (rd.y < 0.0){
    if (ro.y > uP0.x){
      float t1 = (uP0.x - ro.y)/rd.y;
      vec3 q = ro + rd*t1;
      if (t1 < tmax && gorgeD(q.xz) > 0.0 && mapH(q.xz, 6.0) < uP0.x){ tw = t1; lvl = uP0.x; }
    }
    if (tw < 0.0 && ro.y > uP0.y){
      float t2 = (uP0.y - ro.y)/rd.y;
      vec3 q = ro + rd*t2;
      if (t2 < tmax && gorgeD(q.xz) < 0.0){ tw = t2; lvl = uP0.y; }
    }
  }
  vec3 col; float dep;
  if (tw > 0.0){
    vec3 p = ro + rd*tw;
    float g = gorgeD(p.xz);
    bool upper = lvl > uP0.y + 1.0;
    /* the current: streaky ripples carried with the flow */
    vec2 flow = upper ? vec2(0.0, 1.0) : vec2(-1.0, 0.0);
    vec2 q = p.xz - flow*uT*(upper ? 4.0 : 6.0);
    /* small quick ripples break the reflections up; long swells would bend the cliffs in them like rubber */
    vec3 n = waveN(q, uT*0.9, tw, upper ? 0.03 : 0.04, 0.16);
    vec3 rr = reflect(rd, n); rr.y = abs(rr.y);
    float F = fres(dot(n, -rd), 0.02);
    vec3 refl = skyCol(rr, 0.0);
    float tr = marchH(p + vec3(0.0, 0.3, 0.0), rr, 1.0, 3000.0, 60, 2.0);
    if (tr > 0.0) refl = jungleShade(p + rr*tr, normalH((p + rr*tr).xz, tr), rr, tr);
    vec3 body = upper ? vec3(0.1, 0.085, 0.045) : vec3(0.06, 0.08, 0.05);
    body *= uAmb*0.7 + uSunC*0.3*sat(uSun.y);
    col = mix(body, refl, F);
    col += uSunC*pow(sat(dot(reflect(rd, n), uSun)), 500.0)*8.0;
    /* foam: churned water below the falls, white rapids at the lip */
    float churn = upper ? smoothstep(140.0, 20.0, g)*0.55 : (1.0 - smoothstep(-130.0, -50.0, g))*0.0 + smoothstep(-140.0, -45.0, g);
    float fn = smoothstep(0.35, 0.75, noise(q*0.06) + 0.5*noise(q*0.23));
    float foam = sat(churn*(0.45 + 0.8*fn));
    if (!upper) foam *= fallsAt(p.xz + gGrad(p.xz)*(-g - 20.0), -20.0, gGrad(p.xz))*0.8 + 0.2*foam;
    col = mix(col, vec3(0.92)*(uAmb*0.8 + uSunC*0.4), foam);
    col = applyFog(col, ro, rd, tw);
    dep = tw;
  } else if (t > 0.0){
    vec3 p = ro + rd*t;
    col = jungleShade(p, normalH(p.xz, t), rd, t);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else {
    col = skyCol(rd, 1.0);
    col = applyFog(col, ro, rd, 30000.0);
    dep = SKYT;
  }
  /* mist rising from the plunge pools, with a rainbow where the sun is behind us */
  {
    float ta = 0.0, tb = min(dep, 2600.0);
    if (rd.y > 0.0) tb = min(tb, (uP0.y + 320.0 - ro.y)/rd.y);
    if (ro.y > uP0.y + 320.0){ if (rd.y >= 0.0) tb = -1.0; else ta = (uP0.y + 320.0 - ro.y)/rd.y; }
    if (tb > ta){
      float dt = (tb - ta)/40.0;
      float tt = ta + dt*fract(ign(fc) + uT*7.13);
      float T = 1.0; vec3 L = vec3(0.0);
      float ang = degrees(acos(clamp(dot(rd, -uSun), -1.0, 1.0)));
      vec3 bow = spectrum((ang - 40.4)/2.2)*smoothstep(39.8, 40.6, ang)*(1.0 - smoothstep(42.4, 43.0, ang));
      for (int i = 0; i < 40; i++){
        if (tt > tb || T < 0.03) break;
        vec3 p = ro + rd*tt;
        float g = gorgeD(p.xz);
        float m = smoothstep(-100.0, -50.0, g)*(1.0 - smoothstep(-40.0, -24.0, g))*(1.0 - smoothstep(uP0.x - 70.0, uP0.x - 20.0, p.y));
        if (m > 0.01){
          vec2 gg = gGrad(p.xz);
          m *= fallsAt(p.xz + gg*(-g), 0.0, gg);
          float hfall = exp(-(p.y - uP0.y)/95.0)*smoothstep(uP0.y - 2.0, uP0.y + 18.0, p.y);
          float bil = noise3(p*0.014 + vec3(0.0, -uT*0.3, uT*0.05))*0.65 + noise3(p*0.04 + vec3(0.0, -uT*0.7, 0.0))*0.35;
          float d = m*hfall*sat(bil*3.2 - 1.5)*0.012;
          if (d > 0.0){
            vec3 S = uSunC*(0.55 + 0.9*hg(dot(rd, uSun), 0.6)*4.0) + uAmb*1.2 + uSunC*bow*2.2;
            float tr = exp(-d*dt);
            L += T*S*(1.0 - tr);
            T *= tr;
          }
        }
        tt += dt;
      }
      col = col*T + L;
    }
  }
  float cdep;
  vec4 cl = marchClouds(ro, rd, dep, fc, cdep);
  col = overClouds(col, cl, cdep, ro, rd);
  if (cl.a < 0.5) dep = min(dep, cdep);
  return vec4(col, dep);
}
</script>

<!-- ================================================================
     SCENE: the glacier peaks
     ================================================================ -->
<script type="x-glsl" id="g-alps">
/* uP0: horn x, horn z, lake level, snow line
   uP1: horn radius, horn base, horn height, tree line */
const float MEAN = 3100.0;
/* a banner cloud streams from the summit on its lee side */
float cloudLocal(vec3 p){
  vec3 c = vec3(uP0.x + 420.0, uP1.y + uP1.z + 900.0, uP0.y + 80.0);
  vec3 d = (p - c)/vec3(900.0, 420.0, 460.0);
  return 0.75*exp(-dot(d, d));
}
/* the great peak: a steep cone that lifts and sharpens the same ridged rock as its neighbours */
float hornK(vec2 xz){
  vec2 q = xz - uP0.xy;
  q += 0.12*uP1.x*vec2(noise(q*0.0019 + 3.7), noise(q*0.0019 + 9.1)) + 0.025*uP1.x*vec2(noise(q*0.009 + 1.3), noise(q*0.009 + 7.7));
  /* a pyramid's four arêtes, rounded a little and wandering, so no edge runs ruler-straight up the face */
  float a = abs(q.x + q.y), b = abs(q.x - q.y), k = 0.06*uP1.x;
  float sq = (0.5*(a + b) + 0.5*sqrt((a - b)*(a - b) + k*k))*0.7071;
  float x = sat(1.0 - mix(length(q), sq, 0.55)/uP1.x);
  return x;
}
/* ridged crests and eroded slopes from one noise stack */
float alpsNat(vec2 xz, float lod, out float r){
  vec2 p = xz*(1.0/2400.0) + vec2(0.37, 1.91);
  float e = 0.0, a = 0.5, w = 1.0; vec2 d = vec2(0.0);
  r = 0.0;
  int n = int(ceil(lod));
  for (int i = 0; i < 13; i++){
    if (i >= n) break;
    vec3 v = noised(p);
    d += v.yz;
    float k = min(1.0, lod - float(i));
    e += a*k*v.x/(1.0 + dot(d, d));
    float rv = 1.0 - abs(v.x); rv *= rv;
    r += a*k*rv*w;
    w = sat(rv*1.6);
    a *= 0.5; p = M2*p*2.0;
  }
  return e;
}
float mapH(vec2 xz, float lod){
  float r;
  float e = alpsNat(xz, lod, r);
  float x = hornK(xz);
  float ring = smoothstep(2.4, 1.0, length(xz - uP0.xy)/uP1.x)*(1.0 - x);
  float h = 2500.0 + 1700.0*r*(1.0 + 0.7*x - 0.25*ring) + 650.0*e + uP1.z*(0.35*x + 0.65*pow(x, 2.2)) - 380.0*ring;
  /* the ground falls away around the route: a broad, smooth basin under the ridge and the glide */
  float dip = 0.0;
  vec4 f0 = feat(xz);
  if (f0.r < 9e3){
    /* (the feature map only knows distances out to ~1140 m: the basin must be gone by then, or its edge is a cliff) */
    float bs = smoothstep(uP2.x, uP2.y, f0.g)*(1.0 - smoothstep(350.0, 1050.0, f0.b));
    dip = uP2.z*bs*bs*(3.0 - 2.0*bs);
    h -= dip;
  }
  float hc; vec4 f, pb;
  float w = corridor(xz, h, MEAN - dip, hc, f, pb);
  h = mix(h, hc, w);
  /* the arete: the crest rises and dips, the flanks are fluted into snow ribs */
  if (w > 0.0){
    vec4 pa = profA(f.g);
    if (pa.w < 0.0){
      float d = f.b;
      float crest = 16.0*noise(vec2(f.g*0.0065, 1.7)) + 6.0*noise(vec2(f.g*0.031, 4.2)) + 1.5*noise(vec2(f.g*0.11, 2.0));
      float flute = 1.0 - abs(noise(vec2(f.g*0.05 + 3.0, d*0.006 + f.r*0.0004)));
      float flute2 = 1.0 - abs(noise(vec2(f.g*0.13 + 9.0, d*0.015)));
      h += w*(crest*(1.0 - 0.5*sat(d/300.0)) + (flute*flute*24.0 + flute2*7.0 - 13.0)*smoothstep(12.0, 90.0, d));
    }
  }
  if (w > 0.0 && lod > 6.0){
    float fz = w*(1.0 - smoothstep(profA(f.g).y*0.6, profA(f.g).y*1.3, f.b))*sat(lod - 6.0);
    /* drifts and dips on the floor */
    h += fz*(2.2*noise(xz*0.017) + 0.9*noise(xz*0.061 + 3.0) + 0.35*noise(xz*0.19 + 5.0));
    /* crevasses: narrow arcs across the glacier */
    if (pb.w > 0.0){
      float g = pb.w*fz;
      float wob = 0.9*noise(xz*0.008) + 0.25*noise(xz*0.04);
      float ph = f.g*0.21 - sq(f.r*0.006) + wob;
      float cr = smoothstep(0.975, 0.997, abs(sin(ph)));
      cr *= smoothstep(-0.1, 0.25, noise(xz*0.012 + 7.0));
      h -= 9.0*cr*g;
    }
  }
  return h;
}
float probeH(vec2 xz){ return max(mapH(xz, 9.0), uP0.z); }

vec3 alpsAlbedo(vec3 p, vec3 n, vec3 nm, float t, float conv){
  float h = p.y;
  vec4 f = feat(p.xz);
  vec4 pb = f.a > 0.0 ? profB(f.g) : vec4(0.0);
  float n1 = noise3(p*0.0035) - 0.5, n2 = noise3(p*0.027 + 7.0) - 0.5, n3 = noise3(p*0.19 + 3.0) - 0.5;
  /* rock: dark grey, some warm bands */
  float n4 = noise3(p*0.07 + 11.0) - 0.5;
  vec3 rock = mix(vec3(0.05, 0.05, 0.053), vec3(0.2, 0.19, 0.18), sat(0.5 + 1.1*n1 + 0.7*n2 + 0.5*n4));
  rock *= 0.9 + 0.1*sin(h*0.045 + 9.0*n1) + 0.3*n3;
  rock = mix(rock, rock*vec3(1.25, 1.0, 0.8), smoothstep(0.15, 0.35, n2 + 0.3*n4)*0.6);
  vec3 col = rock;
  /* the green valley: meadow, then forest on the lower slopes */
  float tl = uP1.w + 160.0*n1;
  float meadow = smoothstep(tl + 260.0, tl + 40.0, h) * smoothstep(0.62, 0.84, nm.y);
  vec3 grass = mix(vec3(0.12, 0.14, 0.06), vec3(0.24, 0.24, 0.12), sat(0.5 + 1.0*n1 + 0.4*n2));
  col = mix(col, grass*(0.94 + 0.12*n3), meadow*0.9);
  float forest = smoothstep(tl + 40.0, tl - 120.0, h) * smoothstep(0.45, 0.65, nm.y) * smoothstep(-0.3, 0.1, n2 + 0.6*n1 + 0.3*n3);
  col = mix(col, vec3(0.035, 0.05, 0.033)*(0.85 + 0.35*n3), forest*0.92);
  /* snow: gentle slopes above the snow line, ledges and gullies on steep faces */
  float sl = uP0.w + 260.0*n1 + 60.0*n2;
  float above = smoothstep(sl - 120.0, sl + 100.0, h);
  float gentle = smoothstep(0.64, 0.68, nm.y + 0.12*n2 + 0.05*n3);
  float ledge = smoothstep(0.81, 0.84, n.y)*smoothstep(0.25, 0.4, nm.y);
  float snow = above*max(gentle, 0.95*ledge);
  /* steep faces: snow fills the couloirs and dusts the small ledges */
  float couloir = smoothstep(-3.0, -11.0, conv + 4.0*n3)*smoothstep(0.18, 0.4, nm.y);
  float dust = smoothstep(0.1, 0.2, n.y - nm.y + 0.08*n3)*smoothstep(0.15, 0.35, nm.y);
  snow = max(snow, above*max(couloir, 0.85*dust));
  /* wind strips the crests: rock shows on convex ground, snow fills the hollows */
  snow *= 1.0 - smoothstep(5.0, 9.0, conv + 9.0*n2 + 3.0*n3)*smoothstep(0.93, 0.8, nm.y);
  snow = max(snow, smoothstep(sl + 800.0, sl + 1200.0, h)*smoothstep(0.42, 0.62, nm.y));
  vec3 snowC = vec3(0.88, 0.91, 0.95);
  /* glacier: blue-white ice, transverse crevasses, dark moraine bands at its edges */
  float gl = pb.w*f.a*(1.0 - smoothstep(170.0, 320.0, f.b));
  if (gl > 0.0){
    float wob = 0.9*noise(p.xz*0.008) + 0.25*noise(p.xz*0.04);
    float ph = f.g*0.21 - sq(f.r*0.006) + wob;
    float cr = smoothstep(0.972, 0.994, abs(sin(ph)));
    cr *= smoothstep(-0.1, 0.25, noise(p.xz*0.012 + 7.0));
    vec3 ice = mix(vec3(0.80, 0.87, 0.93), vec3(0.56, 0.72, 0.84), sat(0.5 + 2.2*n2));
    ice = mix(ice, vec3(0.02, 0.09, 0.16), cr);
    float mor = smoothstep(0.55, 0.85, f.b/200.0 + 0.25*n2)*(1.0 - smoothstep(0.95, 1.3, f.b/200.0));
    ice = mix(ice, vec3(0.16, 0.15, 0.14)*(0.8 + 0.6*n3), mor*0.85);
    col = mix(col, ice, gl);
    snow *= 1.0 - gl;
  }
  return mix(col, snowC, snow);
}

vec3 alpsLight(vec3 p, vec3 n, vec3 rd, vec3 alb, bool cheap){
  float dif = sat(dot(n, uSun));
  float sh = dif > 0.0 ? shadowH(p + n*1.5, cheap ? 6.0 : 14.0) : 0.0;
  float occ = sat(1.0 + (p.y - mapH(p.xz, 3.5))/240.0);
  occ = 0.42 + 0.58*occ;
  vec3 lin = uSunC*dif*sh;
  lin += uAmb*occ*(0.62 + 0.38*n.y);
  vec3 bdir = normalize(vec3(-uSun.x, 0.0, -uSun.z));
  lin += uAmb*vec3(1.0, 0.95, 0.88)*0.3*sat(dot(n, bdir) + 0.2)*occ;
  vec3 col = alb*lin;
  float snowy = smoothstep(0.5, 0.75, luma(alb));
  vec3 hv = normalize(uSun - rd);
  col += snowy*uSunC*sh*0.1*pow(sat(dot(n, hv)), 16.0);
  return col;
}

vec3 alpsTerrain(vec3 ro, vec3 rd, float t, bool cheap){
  vec3 p = ro + rd*t;
  vec3 n = normalH(p.xz, t);
  vec3 nm = n;
  float conv = 0.0;
  if (!cheap){
    float em = max(16.0, 0.006*t);
    float lm = lodAt(t, LAMBDA0, OMAX) - 3.0;
    nm = normalize(vec3(mapH(p.xz - vec2(em, 0.0), lm) - mapH(p.xz + vec2(em, 0.0), lm), 2.0*em, mapH(p.xz - vec2(0.0, em), lm) - mapH(p.xz + vec2(0.0, em), lm)));
    conv = p.y - mapH(p.xz, lm);
  }
  vec3 alb = alpsAlbedo(p, n, nm, t, conv);
  /* close up: wind ripples on snow; fractured rock with cracks, projected along the face */
  float fade = cheap ? 0.0 : 1.0 - smoothstep(25.0, 320.0, t);
  if (fade > 0.0){
    float snowy = smoothstep(0.5, 0.75, luma(alb));
    vec2 q = mat2(0.8, 0.6, -0.6, 0.8)*p.xz;
    vec2 g = noised(q*vec2(0.55, 1.9)).yz*vec2(0.55, 1.9)*0.05*snowy;
    g += noised(p.xz*0.23 + 7.0).yz*0.23*0.18;
    n = normalize(n + vec3(-g.x, 0.0, -g.y)*fade);
    float rk = (1.0 - snowy)*fade;
    if (rk > 0.0){
      vec3 ax = abs(n.y) > 0.65 ? vec3(1.0, 0.0, 0.0) : (abs(n.x) > abs(n.z) ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0));
      vec3 ay = abs(n.y) > 0.65 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
      vec2 uv = vec2(dot(p, ax), dot(p, ay));
      vec3 c1 = noised(uv*0.29 + 2.0), c2 = noised(uv*0.083 + 5.0), c3 = noised(uv*1.1 + 9.0);
      vec2 gr = c1.yz*0.29*0.55 + c2.yz*0.083*1.4 + c3.yz*1.1*0.12;
      n = normalize(n - (ax*gr.x + ay*gr.y)*rk);
      alb *= 1.0 - rk*0.45*smoothstep(0.82, 0.98, 1.0 - abs(c1.x));
      alb *= 1.0 + rk*0.22*c2.x;
    }
  }
  return alpsLight(p, n, rd, alb, cheap);
}

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  int steps = uQ == 0 ? 170 : uQ == 1 ? 250 : 340;
  float t = marchH(ro, rd, 0.5, 60000.0, steps, 0.0);
  float lake = uP0.z;
  float tw = (rd.y < 0.0 && ro.y > lake) ? (lake - ro.y)/rd.y : -1.0;
  vec3 col; float dep;
  if (tw > 0.0 && (t < 0.0 || tw < t)){
    vec3 p = ro + rd*tw;
    /* calm water with patches of wind ripples */
    float gust = smoothstep(-0.1, 0.5, noise(p.xz*0.004 + vec2(uT*0.03, 0.0)));
    vec3 n = waveN(p.xz, uT, tw, mix(0.008, 0.03, gust), 0.14);
    vec3 rr = reflect(rd, n);
    rr.y = abs(rr.y);
    float F = fres(dot(n, -rd), 0.02);
    vec3 refl;
    float tr = marchH(p + vec3(0.0, 0.5, 0.0), rr, 1.0, 30000.0, uQ == 0 ? 110 : 180, 1.5);
    if (tr > 0.0){
      refl = alpsTerrain(p, rr, tr, true);
      refl = applyFog(refl, p, rr, tr);
    } else {
      refl = skyCol(rr, 0.3);
    }
    float wd = max(lake - mapH(p.xz, 6.0), 0.0);
    /* what lies under the surface: stones in the shallows, dark green depth */
    vec3 bed = mix(vec3(0.16, 0.15, 0.12), vec3(0.09, 0.11, 0.07), sat(0.5 + noise(p.xz*0.08)));
    vec3 absorb = exp(-wd*vec3(0.45, 0.16, 0.12));
    vec3 body = bed*absorb*(uAmb*0.8 + uSunC*0.35*sat(uSun.y)) + vec3(0.004, 0.025, 0.03)*(1.0 - absorb.g);
    col = mix(body, refl, F);
    col += uSunC*pow(sat(dot(reflect(rd, n), uSun)), 900.0)*10.0;
    dep = tw;
    col = applyFog(col, ro, rd, tw);
  } else if (t > 0.0){
    col = alpsTerrain(ro, rd, t, false);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else {
    col = skyCol(rd, 1.0);
    if (rd.y > 0.0){
      float tc = (11000.0 - ro.y)/rd.y;
      vec2 cp = (ro.xz + rd.xz*tc)*0.00011 + vec2(uGT*0.002, 0.0);
      float cl = smoothstep(0.2, 0.85, fbm(cp*vec2(1.0, 2.6), 5) + 0.15);
      col = mix(col, vec3(1.0)*luma(uSunC)*0.42 + uAmb*0.45, cl*0.35*sat(rd.y*5.0));
    }
    col = applyFog(col, ro, rd, 30000.0);
    dep = SKYT;
  }
  float cdep;
  vec4 cl = marchClouds(ro, rd, dep, fc, cdep);
  if (cl.a < 0.999){
    col = overClouds(col, cl, cdep, ro, rd);
    if (cl.a < 0.5) dep = min(dep, cdep);
  }
  return vec4(col, dep);
}
</script>

<script type="x-glsl" id="g-lagoon">
/* THE CORAL SEA — an atoll ring: turquoise lagoon, white sand islands, surf on the reef, deep blue outside.
   uP0: atoll centre x, z, ring radius, -
   uP1: cloud shadow strength, hero island angle (rad), hero island half-length (m), - */
float cloudLocal(vec3 p){ return 0.0; }
float rimDist(vec2 xz, out vec2 dir, out float r){
  vec2 c = xz - uP0.xy;
  r = length(c);
  dir = c/max(r, 1.0);
  float wob = 160.0*noise(dir*2.2 + 3.0) + 50.0*noise(xz*0.0021) + 14.0*noise(xz*0.011);
  return r - uP0.z - wob;
}
float bedH(vec2 xz, out float isl){
  vec2 dir; float r;
  float dr = rimDist(xz, dir, r);
  /* lagoon floor: sand flats, deeper channels, coral heads */
  float n1 = fbm(xz*0.0028, 4);
  float lag = -6.5 + 3.2*n1;
  lag += 4.0*smoothstep(0.3, 0.65, noise(xz*0.0042 + 7.0));               // sand shoals
  lag += 3.5*smoothstep(0.55, 0.8, noise(xz*0.021 + 2.0))*smoothstep(-0.2, 0.2, n1); // coral heads
  float h = mix(lag, -0.7 + 0.35*noise(xz*0.045), smoothstep(-300.0, -60.0, dr));
  /* the reef crest, then the wall down to the deep */
  h = mix(h, -0.35, (1.0 - smoothstep(10.0, 45.0, abs(dr - 15.0))));
  h = mix(h, -90.0 + 12.0*n1, smoothstep(40.0, 190.0, dr));
  /* motu: sand islands strung along the rim, one long hero island where we pass */
  vec2 hd = vec2(cos(uP1.y), sin(uP1.y));
  float along = dot(dir, vec2(-hd.y, hd.x))*r;
  float hero = (1.0 - smoothstep(0.0, uP1.z, abs(along)))*step(0.0, dot(dir, hd));
  float m = max(smoothstep(0.36, 0.55, noise(dir*7.0 + 11.0) + 0.2*noise(xz*0.004)), hero);
  float band = 1.0 - smoothstep(30.0, 90.0 + 70.0*hero, abs(dr + 40.0));
  isl = m*band;
  h = max(h, mix(-60.0, -1.0 + 4.2*isl + 1.2*noise(xz*0.02)*isl, smoothstep(0.0, 0.18, isl)));
  return h;
}
float mapH(vec2 xz, float lod){
  float isl;
  float h = bedH(xz, isl);
  /* low scrub on dry land (the palms are drawn separately) */
  if (h > 0.4 && lod > 3.0){
    float c1 = 1.0 - abs(noise(xz*0.21 + 5.0));
    float veg = smoothstep(1.4, 2.4, h)*smoothstep(-0.45, 0.0, noise(xz*0.05 + 1.0));
    float c2 = 1.0 - abs(noise(xz*0.55 + 2.0));
    h += veg*(0.9 + 1.5*c1*c1 + 0.8*c2*c2 + 0.35*noise(xz*1.7));
  }
  return h;
}
float probeH(vec2 xz){
  float isl;
  float g = bedH(xz, isl);
  /* palms stand up to ~16 m above dry land; keep clear of their crowns */
  return max(mapH(xz, 8.0), 0.0) + 16.0*smoothstep(1.0, 2.0, g);
}

/* ---- palms: one per 12 m cell on dry land, trunk curving up to a crown of drooping fronds ---- */
const float PC = 12.0;
float capsule(vec3 p, vec3 a, vec3 b, float ra, float rb){
  vec3 pa = p - a, ba = b - a;
  float h = sat(dot(pa, ba)/dot(ba, ba));
  return length(pa - ba*h) - mix(ra, rb, h);
}
/* palm in the cell: returns 0 if none; base point, height, lean */
bool palmAt(vec2 cell, out vec3 base, out float H, out vec2 lean, out float rot){
  vec2 c = (cell + 0.5)*PC + (hash22(cell) - 0.5)*2.0;
  float isl;
  float g = bedH(c, isl);
  if (g < 1.5 || hash12(cell + 7.1) < 0.3 + 0.35*smoothstep(0.0, 0.5, noise(c*0.02 + 4.0))) return false;
  base = vec3(c.x, g, c.y);
  H = 6.5 + 8.5*pow(hash12(cell + 3.3), 0.7);
  float a = hash12(cell + 9.9)*TAU;
  lean = vec2(cos(a), sin(a))*(1.0 + 2.6*hash12(cell + 5.5));
  rot = hash12(cell + 1.7)*TAU;
  return true;
}
float palmSDF(vec3 p, vec3 base, float H, vec2 lean, float rot, out float part){
  vec3 q = p - base;
  /* trunk: two segments bending with the lean */
  vec3 m = vec3(lean.x*0.3, H*0.5, lean.y*0.3), top = vec3(lean.x, H, lean.y);
  float d = min(capsule(q, vec3(0.0), m, 0.24, 0.19), capsule(q, m, top, 0.19, 0.15));
  part = 0.0;
  /* crown: ten fronds arching out and down, flat blades with feathered edges */
  vec3 c = q - top;
  if (dot(c, c) < 49.0){
    float best = 1e9;
    for (int i = 0; i < 10; i++){
      float fi = float(i);
      float a = rot + fi*0.628 + 0.25*sin(fi*3.1);
      vec3 dir = vec3(cos(a), 0.0, sin(a));
      float L = 3.8 + 1.2*fract(sin(fi*12.9 + rot)*43.7);
      float droop = 1.2 + 1.4*fract(sin(fi*7.3 + rot*3.0)*91.1);
      vec3 p1 = dir*L*0.45 + vec3(0.0, 0.5 - 0.3*droop*0.3, 0.0), p2 = dir*L + vec3(0.0, -droop, 0.0);
      /* flatten across the blade: squash distance along the local up */
      vec3 side = vec3(-dir.z, 0.0, dir.x);
      vec3 cc = c - side*dot(c, side)*0.0;
      vec3 sq3 = cc + vec3(0.0, cc.y*1.6, 0.0);
      float k = sat(dot(c, dir)/L);
      float feather = 0.06*sin(dot(c, dir)*9.0 + fi);
      float bl = min(capsule(sq3, vec3(0.0), p1 + vec3(0.0, p1.y*1.6, 0.0), 0.06, 0.42 + feather), capsule(sq3, p1 + vec3(0.0, p1.y*1.6, 0.0), p2 + vec3(0.0, p2.y*1.6, 0.0), 0.42 + feather, 0.04));
      best = min(best, bl*0.6);
    }
    if (best < d){ d = best; part = 1.0; }
  }
  return d;
}
float palmsD(vec3 p, out float part, out vec3 base){
  vec2 cell = floor(p.xz/PC);
  float H, rot; vec2 lean;
  part = 0.0;
  if (!palmAt(cell, base, H, lean, rot)) return 1e9;
  return palmSDF(p, base, H, lean, rot, part);
}
/* march the palm layer between ta and tb */
float marchPalms(vec3 ro, vec3 rd, float ta, float tb, out float part, out vec3 base){
  float t = ta;
  part = 0.0;
  for (int i = 0; i < 90; i++){
    if (t > tb) break;
    vec3 p = ro + rd*t;
    float d = palmsD(p, part, base);
    if (d < 0.02 + 0.0008*t) return t;
    /* never step past the cell border: the next cell may hold a palm */
    vec2 f = (p.xz/PC - floor(p.xz/PC))*PC;
    vec2 tx = vec2(rd.x > 0.0 ? PC - f.x : f.x, rd.z > 0.0 ? PC - f.y : f.y)/max(abs(rd.xz), vec2(1e-3));
    float edge = min(tx.x, tx.y) + 0.05;
    t += max(min(d, edge), 0.05);
  }
  return -1.0;
}
vec3 palmN(vec3 p){
  float part; vec3 b;
  vec2 e = vec2(0.03, 0.0);
  return normalize(vec3(palmsD(p + e.xyy, part, b) - palmsD(p - e.xyy, part, b),
                        palmsD(p + e.yxy, part, b) - palmsD(p - e.yxy, part, b),
                        palmsD(p + e.yyx, part, b) - palmsD(p - e.yyx, part, b)));
}
float palmShadow(vec3 p){
  float part; vec3 b;
  float res = 1.0, t = 0.3;
  for (int i = 0; i < 16; i++){
    vec3 q = p + uSun*t;
    if (q.y > 16.0) break;
    float d = palmsD(q, part, b);
    res = min(res, 6.0*d/t);
    t += clamp(d, 0.15, 1.5);
  }
  return sat(res);
}

float cloudShadow(vec3 p){
  float tc = (0.5*(uCL.x + uCL.y) - p.y)/max(uSun.y, 0.1);
  vec3 q = p + uSun*tc;
  float d = cloudD(q, false) + cloudD(q + uSun*200.0, false);
  return mix(1.0, exp(-d*2.4), uP1.x);
}
/* caustics: the waves above focus the sun into a moving web of bright threads; two webs at different scales
   and drifts, the finer one weaker, so it never reads as a tiled pattern */
float caustic(vec2 xz, float t){
  float c = 0.0;
  for (int i = 0; i < 2; i++){
    float fi = float(i);
    vec2 q = M2*(xz*(0.28 + 0.31*fi)) + vec2(t*0.21, -t*0.16)*(1.0 + 0.6*fi) + fi*17.0;
    q += 0.35*vec2(noise(q*0.37 + 5.0), noise(q*0.37 + 9.0));
    float n = abs(noise(q) + 0.65*noise(q*2.1 + 3.0));
    c += pow(1.0 - sat(n), 6.0)*(1.0 - 0.45*fi);
  }
  return c*(0.55 + 0.45*noise(xz*0.05 + t*0.03));
}

/* the sky as the sea reflects it, clouds and all: one cheap look through the cloud slab */
vec3 seaSky(vec3 p, vec3 rr){
  vec3 c = skyCol(rr, 0.0);
  if (rr.y > 0.02){
    float y1 = mix(uCL.x, uCL.y, 0.22), y2 = mix(uCL.x, uCL.y, 0.42);
    float d = cloudD(p + rr*((y1 - p.y)/rr.y), false) + cloudD(p + rr*((y2 - p.y)/rr.y), false);
    float a = (1.0 - exp(-d*2.2))*smoothstep(0.02, 0.12, rr.y);
    c = mix(c, uSunC*(0.5 + 0.35*sat(dot(rr, uSun))) + uAmb*0.7, a);
  }
  return c;
}

vec3 landShade(vec3 p, vec3 n, vec3 rd, float t){
  float isl; float ground = bedH(p.xz, isl);
  float veg = smoothstep(0.25, 1.0, p.y - ground)*smoothstep(1.0, 2.0, ground);
  vec3 sand = vec3(0.93, 0.88, 0.76)*(0.94 + 0.08*noise(p.xz*0.4));
  vec3 green = mix(vec3(0.03, 0.08, 0.02), vec3(0.13, 0.2, 0.04), sat(0.5 + 0.8*noise(p.xz*0.16) + 0.4*noise(p.xz*1.3)));
  green *= 0.6 + 0.6*sat(n.y)*sat(0.5 + noise(p.xz*2.1));
  vec3 alb = mix(sand, green, veg);
  alb *= 1.0 - 0.4*(1.0 - smoothstep(0.05, 0.5, p.y));
  float dif = sat(dot(n, uSun));
  float sh = dif > 0.0 ? shadowH(p + n*0.3, 10.0) : 0.0;
  if (sh > 0.0 && t < 600.0) sh *= palmShadow(p + n*0.1);
  sh *= cloudShadow(p);
  float occ = 0.55 + 0.45*sat((p.y - ground)/3.0 + (1.0 - veg));
  return alb*(uSunC*dif*sh + uAmb*occ*(0.55 + 0.45*n.y));
}

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  float tw = (rd.y < 0.0 && ro.y > 0.0) ? -ro.y/rd.y : -1.0;
  float t = marchH(ro, rd, 0.3, tw > 0.0 ? tw + 0.5 : 30000.0, uQ == 0 ? 120 : 200, 0.0);
  vec3 col; float dep;
  /* palms: only near the eye, inside the layer they live in */
  float tp = -1.0, part = 0.0; vec3 pbase;
  {
    float ta = rd.y < 0.0 ? max((16.0 - ro.y)/rd.y, 0.0) : 0.0;
    float tb = rd.y < 0.0 ? (0.0 - ro.y)/rd.y : (16.0 - ro.y)/max(rd.y, 1e-3);
    if (ro.y > 16.0 && rd.y >= 0.0) tb = -1.0;
    float tend = min(tb, min(t > 0.0 ? t : 1e9, 900.0));
    if (tend > ta) tp = marchPalms(ro, rd, ta, tend, part, pbase);
  }
  if (tp > 0.0){
    vec3 p = ro + rd*tp;
    vec3 n = palmN(p);
    float dif = dot(n, uSun);
    float sh = shadowH(p + n*0.2, 10.0)*palmShadow(p + n*0.25)*cloudShadow(p);
    vec3 alb;
    if (part > 0.5){
      alb = mix(vec3(0.07, 0.16, 0.03), vec3(0.2, 0.3, 0.06), hash12(floor(pbase.xz)));
      /* fronds glow when the sun is behind them */
      float trans = pow(sat(dot(rd, uSun)), 3.0)*0.6;
      col = alb*(uSunC*(sat(dif) + trans + 0.25*sat(-dif))*sh + uAmb*(0.5 + 0.3*n.y));
    } else {
      alb = vec3(0.32, 0.27, 0.21)*(0.85 + 0.3*noise(p.xz*3.0 + p.y*2.0));
      col = alb*(uSunC*sat(dif)*sh + uAmb*(0.45 + 0.3*n.y));
    }
    col = applyFog(col, ro, rd, tp);
    dep = tp;
  } else if (t > 0.0 && (tw < 0.0 || t < tw)){
    vec3 p = ro + rd*t;
    col = landShade(p, normalH(p.xz, t), rd, t);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else if (tw > 0.0){
    vec3 p = ro + rd*tw;
    float isl;
    float bed = bedH(p.xz, isl);
    float depth = max(-bed, 0.0);
    vec2 dir; float r;
    float dr = rimDist(p.xz, dir, r);
    float calm = smoothstep(60.0, -150.0, dr);
    float open_ = smoothstep(60.0, 300.0, dr);
    /* the sea: wind waves outside the reef, a small chop inside, flattening over the shallows */
    vec4 w = ocean(p.xz, uT, tw, calm);
    float sk = mix(0.3, 1.0, smoothstep(0.4, 4.0, depth));
    vec3 n = normalize(vec3(-w.x*sk, 1.0, -w.y*sk));
    float s2 = 0.002 + w.w*sk;
    vec3 rr = reflect(rd, n); rr.y = abs(rr.y);
    float F = fres(dot(n, -rd), 0.02);
    vec3 refl = seaSky(p, rr);
    float cs = cloudShadow(p);
    /* the sea floor seen through the water */
    vec3 rf = refract(rd, n, 0.75);
    float path = depth/max(-rf.y, 0.25);
    vec3 bp = p + rf*path;
    float coral = smoothstep(0.55, 0.8, noise(bp.xz*0.021 + 2.0))*smoothstep(-8.0, -2.0, bed);
    /* the reef flat is living coral and rubble, not sand */
    float flat_ = smoothstep(-95.0, -55.0, dr)*(1.0 - smoothstep(22.0, 42.0, dr));
    coral = max(coral, flat_*(0.55 + 0.45*smoothstep(-0.3, 0.3, noise(bp.xz*0.09))));
    vec3 bedC = mix(vec3(0.88, 0.85, 0.74), mix(vec3(0.42, 0.33, 0.22), vec3(0.24, 0.3, 0.2), noise(bp.xz*0.2) + 0.5), coral);
    vec3 E = uSunC*sat(uSun.y)*cs*(0.8 + 0.5*caustic(bp.xz, uT)*smoothstep(12.0, 2.0, depth)) + uAmb*0.5;
    vec3 sig = vec3(0.75, 0.11, 0.075);
    vec3 trans = exp(-(path + depth)*sig);
    vec3 scat = vec3(0.0, 0.11, 0.15)*(uAmb*0.8 + uSunC*0.25*cs);
    vec3 body = bedC*E*trans*0.55 + scat*(1.0 - exp(-(path + depth)*0.09));
    col = mix(body, refl, F);
    /* the sun's glitter: a path of glints that widens with the roughness (Beckmann microfacets) */
    vec3 hv = normalize(uSun - rd);
    float nh = max(dot(n, hv), 1e-3), nh2 = nh*nh;
    float D = exp(-(1.0 - nh2)/(nh2*s2))/(3.14159*s2*nh2*nh2);
    col += uSunC*cs*D*fres(dot(hv, -rd), 0.02)/(4.0*max(dot(n, -rd), 0.1))*step(0.0, uSun.y);
    /* light through the crests: thin water lit from behind turns green-blue */
    float back = pow(sat(dot(normalize(rd.xz + 1e-4), normalize(uSun.xz + 1e-4))), 2.0);
    float wc = smoothstep(0.55, 1.0, w.z);
    col += vec3(0.03, 0.3, 0.26)*uSunC*cs*(0.15 + 0.85*back)*wc*wc*(1.0 - F)*0.35*open_;
    /* whitecaps: foam on the sharpest crests, in patches where the wind gusts, streaked by the waves */
    float gust = smoothstep(0.35, 0.8, noise(p.xz*0.004 + vec2(uT*0.015, 0.0)) + 0.5);
    float ft = smoothstep(0.25, 0.75, noise(p.xz*0.4 + w.xy*3.0) + 0.6*noise(p.xz*1.7 - uT*0.3));
    float cap = smoothstep(0.62, 0.76, w.z)*gust*ft*open_;
    col = mix(col, vec3(0.92)*(uSunC*0.45*cs + uAmb*0.8), cap*0.85);
    /* surf breaks along the reef crest, in sets that run along it */
    float crest = 1.0 - smoothstep(0.0, 14.0, abs(dr - 34.0 + 6.0*noise(p.xz*0.02)));
    float sets = smoothstep(0.45, 0.95, sin(dr*0.16 - uT*1.7 + 6.0*noise(dir*9.0)));
    float broken = smoothstep(0.2, 0.7, noise(p.xz*0.06 + vec2(uT*0.5, 0.0)) + 0.3*noise(p.xz*0.21));
    float surf = crest*(0.25 + 0.75*sets)*broken;
    surf += (1.0 - smoothstep(0.0, 0.3, depth))*0.25*(0.5 + 0.5*sin(uT*1.3 + r*0.05))*step(0.5, isl);
    col = mix(col, vec3(0.94)*(uSunC*0.5*cs + uAmb*0.75), sat(surf)*0.9);
    dep = tw;
    col = applyFog(col, ro, rd, tw);
  } else {
    col = skyCol(rd, 1.0);
    col = applyFog(col, ro, rd, 30000.0);
    dep = SKYT;
  }
  float cdep;
  vec4 cl = marchClouds(ro, rd, dep, fc, cdep);
  col = overClouds(col, cl, cdep, ro, rd);
  if (cl.a < 0.5) dep = min(dep, cdep);
  return vec4(col, dep);
}
</script>

<script type="x-glsl" id="g-canyon">
/* THE RED CANYON — golden hour: buttes standing on a red valley floor, a canyon cut into it, a basin at sunset.
   uP0: valley floor level, bed thickness, -, river level
   uB[i]: butte x, z, radius, height (the ones along the route) */
uniform vec4 uB[6];
const float CMEAN = 1600.0;
float strata(float h){
  float T = uP0.y;
  float f = h/T, i = floor(f), x = f - i;
  float hard = step(0.45, fract(sin(i*12.989)*437.58));
  float k = mix(0.4, 0.22, hard);
  return (i + smoothstep(0.0, k, x)*0.85 + x*0.15)*T;
}
/* one butte: sheer walls on a talus apron, a flat caprock top */
float butte(vec2 xz, vec4 b, out float wall){
  vec2 q = (xz - b.xy)/b.z;
  float d = length(q*vec2(1.0, 0.82)) + 0.12*noise(xz*0.012 + b.xy*0.01) + 0.05*noise(xz*0.05);
  float cliff = 1.0 - smoothstep(0.92, 1.0, d);
  float talus = 1.0 - smoothstep(1.0, 1.75, d);
  wall = cliff*(1.0 - cliff)*4.0;
  return b.w*(0.8*cliff + 0.2*talus*talus);
}
float buttes(vec2 xz, out float wall){
  float h = 0.0; wall = 0.0;
  for (int i = 0; i < 6; i++){
    float w;
    float bh = butte(xz, uB[i], w);
    if (bh > h){ h = bh; wall = sat(bh/uB[i].w); }
  }
  /* more far away, scattered by noise */
  float n = noise(xz*0.0011 + 3.0) + 0.3*noise(xz*0.0047);
  float far = smoothstep(0.47, 0.5, n)*smoothstep(1500.0, 2500.0, length(xz - vec2(0.0, 1400.0)));
  float fh = far*(260.0 + 120.0*noise(xz*0.002));
  if (fh > h){ h = fh; wall = far; }
  return h;
}
float mapH(vec2 xz, float lod){
  float broad;
  float e = fbmE2(xz*(1.0/2200.0) + vec2(4.2, 1.3), min(lod, 9.0), broad);
  float bw;
  float b = buttes(xz, bw);
  /* the shape that never changes with distance, and the finer relief that fades out far away */
  float hs0 = uP0.x + 45.0*broad + 4.0*noise(xz*0.004) + b;
  float h = hs0 + 45.0*(e - broad);
  float hc; vec4 f, pb;
  float w = corridor(xz, h, CMEAN, hc, f, pb);
  h = mix(h, hc, w);
  float hst = mix(hs0, hc, w);
  /* ledges on the canyon walls and on the talus at the foot of the buttes, cut from the stable shape so
     they cannot crawl as we fly; the butte cliffs stay sheer, their bands are in the rock colour */
  float d = f.b;
  vec4 pa = profA(f.g);
  float cw = w*smoothstep(pa.y*0.7, pa.y*1.2, d)*(1.0 - smoothstep(pa.z*0.95, pa.z*1.3, d));
  float walls = max(cw, smoothstep(0.02, 0.08, bw)*(1.0 - smoothstep(0.15, 0.21, bw)));
  h += (strata(hst + 5.0*noise(xz*0.01)) - hst)*0.7*walls;
  /* the river channel down the middle of the canyon */
  h -= w*7.0*(1.0 - smoothstep(16.0, 34.0, d))*smoothstep(uP0.w + 30.0, uP0.w + 5.0, h);
  return h;
}
float probeH(vec2 xz){ return max(mapH(xz, 9.0), uP0.w); }

vec3 rockColor(vec3 p, vec3 n){
  float l = (p.y + 18.0*noise(p.xz*0.004) + 6.0*noise(p.xz*0.03))/uP0.y;
  float band = fract(l*0.31);
  vec3 c = mix(vec3(0.6, 0.25, 0.12), vec3(0.7, 0.33, 0.15), smoothstep(0.1, 0.5, band));
  c = mix(c, vec3(0.78, 0.55, 0.36), smoothstep(0.6, 0.68, band)*(1.0 - smoothstep(0.76, 0.82, band))*0.6);
  c = mix(c, vec3(0.45, 0.22, 0.15), smoothstep(0.86, 0.95, band)*0.6);
  float cliff = 1.0 - smoothstep(0.35, 0.7, n.y);
  /* desert varnish: dark streaks down the cliffs, textured on the world axes so they stay put */
  float wx = wallX(n);
  vec2 ua = p.xy, ub = p.zy;
  float va = noise(vec2(ua.x*0.045, ua.y*0.0035)) + 0.15*noise(ua*vec2(0.12, 0.02));
  float vb = noise(vec2(ub.x*0.045 + 17.0, ub.y*0.0035)) + 0.15*noise(ub*vec2(0.12, 0.02) + 5.0);
  float v = smoothstep(0.45, 0.85, mix(va, vb, wx));
  c *= 1.0 - 0.4*v*cliff;

  /* sand, ripples and sage on the flats */
  float flat_ = smoothstep(0.82, 0.95, n.y);
  c = mix(c, vec3(0.8, 0.46, 0.25)*(0.92 + 0.12*noise(p.xz*0.08)), flat_*0.7);
  float sage = smoothstep(0.7, 0.78, noise(p.xz*0.42))*flat_;
  c = mix(c, vec3(0.28, 0.3, 0.2), sage*0.75);
  /* grain, blended between the flats and the two wall axes so no seam shows where they meet */
  float gw = mix(0.12*noise(ua*0.45) + 0.08*noise(ua*1.7), 0.12*noise(ub*0.45 + 3.0) + 0.08*noise(ub*1.7 + 3.0), wx);
  float gf = 0.12*noise(p.xz*0.45) + 0.08*noise(p.xz*1.7);
  c *= 0.88 + mix(gw, gf, smoothstep(0.6, 0.8, n.y));
  return c;
}

vec3 canyonShade(vec3 p, vec3 n, vec3 rd, float t, bool cheap){
  vec3 alb = rockColor(p, n);
  float dif = sat(dot(n, uSun));
  float sh = dif > 0.0 ? shadowH(p + n*1.0, cheap ? 6.0 : 14.0) : 0.0;
  float occ = sat(1.0 + (p.y - mapH(p.xz, 4.0))/80.0);
  occ = 0.35 + 0.65*occ;
  /* rock lights rock: warm bounce fills the shade */
  vec3 bounce = vec3(1.0, 0.42, 0.18)*uSunC*0.11*(0.6 + 0.4*(1.0 - n.y));
  vec3 lin = uSunC*dif*sh + uAmb*occ*(0.5 + 0.5*n.y) + bounce*occ;
  return alb*lin;
}

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  float t = marchH(ro, rd, 0.5, 40000.0, uQ == 0 ? 170 : 280, 0.0);
  float tw = (rd.y < 0.0 && ro.y > uP0.w) ? (uP0.w - ro.y)/rd.y : -1.0;
  vec3 col; float dep;
  if (tw > 0.0 && (t < 0.0 || tw < t) && mapH((ro + rd*tw).xz, 6.0) < uP0.w){
    vec3 p = ro + rd*tw;
    vec3 n = waveN(p.xz - vec2(0.0, uT*3.0), uT, tw, 0.04, 0.12);
    vec3 rr = reflect(rd, n); rr.y = abs(rr.y);
    float tr = marchH(p + vec3(0.0, 0.5, 0.0), rr, 1.0, 6000.0, 80, 2.0);
    vec3 refl = tr > 0.0 ? canyonShade(p + rr*tr, normalH((p + rr*tr).xz, tr), rr, tr, true) : skyCol(rr, 0.2);
    float F = fres(dot(n, -rd), 0.02);
    vec3 body = vec3(0.1, 0.09, 0.05)*(uAmb + uSunC*0.2);
    col = mix(body, refl, F);
    col = applyFog(col, ro, rd, tw);
    dep = tw;
  } else if (t > 0.0){
    vec3 p = ro + rd*t;
    col = canyonShade(p, normalH(p.xz, t), rd, t, false);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else {
    col = skyCol(rd, 1.0);
    if (rd.y > 0.0){
      float tc = (8000.0 - ro.y)/rd.y;
      vec2 cp = (ro.xz + rd.xz*tc)*0.00009 + vec2(uGT*0.001, 0.0);
      float cl = smoothstep(0.25, 0.85, fbm(cp*vec2(1.0, 3.2), 5) + 0.1);
      vec3 cc = mix(vec3(1.0, 0.55, 0.4), vec3(1.0, 0.82, 0.6), sat(dot(rd, uSun)))*luma(uSunC)*0.5 + uAmb*0.3;
      col = mix(col, cc, cl*0.55*sat(rd.y*6.0));
    }
    col = applyFog(col, ro, rd, 40000.0);
    dep = SKYT;
  }
  return vec4(col, dep);
}
</script>

<script type="x-glsl" id="g-ice">
/* THE ICE SEA — twilight on a still sea: tabular icebergs, a glacier front, the aurora rising.
   uP0: aurora strength (0..1), berg cell size, -, -
   uP1: afterglow direction x, z (unit), afterglow strength, - */
const float BC = 300.0;
uniform vec4 uBerg[6];
/* a tabular berg: sheer walls, a flat, slightly tilted top; underwater skirt */
float tabBerg(vec2 xz, vec4 b, float seed){
  vec2 q = xz - b.xy;
  float a = seed*6.283;
  q = mat2(cos(a), sin(a), -sin(a), cos(a))*q;
  q.x *= 0.62;
  float d = length(q)/b.z + 0.22*noise(xz*0.009 + seed*7.0) + 0.09*noise(xz*0.035) + 0.03*noise(xz*0.12);
  float wall = 1.0 - smoothstep(0.9 + 0.06*noise(xz*0.02 + seed), 1.0, d);
  float under = 1.0 - smoothstep(1.0, 1.5, d);
  /* tops: some flat, some domed, some broken into steps */
  float dome = smoothstep(0.2, 0.8, noise(vec2(seed*13.0, 2.0)) + 0.5);
  float top = b.w*(1.0 + 0.35*dome*(1.0 - d)) + 4.0*noise(xz*0.02) + q.x*0.03 + 9.0*smoothstep(0.6, 0.0, d)*noise(xz*0.007 + seed);
  return mix(-12.0*under - 30.0*(1.0 - under), top, wall);
}
/* icebergs: at most one per cell, tabular or pinnacled */
float bergCell(vec2 xz, vec2 cell, out float tab){
  vec2 h2 = hash22(cell);
  tab = 0.0;
  if (hash12(cell + 3.1) < 0.62) return -40.0;
  vec2 c = (cell + 0.25 + 0.5*h2)*BC;
  float r = 18.0 + 40.0*hash12(cell + 9.2);
  vec2 q = xz - c;
  float a = hash12(cell + 1.3)*6.283;
  q = mat2(cos(a), sin(a), -sin(a), cos(a))*q;
  q.x *= 0.55 + 0.6*hash12(cell + 4.4);
  float d = length(q)/r + 0.18*noise(xz*0.02 + cell) + 0.06*noise(xz*0.09);
  float H = 6.0 + 20.0*hash12(cell + 7.7);
  tab = step(0.7, hash12(cell + 5.5));
  float top = mix(H*(1.0 - smoothstep(0.0, 1.0, d))*1.3, H + 3.0*noise(xz*0.03), tab);
  float wall = 1.0 - smoothstep(0.92, 1.02, d);
  float under = 1.0 - smoothstep(1.0, 1.6, d);
  return mix(-14.0*under - 26.0*(1.0 - under), top, wall);
}
float bergs(vec2 xz, out float tab){
  vec2 cell = floor(xz/BC);
  float h = -40.0; tab = 0.0;
  for (int i = 0; i < 6; i++){
    float b = tabBerg(xz, uBerg[i], float(i)*0.37 + 0.1);
    if (b > h){ h = b; tab = 1.0; }
  }
  for (int j = 0; j <= 1; j++) for (int i = 0; i <= 1; i++){
    vec2 c = cell + vec2(float(i), float(j)) - step(fract(xz/BC), vec2(0.5));
    float tb;
    float b = bergCell(xz, c, tb);
    if (b > h){ h = b; tab = tb; }
  }
  return h;
}
float mapH(vec2 xz, float lod){
  float tab;
  float h = bergs(xz, tab);
  /* the glacier front far to the left, and dark mountains behind it */
  float gl = smoothstep(2450.0, 2600.0, -xz.x + 60.0*noise(vec2(xz.y*0.004, 1.0)));
  if (gl > 0.0) h = max(h, mix(-30.0, 46.0 + 8.0*noise(xz*0.02) + 0.05*max(-xz.x - 2600.0, 0.0), gl));
  return h;
}
float probeH(vec2 xz){ return max(mapH(xz, 8.0), 0.0); }

/* ---- the aurora: folded curtains of light, bright at the hem ---- */
vec3 auroraN(vec3 ro, vec3 rd, int N);
vec3 aurora(vec3 ro, vec3 rd){ return auroraN(ro, rd, 40); }
vec3 auroraN(vec3 ro, vec3 rd, int N){
  if (rd.y < 0.02 || uP0.x <= 0.0) return vec3(0.0);
  vec3 acc = vec3(0.0);
  float base = 9000.0, top = 17000.0;
  float t0 = (base - ro.y)/rd.y, t1 = (top - ro.y)/rd.y;
  t1 = min(t1, t0 + 60000.0);
  float dt = (t1 - t0)/float(N);
  float jt = fract(ign(gl_FragCoord.xy) + uGT*0.618);
  for (int i = 0; i < 40; i++){
    if (i >= N) break;
    float t = t0 + dt*(float(i) + jt);
    vec3 p = ro + rd*t;
    float hf = (p.y - base)/(top - base);
    /* two curtains crossing the sky, folding and drifting */
    float x = p.x*0.0001;
    float c1 = p.z*0.0001 - 2.2 - 0.55*sin(x*1.3 + uT*0.04) - 0.25*noise(vec2(x*2.7 + uT*0.03, 1.0)) - 0.08*noise(vec2(x*11.0 - uT*0.08, 4.0));
    float c2 = p.z*0.0001 - 3.4 - 0.4*sin(x*0.9 + 1.7 - uT*0.03) - 0.3*noise(vec2(x*3.1 - uT*0.02, 7.0));
    float sheet = exp(-c1*c1*120.0) + 0.6*exp(-c2*c2*80.0);
    float rays = 0.35 + 0.65*pow(noise(vec2(p.x*0.0021 + uT*0.12, p.z*0.0003)) * 0.5 + 0.5, 2.0);
    float d = sheet*rays*exp(-hf*2.6)*smoothstep(0.0, 0.05, hf);
    vec3 c = mix(vec3(0.12, 1.0, 0.42), vec3(0.8, 0.22, 0.75), smoothstep(0.3, 0.85, hf));
    acc += c*d;
  }
  return acc*dt*0.00065*uP0.x;
}
vec3 starfield(vec3 rd){
  if (rd.y < 0.0) return vec3(0.0);
  vec2 sp = rd.xz/(rd.y + 0.35)*520.0;
  vec2 cell = floor(sp), fr = fract(sp) - 0.5;
  float hsh = hash12(cell);
  float s = step(0.982, hsh)*smoothstep(0.09, 0.0, length(fr - (hash22(cell) - 0.5)*0.6));
  return vec3(0.85, 0.9, 1.0)*s*(0.4 + 1.4*fract(hsh*91.7))*smoothstep(0.05, 0.4, rd.y);
}
vec3 twilightSkyN(vec3 ro, vec3 rd, int N);
vec3 twilightSky(vec3 ro, vec3 rd){ return twilightSkyN(ro, rd, 40); }
/* the mountains around the horizon: a skyline far away, drawn as part of the sky */
float skyline(vec3 rd, out float shade){
  float az = atan(rd.x, rd.z);
  vec2 p = vec2(cos(az), sin(az))*3.2;
  float r = 0.0, a = 0.5, w = 1.0;
  for (int i = 0; i < 6; i++){ float v = 1.0 - abs(noise(p)); v *= v; r += a*v*w; w = sat(v*1.6); a *= 0.5; p = M2*p*2.0; }
  float h = 0.012 + 0.11*r*r;
  shade = 0.5 + 0.5*noise(vec2(az*40.0, rd.y*400.0));
  return h;
}
vec3 twilightSkyN(vec3 ro, vec3 rd, int N){
  vec3 c = skyCol(rd, 0.0);
  float msh;
  float mh = skyline(rd, msh);
  if (rd.y > -0.002 && rd.y < mh){
    /* snow above the dark lower slopes, rose afterglow on the tops */
    float k = sat((rd.y + 0.002)/mh);
    vec3 m = mix(vec3(0.05, 0.055, 0.08), vec3(0.42, 0.4, 0.5), smoothstep(0.45, 0.8, k + 0.15*msh));
    vec2 hd = normalize(rd.xz + 1e-5);
    m += vec3(0.5, 0.25, 0.25)*uP1.z*0.25*pow(sat(dot(hd, uP1.xy)*0.5 + 0.5), 3.0)*k;
    return applyFog(m*(uAmb*1.4 + 0.05), ro, rd, 11000.0);
  }
  /* the afterglow hugs the horizon where the sun went down */
  vec2 hd = normalize(rd.xz + 1e-5);
  float az = sat(dot(hd, uP1.xy)*0.5 + 0.5);
  float hz = exp(-max(rd.y, 0.0)*9.0);
  c += vec3(1.0, 0.42, 0.18)*uP1.z*pow(az, 3.0)*hz;
  c += vec3(0.9, 0.35, 0.5)*uP1.z*0.25*pow(az, 1.5)*exp(-max(rd.y, 0.0)*3.0);
  c += starfield(rd)*(1.0 - 0.6*pow(az, 2.0));
  c += auroraN(ro, rd, N);
  return c;
}

vec3 iceShade(vec3 p, vec3 n, vec3 rd, float t){
  float tab;
  bergs(p.xz, tab);
  bool mtn = p.y > 120.0 && length(p.xz - vec2(0.0, 3000.0)) > 8500.0;
  vec3 alb = mtn ? mix(vec3(0.06, 0.06, 0.07), vec3(0.7, 0.72, 0.78), smoothstep(0.6, 0.8, n.y)) : vec3(0.82, 0.88, 0.94);
  /* ice: denser blue in the walls, white on the tops, grooved */
  float wall = 1.0 - smoothstep(0.4, 0.8, n.y);
  if (!mtn){
    float groove = mix(noise(vec2(p.x*0.35, p.y*0.03)), noise(vec2(p.z*0.35 + 9.0, p.y*0.03)), wallX(n));
    alb = mix(alb, vec3(0.64, 0.77, 0.86), wall*(0.6 + 0.2*groove));
    alb = mix(alb, vec3(0.15, 0.62, 0.66), wall*(1.0 - smoothstep(0.0, 4.0, p.y))*0.7);
    alb *= 0.92 + 0.08*noise(p.xz*0.3 + p.y*0.2);
  }
  vec2 hd = uP1.xy;
  vec3 glowDir = normalize(vec3(hd.x, 0.08, hd.y));
  float glow = sat(dot(n, glowDir));
  /* ice catches the whole sky: brighter than the ambient alone, rim-lit by the afterglow */
  /* the aurora's green light on the ice, without marching it again */
  vec3 lin = uAmb*(1.0 + 0.7*n.y) + vec3(1.0, 0.55, 0.45)*uP1.z*0.6*glow + vec3(0.06, 0.32, 0.16)*uP0.x*(0.4 + 0.6*sat(n.y + 0.3));
  if (!mtn) lin += vec3(0.3, 0.38, 0.5)*0.12*(1.0 - n.y);
  return alb*lin;
}

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  float tw = (rd.y < 0.0 && ro.y > 0.0) ? -ro.y/rd.y : -1.0;
  /* nothing under the surface needs marching: stop at the water */
  float t = marchH(ro, rd, 0.3, tw > 0.0 ? tw + 0.5 : 40000.0, uQ == 0 ? 140 : 220, 0.0);
  vec3 col; float dep;
  if (tw > 0.0 && (t < 0.0 || tw < t)){
    vec3 p = ro + rd*tw;
    vec3 n = waveN(p.xz, uT*0.6, tw, 0.0045, 0.11);
    vec3 rr = reflect(rd, n); rr.y = abs(rr.y);
    float F = fres(dot(n, -rd), 0.02);
    float tr = marchH(p + vec3(0.0, 0.2, 0.0), rr, 0.5, 30000.0, uQ == 0 ? 90 : 150, 1.5);
    vec3 refl = tr > 0.0 ? applyFog(iceShade(p + rr*tr, normalH((p + rr*tr).xz, tr), rr, tr), p, rr, tr) : twilightSkyN(p, rr, 18);
    /* ice below the surface glows turquoise near the bergs */
    float tab;
    float bh = bergs(p.xz, tab);
    float sub = smoothstep(-26.0, -10.0, bh);
    vec3 body = mix(vec3(0.004, 0.01, 0.018), vec3(0.04, 0.2, 0.22), sub)*(uAmb*1.2 + 0.1);
    col = mix(body, refl, sat(F + 0.15));
    dep = tw;
    col = applyFog(col, ro, rd, tw);
  } else if (t > 0.0){
    vec3 p = ro + rd*t;
    col = iceShade(p, normalH(p.xz, t), rd, t);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else {
    col = twilightSky(ro, rd);
    col = applyFog(col, ro, rd, 30000.0);
    dep = SKYT;
  }
  return vec4(col, dep);
}
</script>

<script type="x-glsl" id="g-fwv">
#version 300 es
precision highp float;
precision highp int;
/* FIREWORKS — every star, trail, spark, rising shell and break flash as a streak. A moving body is drawn
   from where it is now to where it was when the shutter opened, each end seen by its own camera; a trail
   is drawn along the sparks a star has shed, which have been falling since. Per shell, four vec4:
   centre, burst time | colour 1, kind | colour 2, star speed | drag, burn, seed, rise time.
   kinds: 0 peony, 1 chrysanthemum, 2 willow, 3 brocade, 4 ring, 5 strobe, 6 crackle, 7 salute, 8 pistil, 9 palm */
uniform vec4 uB[128];
uniform int uPer;
uniform int uS;
uniform int uT;
uniform float uTime;
uniform float uShut;
uniform float uMirror;
uniform float uPd;
uniform float uPix;
uniform vec3 uCam;
uniform vec3 uPCam;
uniform vec3 uWind;
uniform mat3 uRot;
uniform mat3 uPRot;
uniform vec2 uExt;
uniform vec2 uRes;
out vec2 vQ;      /* position in the streak's frame, px: along, across */
out vec4 vH;      /* half length, core radius, halo radius, halo strength */
out vec2 vG;      /* brightness at the old end, at the new end */
out vec3 vCol;
out float vDist;
const float G = 9.81;
const int TRAIL = 3;
float h1(float n){ return fract(sin(n)*43758.5453123); }
vec3 sph(float a, float b){ float z = a*2.0 - 1.0, t = b*6.2831853, r = sqrt(max(1.0 - z*z, 0.0)); return vec3(r*cos(t), z, r*sin(t)); }
/* flight under drag toward the wind, and gravity — exact */
vec3 vterm(float k){ return uWind - vec3(0.0, G/k, 0.0); }
vec3 flyP(vec3 p0, vec3 v0, float k, float t){ vec3 vt = vterm(k); return p0 + (v0 - vt)*(1.0 - exp(-k*t))/k + vt*t; }
vec3 flyV(vec3 v0, float k, float t){ vec3 vt = vterm(k); return (v0 - vt)*exp(-k*t) + vt; }
/* the panini camera: pixel position and distance (z < 0: behind) */
vec3 proj(vec3 p, vec3 cam, mat3 rot){
  vec3 v = transpose(rot)*(p - cam);
  float r = length(v.xz);
  if (v.z < 0.25 || r < 1e-4) return vec3(0.0, 0.0, -1.0);
  float c = v.z/r, sn = v.x/r, hh = v.y/r;
  float S = (uPd + 1.0)/(uPd + c);
  vec2 ndc = vec2(S*sn, S*hh)/uExt;
  return vec3((ndc*0.5 + 0.5)*uRes, length(v));
}
/* a cooling ember: white-gold, orange, deep red, out */
vec3 ember(float u){
  vec3 c = mix(vec3(1.0, 0.84, 0.55), vec3(1.0, 0.4, 0.09), smoothstep(0.08, 0.55, u));
  return mix(c, vec3(0.55, 0.09, 0.02), smoothstep(0.55, 1.0, u));
}
void main(){
  int id = gl_InstanceID, corner = gl_VertexID;
  int b = id/uPer, e = id - b*uPer;
  vec4 B0 = uB[b*4], B1 = uB[b*4 + 1], B2 = uB[b*4 + 2], B3 = uB[b*4 + 3];
  gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  vCol = vec3(0.0); vQ = vec2(0.0); vH = vec4(1.0, 1.0, 1.0, 0.0); vG = vec2(1.0); vDist = 0.0;
  vec3 C = B0.xyz;
  int kind = int(B1.w + 0.5);
  float v0 = B2.w, kd = B3.x, burn = B3.y, seed = B3.z, rise = B3.w;
  float age = uTime - B0.w;
  vec3 P, Pb, col;
  float L, rad, halo = 0.0, gOld = 1.0, gNew = 1.0;
  bool line = false, head = false;
  int nTr = uS*TRAIL, nSp = uS*uT;
  if (e < uS + nTr + nSp) {
    if (age < 0.0) return;
    int s, part, j;
    if (e < uS) { s = e; part = 0; j = 0; }
    else if (e < uS + nTr) { s = (e - uS)/TRAIL; part = 1; j = e - uS - s*TRAIL; }
    else { s = (e - uS - nTr)/uT; part = 2; j = e - uS - nTr - s*uT; }
    int nS = kind == 9 ? 14 : kind == 7 ? 0 : kind == 4 ? min(uS, 80) : uS;
    if (s >= nS) return;
    float fs = float(s), hs = h1(fs*1.37 + seed*17.0);
    /* where it was thrown: an even sphere, a little ragged; a ring; palm fronds thrown up */
    vec3 dir;
    if (kind == 4) {
      vec3 U = normalize(sph(h1(seed*3.1), h1(seed*5.7)));
      vec3 V = normalize(cross(U, abs(U.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
      float a = 6.2831853*(fs + 0.25*hs)/float(nS);
      dir = cos(a)*U + sin(a)*V;
    } else {
      float fi = fs + 0.5, z = 1.0 - 2.0*fi/float(nS), ph = fi*2.3999632 + seed*6.2831853, rr = sqrt(max(0.0, 1.0 - z*z));
      dir = normalize(vec3(rr*cos(ph), z, rr*sin(ph)) + sph(h1(fs*7.7 + seed), h1(fs*9.1 + seed))*0.08);
      if (kind == 9) dir = normalize(dir*vec3(1.0, 0.5, 1.0) + vec3(0.0, 0.75, 0.0));
    }
    float spd = v0*(0.9 + 0.2*h1(fs*5.3 + seed));
    bool core = kind == 8 && s < nS/3;
    if (core) spd *= 0.5;
    vec3 V0 = dir*spd;
    float myBurn = burn*(0.86 + 0.28*h1(fs*3.3 + seed*2.0));
    if (kind == 6) myBurn = burn*(0.7 + 0.6*h1(fs*3.3 + seed));
    if (part == 0) {
      /* the star: a pellet burning in its own flame */
      if (age > myBurn + (kind == 6 ? 0.05 : 0.0)) return;
      P = flyP(C, V0, kd, age);
      Pb = flyP(C, V0, kd, max(age - uShut, 0.0));
      float fl = 0.82 + 0.36*h1(floor(uTime*45.0) + fs*1.7 + seed);
      float on = 1.0 - smoothstep(myBurn - 0.3, myBurn, age);
      L = 700.0*fl*on*(1.0 + 1.5*exp(-age/0.08));
      col = core ? B2.rgb : B1.rgb;
      if (kind == 0 && dot(B2.rgb, vec3(1.0)) > 0.01) col = mix(B1.rgb, B2.rgb, smoothstep(myBurn*0.5, myBurn*0.6, age));
      if (kind == 2 || kind == 9) { col = vec3(1.0, 0.6, 0.24); L *= kind == 2 ? 0.25 : 0.5; }
      if (kind == 3) { col = vec3(1.0, 0.86, 0.62); L *= 0.5; }
      if (kind == 5) { col = vec3(1.0, 0.97, 0.92); L *= age < 0.25 ? 1.0 : 2.0*step(0.55, fract(age*(9.0 + 6.0*hs) + hs)); }
      if (kind == 6) { col = vec3(1.0, 0.78, 0.42); L *= 0.4; if (age > myBurn) { L = 2000.0; col = vec3(1.0, 0.96, 0.85); } }
      rad = kind == 9 ? 0.12 : 0.06; halo = 0.04; gOld = 0.3; head = true;
    } else if (part == 1) {
      /* its trail: the sparks it shed along the way, each fallen and cooled since */
      float tau = kind == 2 ? 2.4 : kind == 3 ? 1.2 : kind == 9 ? 1.2 : kind == 1 ? 0.7 : kind == 6 ? 0.3 : 0.0;
      if (tau <= 0.0) return;
      float tEnd = min(age, myBurn), t1 = tEnd - tau*float(j)/float(TRAIL), t2 = max(tEnd - tau*float(j + 1)/float(TRAIL), 0.0);
      if (t1 <= 0.0) return;
      float ks = kind == 2 ? 1.5 : 3.0, kf = kind == 2 ? 0.4 : 0.2, life = tau*1.15;
      gNew = pow(max(0.0, 1.0 - (age - t1)/life), 1.5); gOld = pow(max(0.0, 1.0 - (age - t2)/life), 1.5);
      if (gNew <= 0.0) return;
      P = flyP(flyP(C, V0, kd, t1), flyV(V0, kd, t1)*kf, ks, age - t1);
      Pb = flyP(flyP(C, V0, kd, t2), flyV(V0, kd, t2)*kf, ks, age - t2);
      col = kind == 3 ? vec3(1.0, 0.8, 0.5) : vec3(1.0, 0.56, 0.18);
      L = kind == 3 ? 16.0 : kind == 2 ? 11.0 : 10.0;
      rad = 0.05; line = true;
    } else {
      float hj = h1(fs*13.1 + float(j)*7.31 + seed);
      if (kind == 6) {
        /* crackle: the star blows apart into hot pops */
        float life = 0.16 + 0.18*hj, pa = age - myBurn;
        if (pa < 0.0 || pa > life) return;
        vec3 sp = flyP(C, V0, kd, myBurn), dv = sph(h1(hj*91.3), h1(hj*17.9))*(16.0 + 14.0*hj);
        P = flyP(sp, dv, 6.0, pa); Pb = flyP(sp, dv, 6.0, max(pa - uShut, 0.0));
        L = 400.0*(1.0 - pa/life); col = vec3(1.0, 0.92, 0.72); rad = 0.04;
      } else {
        /* loose sparks thrown off the tail, each slot re-lit once per life */
        if (!(kind == 1 || kind == 2 || kind == 3 || kind == 9)) return;
        float life = (kind == 2 ? 2.3 : kind == 3 ? 1.15 : kind == 9 ? 1.7 : 0.6)*(0.7 + 0.6*hj);
        float ph = age/life + float(j)/float(uT), cyc = floor(ph), sa = fract(ph)*life, te = age - sa;
        if (te < 0.0 || te > myBurn) return;
        vec3 sp = flyP(C, V0, kd, te), sv = flyV(V0, kd, te);
        float hc = h1(hj*31.7 + cyc*1.618);
        vec3 dv = sv*(kind == 2 ? 0.4 : 0.22) + sph(hc, h1(hc*7.1))*(kind == 3 ? 8.0 : 4.5);
        float ks = kind == 2 ? 1.5 : 3.2;
        P = flyP(sp, dv, ks, sa); Pb = flyP(sp, dv, ks, max(sa - uShut, 0.0));
        float u = sa/life;
        col = ember(u);
        L = (kind == 3 ? 60.0 : kind == 2 ? 26.0 : 40.0)*(1.0 - u)*(1.0 - u);
        if (kind == 3) L *= 0.4 + 2.0*step(0.62, h1(floor(uTime*32.0) + hc*53.0));
        rad = 0.04;
      }
    }
  } else {
    int c = e - uS - nTr - nSp;
    /* the barge it was fired from */
    vec3 Lp = vec3(C.x + (h1(seed*3.7) - 0.5)*36.0, 1.0, C.z + (h1(seed*8.1) - 0.5)*36.0);
    if (c == 0) {
      if (age < 0.0) {
        /* the shell climbing, slowing toward its break */
        if (age < -rise) return;
        float u = (age + rise)/rise, ub = clamp((age - uShut + rise)/rise, 0.0, 1.0);
        P = mix(Lp, C, 1.0 - (1.0 - u)*(1.0 - u)); Pb = mix(Lp, C, 1.0 - (1.0 - ub)*(1.0 - ub));
        L = 300.0*(0.85 + 0.3*h1(floor(uTime*40.0) + seed)); col = vec3(1.0, 0.72, 0.42); rad = 0.07; halo = 0.05;
      } else {
        /* the break: the burst charge, one blinding moment */
        if (age > 0.3) return;
        P = C; Pb = C;
        L = (kind == 7 ? 160.0 : 50.0)*exp(-age/(kind == 7 ? 0.05 : 0.04));
        col = vec3(1.0, 0.93, 0.82); rad = kind == 7 ? 2.0 : 1.2; halo = 0.35;
      }
    } else {
      /* its rising tail: sparks shed by the climbing shell */
      if (age > 0.9 || age < -rise) return;
      float life = 0.75, hj = h1(float(c)*3.7 + seed);
      float ph = (age + rise)/life + float(c)/float(uPer - uS - nTr - nSp - 1), cyc = floor(ph), sa = fract(ph)*life, te = age - sa;
      if (te < -rise || te > 0.0) return;
      float u = (te + rise)/rise;
      vec3 sp = mix(Lp, C, 1.0 - (1.0 - u)*(1.0 - u));
      vec3 dv = sph(h1(hj + cyc*0.37), h1(hj*3.3 + cyc*0.71))*3.5 - vec3(0.0, 5.0, 0.0);
      P = flyP(sp, dv, 2.5, sa); Pb = flyP(sp, dv, 2.5, max(sa - uShut, 0.0));
      float k = sa/life;
      col = ember(k*0.9); L = 50.0*(1.0 - k); rad = 0.04;
    }
  }
  if (uMirror > 0.5) { P.y = -P.y; Pb.y = -Pb.y; L *= 0.55; }
  /* a trail is a shape in space now; a moving body smears across the shutter */
  vec3 a = proj(P, uCam, uRot), bb = line ? proj(Pb, uCam, uRot) : proj(Pb, uPCam, uPRot);
  if (a.z < 0.0) return;
  if (bb.z < 0.0) { if (line) return; bb = a; }
  float rt = rad/(a.z*uPix), r = clamp(rt, 1.0, head ? 4.0 : halo > 0.2 ? 40.0 : 3.0);
  L *= line ? min(1.0, rt/r) : min(1.0, (rt*rt)/(r*r));
  vec2 d = a.xy - bb.xy;
  float len = length(d);
  if (len > 400.0) { if (line) return; d *= 400.0/len; len = 400.0; }
  vec2 ax = len > 1e-3 ? d/len : vec2(1.0, 0.0), ay = vec2(-ax.y, ax.x);
  float hl = 0.5*len;
  if (!line) L *= r/(r + hl*0.75);
  float rh = halo > 0.0 ? max(3.0*r, 6.0) : r, ext = 2.0*max(r, rh);
  vec2 cq = vec2(float(corner & 1), float(corner >> 1))*2.0 - 1.0;
  vec2 q = vec2(cq.x*(hl + ext), cq.y*ext);
  vec2 px = a.xy - 0.5*d + ax*q.x + ay*q.y;
  gl_Position = vec4(px/uRes*2.0 - 1.0, 0.0, 1.0);
  vQ = q; vH = vec4(hl, r, rh, halo); vG = vec2(gOld, gNew); vCol = col*L; vDist = a.z;
}

<script type="x-glsl" id="g-fwf">
#version 300 es
precision highp float;
in vec2 vQ;
in vec4 vH;
in vec2 vG;
in vec3 vCol;
in float vDist;
uniform sampler2D uDepth;
uniform vec2 uRes;
uniform vec2 uExt;
uniform float uPd;
uniform mat3 uRot;
uniform vec3 uCam;
uniform float uMirror;
out vec4 oCol;
vec3 paniniDir(vec2 q){
  float d = uPd, x2 = q.x*q.x, k = (d + 1.0)*(d + 1.0);
  float A = x2 + k, B = 2.0*d*x2, C = x2*d*d - k;
  float c = (-B + sqrt(max(B*B - 4.0*A*C, 0.0)))/(2.0*A);
  float s = q.x*(d + c)/(d + 1.0);
  float S = (d + 1.0)/(d + c);
  return normalize(vec3(s, q.y/S, c));
}
void main(){
  /* distance from the streak's segment, in its own radii */
  float dx = max(abs(vQ.x) - vH.x, 0.0), dd = dx*dx + vQ.y*vQ.y;
  float a = exp(-dd/(vH.y*vH.y)*2.4) + vH.w*exp(-dd/(vH.z*vH.z)*2.0);
  a *= mix(vG.x, vG.y, clamp((vQ.x + vH.x)/max(2.0*vH.x, 1e-3), 0.0, 1.0));
  if (a < 0.002) discard;
  float sd = texelFetch(uDepth, ivec2(gl_FragCoord.xy), 0).a;
  if (uMirror < 0.5){
    if (vDist > sd) discard;
  } else {
    /* reflections only where this pixel sees open water at the mirrored distance */
    vec3 rd = normalize(uRot*paniniDir((gl_FragCoord.xy/uRes*2.0 - 1.0)*uExt));
    if (rd.y >= -1e-4) discard;
    float tw = -uCam.y/rd.y;
    if (abs(sd - tw) > 0.02*tw + 1.0) discard;
  }
  oCol = vec4(vCol*a, 0.0);
}
</script>
<script type="x-glsl" id="g-fsv">
#version 300 es
precision highp float;
precision highp int;
/* FIREWORK SMOKE — each shell leaves a shell of smoke where its stars burned, drifting on the wind and
   lit by every shell burning near it. Per smoke shell, two vec4: centre, burst time | spread, seed, -, -.
   Per light, two vec4: centre, burst time | colour, strength */
uniform vec4 uSm[96];
uniform vec4 uLt[56];
uniform int uNL;
uniform int uPuffs;
uniform float uTime;
uniform float uPd;
uniform float uPix;
uniform vec3 uCam;
uniform vec3 uWind;
uniform vec3 uAmb;
uniform mat3 uRot;
uniform vec2 uExt;
uniform vec2 uRes;
out vec2 vUV;
out vec3 vCol;
out float vA;
out float vDist;
out vec3 vSeed;
float h1(float n){ return fract(sin(n)*43758.5453123); }
void main(){
  int id = gl_InstanceID, corner = gl_VertexID;
  int b = id/uPuffs, i = id - b*uPuffs;
  vec4 S0 = uSm[b*2], S1 = uSm[b*2 + 1];
  gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  vA = 0.0; vUV = vec2(0.0); vCol = vec3(0.0); vDist = 0.0; vSeed = vec3(0.0);
  float age = uTime - S0.w;
  if (age < 0.03) return;
  float seed = S1.y, R = S1.x;
  float fi = float(i) + 0.5, z = 1.0 - 2.0*fi/float(uPuffs), ph = fi*2.3999632 + seed*6.2831853, rr = sqrt(max(0.0, 1.0 - z*z));
  vec3 dir = normalize(vec3(rr*cos(ph), z, rr*sin(ph)) + (vec3(h1(fi*3.1 + seed), h1(fi*5.7 + seed), h1(fi*9.3 + seed)) - 0.5)*0.6);
  /* the smoke is laid down along the stars' paths, then hangs and spreads on the wind */
  float spread = R*(0.3 + 0.5*h1(fi*7.7 + seed))*(1.0 - exp(-age*1.9));
  vec3 P = S0.xyz + dir*spread + uWind*age*(0.8 + 0.4*h1(fi*4.4 + seed)) + vec3(0.0, 0.18*age - 1.2*(1.0 - exp(-age*0.8)), 0.0);
  float size = 2.5 + 6.0*(1.0 - exp(-age/1.2)) + 0.4*age;
  float dens = smoothstep(0.0, 0.8, age)*exp(-age/12.0)*(0.3 + 0.7*h1(fi*2.9 + seed))*0.35;
  /* light from every shell burning now: the break flash, then the stars */
  vec3 light = uAmb;
  for (int l = 0; l < 28; l++) {
    if (l >= uNL) break;
    vec4 L0 = uLt[l*2], L1 = uLt[l*2 + 1];
    float la = uTime - L0.w;
    if (la < 0.0) continue;
    float I = L1.w*(8.0*exp(-la/0.05) + 0.5*exp(-la/1.3));
    vec3 q = P - L0.xyz;
    float r0 = 35.0;
    light += L1.rgb*I*r0*r0/(r0*r0 + dot(q, q));
  }
  vec3 v = transpose(uRot)*(P - uCam);
  float dist = length(v);
  if (v.z < 0.5) return;
  /* inside a puff there is only haze: let it go before it fills the view */
  dens *= smoothstep(size*0.6, size*1.8, dist);
  if (dens < 0.004) return;
  float r = length(v.xz), c = v.z/r, sn = v.x/r, hh = v.y/r, S = (uPd + 1.0)/(uPd + c);
  vec2 ndc = vec2(S*sn, S*hh)/uExt;
  float rpx = min(size/(dist*uPix), uRes.y*0.35);
  if (rpx < 0.75) return;
  vec2 cq = vec2(float(corner & 1), float(corner >> 1))*2.0 - 1.0;
  vec2 px = (ndc*0.5 + 0.5)*uRes + cq*rpx;
  gl_Position = vec4(px/uRes*2.0 - 1.0, 0.0, 1.0);
  vUV = cq; vCol = light; vA = dens; vDist = dist;
  vSeed = vec3(h1(fi + seed*1.7), h1(fi*1.3 + seed*2.9), age*0.025);
}
</script>
<script type="x-glsl" id="g-fsf">
#version 300 es
precision highp float;
precision highp sampler3D;
in vec2 vUV;
in vec3 vCol;
in float vA;
in float vDist;
in vec3 vSeed;
uniform sampler2D uDepth;
uniform sampler3D uCl;
out vec4 oCol;
void main(){
  float r2 = dot(vUV, vUV);
  if (r2 > 1.0) discard;
  float sd = texelFetch(uDepth, ivec2(gl_FragCoord.xy), 0).a;
  if (vDist > sd + 4.0) discard;
  /* billows: the cloud noise, turning slowly */
  vec4 n = texture(uCl, vec3(vUV*0.32 + vSeed.xy*5.0, vSeed.x + vSeed.z));
  float bill = smoothstep(0.35, 0.8, n.r*0.7 + n.g*0.5 - 0.05);

<script type="x-glsl" id="g-harbor">
/* THE HARBOR OF LIGHTS — a bay at night: a hill town of warm windows, a lighthouse, boats, fireworks.
   uP0: bay centre x, z, bay radius, -
   uP1: lighthouse x, z, height, beam angle (rad)
   uP2: firework flash rgb, - */
float southness(vec2 xz){ vec2 q = xz - uP0.xy; return sat(-q.y/max(length(q), 1.0)); }
/* land: hills around the bay, open to the sea in the south */
float landMask(vec2 xz, out float r){
  vec2 q = xz - uP0.xy;
  r = length(q);
  float coast = uP0.z + 70.0*noise(q*0.004) + 25.0*noise(q*0.017);
  float open_ = smoothstep(0.62, 0.86, southness(xz));
  float l = smoothstep(coast - 10.0, coast + 60.0, r);
  /* headlands either side of the mouth */
  return l*(1.0 - open_);
}
float town(vec2 xz, float r){
  float near = 1.0 - smoothstep(uP0.z + 160.0, uP0.z + 520.0, r);
  return near*smoothstep(0.25, 0.4, noise(xz*0.003 + 2.0) + 0.45);
}
float building(vec2 xz, out float lit){
  vec2 cell = floor(xz/14.0), f = fract(xz/14.0) - 0.5;
  vec2 hs = hash22(cell);
  vec2 sz = 0.28 + 0.16*hs;
  vec2 d = abs(f) - sz;
  float box = 1.0 - smoothstep(-0.02, 0.02, max(d.x, d.y));
  lit = hash12(cell + 3.7);
  return box*(6.0 + 13.0*hash12(cell + 1.9)*hash12(cell + 8.1));
}
float mapH(vec2 xz, float lod){
  float r;
  float l = landMask(xz, r);
  float hills = 30.0 + 260.0*fbm(xz*0.0012 + 3.0, 5) + 120.0*smoothstep(uP0.z + 200.0, uP0.z + 900.0, r);
  float h = mix(-25.0, hills*smoothstep(0.0, 1.0, l), l);
  h = mix(h, max(h, 3.0), l);
  /* the town */
  float tn = town(xz, r)*l;
  if (tn > 0.05 && lod > 3.0){
    float lit;
    h += tn*building(xz, lit);
  }
  /* the volcano behind the town */
  vec2 vq = xz - vec2(uP0.x + 400.0, uP0.y + 2600.0);
  float v = sat(1.0 - length(vq)/2300.0);
  if (v > 0.0) h = max(h, mix(-40.0, 1350.0*pow(v, 1.6) + 60.0*noise(xz*0.003)*v - 30.0*smoothstep(0.93, 1.0, v), smoothstep(0.0, 0.05, v)));
  return h;
}
float probeH(vec2 xz){ return max(mapH(xz, 7.0), 0.0); }

/* warm windows and street lamps: points of light in the town, sized to at least a pixel */
vec3 townLights(vec3 p, vec3 n, float t){
  t = max(t, 1.0);
  float r;
  float l = landMask(p.xz, r);
  float tn = town(p.xz, r)*l;
  vec3 e = vec3(0.0);
  if (tn < 0.05) return e;
  /* windows on the walls */
  float lit;
  float b = building(p.xz, lit);
  float wall = 1.0 - smoothstep(0.25, 0.6, abs(n.y));
  if (wall > 0.0 && b > 0.0){
    vec2 uv = abs(n.x) > abs(n.z) ? p.zy : p.xy;
    vec2 wc = floor(uv*vec2(0.42, 0.33)), wf = fract(uv*vec2(0.42, 0.33));
    float on = step(0.45, hash12(wc + floor(p.xz/14.0)*3.1))*step(0.25, lit);
    float win = smoothstep(0.32, 0.22, abs(wf.x - 0.5))*smoothstep(0.34, 0.24, abs(wf.y - 0.5));
    vec3 wcol = mix(vec3(1.0, 0.62, 0.28), vec3(1.0, 0.82, 0.55), hash12(wc + 11.0));
    float fade = smoothstep(2500.0, 300.0, t);
    e += wcol*win*on*wall*(0.9 + 1.4*fade)*2.4;
  }
  /* street lamps along the lanes */
  vec2 cell = floor(p.xz/9.0);
  vec2 lp = (cell + 0.5 + 0.3*(hash22(cell) - 0.5))*9.0;
  float has = step(0.72, hash12(cell + 5.3));
  float rad = max(0.7, t*uPix*1.6);
  float d = length(p.xz - lp);
  e += vec3(1.0, 0.7, 0.36)*has*exp(-d*d/(rad*rad))*(0.7*0.7/(rad*rad))*30.0;
  return e*tn;
}

/* the lighthouse beam: a slow-turning shaft of light in the haze */
vec3 beam(vec3 ro, vec3 rd, float tmax){
  vec3 L = vec3(uP1.x, uP1.z, uP1.y);
  vec3 ax = vec3(cos(uP1.w), -0.03, sin(uP1.w));
  /* closest approach between the eye ray and the beam axis */
  vec3 w = ro - L;
  float a = dot(rd, rd), b = dot(rd, ax), c = dot(ax, ax), d = dot(rd, w), e = dot(ax, w);
  float den = a*c - b*b;
  if (abs(den) < 1e-5) return vec3(0.0);
  float s = (b*e - c*d)/den, u = (a*e - b*d)/den;
  if (s < 0.0 || s > tmax || u < 0.0) return vec3(0.0);
  vec3 q = (ro + rd*s) - (L + ax*u);
  float dist = length(q);
  float width = 3.0 + u*0.022;
  float k = exp(-dist*dist/(width*width))*exp(-u*0.0011);
  /* looking straight down the beam, the lamp does the work; the shaft fades */
  k *= 1.0 - smoothstep(0.6, 0.97, dot(rd, -ax));
  /* standing in the beam lights the haze around us a little; it must not flood the view */
  float ue = max(dot(w, ax), 0.0);
  float near = length(w - ax*ue);
  k *= smoothstep(0.5, 3.0, near/(3.0 + ue*0.022));
  return vec3(1.0, 0.86, 0.6)*min(k, 0.6)*0.8;
}

vec3 nightSky(vec3 rd){
  vec3 c = skyCol(rd, 0.0);
  if (rd.y > 0.0){
    vec2 sp = rd.xz/(rd.y + 0.3)*560.0;
    vec2 cell = floor(sp), fr = fract(sp) - 0.5;
    float hsh = hash12(cell);
    c += vec3(0.85, 0.9, 1.0)*step(0.978, hsh)*smoothstep(0.1, 0.0, length(fr - (hash22(cell) - 0.5)*0.6))*(0.3 + 1.3*fract(hsh*71.3))*smoothstep(0.02, 0.3, rd.y);
    /* a faint milky band */
    float band = exp(-pow(dot(rd, normalize(vec3(0.7, 0.35, -0.6))), 2.0)*14.0);
    c += vec3(0.05, 0.06, 0.09)*band*(0.6 + 0.8*fbm(rd.xz*7.0/(rd.y + 0.5), 4))*smoothstep(0.0, 0.3, rd.y);
  }
  /* the town's glow on the low sky */
  vec2 hd = normalize(rd.xz + 1e-5);
  float toward = sat(dot(hd, normalize(uP0.xy - uCam.xz))*0.5 + 0.5);
  c += vec3(0.5, 0.26, 0.12)*0.05*pow(toward, 3.0)*exp(-max(rd.y, 0.0)*7.0);
  /* the moon */
  float m = dot(rd, uSun);
  c += vec3(0.9, 0.92, 1.0)*smoothstep(0.99985, 0.99992, m)*6.0;
  c += vec3(0.25, 0.3, 0.45)*0.06*pow(sat(m), 40.0);
  return c + uP2.xyz*0.02;
}

vec3 harborLand(vec3 p, vec3 n, vec3 rd, float t){
  float r;
  float l = landMask(p.xz, r);

vec4 shade(vec3 ro, vec3 rd, vec2 fc){
  float tw = (rd.y < 0.0 && ro.y > 0.0) ? -ro.y/rd.y : -1.0;
  float t = marchH(ro, rd, 0.3, tw > 0.0 ? tw + 0.5 : 30000.0, uQ == 0 ? 140 : 220, 0.0);
  vec3 col; float dep;
  if (tw > 0.0 && (t < 0.0 || tw < t)){
    vec3 p = ro + rd*tw;
    /* ripples stretch every light into a long, broken streak */
    vec3 n = waveN(p.xz*vec2(1.0, 0.35), uT*0.7, tw, 0.055, 0.09);
    vec3 rr = reflect(rd, n); rr.y = abs(rr.y);

    float tr = marchH(p + vec3(0.0, 0.3, 0.0), rr, 0.5, 9000.0, uQ == 0 ? 90 : 150, 1.5);
    vec3 refl = tr > 0.0 ? harborLand(p + rr*tr, normalH((p + rr*tr).xz, tr), rr, (tr + tw)*1.6) : nightSky(rr);
    refl += beam(p, rr, 8000.0)*0.35;
    col = mix(vec3(0.002, 0.004, 0.008) + uP2.xyz*0.01, refl, sat(F + 0.25));
    /* lanterns on boats moored in the bay */
    vec2 cell = floor(p.xz/38.0);
    vec2 bp = (cell + 0.5 + 0.35*(hash22(cell) - 0.5))*38.0;
    float rr2;
    float inBay = 1.0 - smoothstep(uP0.z - 120.0, uP0.z + 40.0, length(p.xz - uP0.xy));
    float has = step(0.84, hash12(cell + 2.2))*inBay;
    float rad = max(0.6, tw*uPix*1.6);
    float d = length(p.xz - bp);
    col += vec3(1.0, 0.75, 0.42)*has*exp(-d*d/(rad*rad))*(0.36/(rad*rad))*20.0;
    dep = tw;
    col = applyFog(col, ro, rd, tw);
  } else if (t > 0.0){
    vec3 p = ro + rd*t;
    col = harborLand(p, normalH(p.xz, t), rd, t);
    col = applyFog(col, ro, rd, t);
    dep = t;
  } else {
    col = nightSky(rd);
    col = applyFog(col, ro, rd, 30000.0);
    dep = SKYT;
  }
  col += beam(ro, rd, dep);
  /* the lighthouse lamp itself */
  vec3 L = vec3(uP1.x, uP1.z, uP1.y);
  vec3 toL = L - ro;
  float tl = dot(toL, rd);
  if (tl > 0.0 && tl < dep){
    float dl = length(toL - rd*tl);
    float rad = max(1.2, tl*uPix*2.0);
    col += vec3(1.0, 0.9, 0.7)*exp(-dl*dl/(rad*rad))*(1.44/(rad*rad))*60.0;
  }
  return vec4(col, dep);
}

/* ---------- starting, pausing, seeking, landing ---------- */
