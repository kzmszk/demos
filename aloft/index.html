<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALOFT — 世界の空を渡る、約五分の空中遊覧</title>
<meta name="description" content="ドームスクリーンの空中遊覧を、ブラウザの全画面で。雲の上から雪の尖峰、大瀑布、珊瑚の海、赤い峡谷、氷の海、花火の港へ。">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#fbf8f2; --dim:rgba(251,248,242,.7); --faint:rgba(251,248,242,.38); --hair:rgba(251,248,242,.42);
  --m:clamp(18px,3.4vmin,44px);
  --sans:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;font-feature-settings:"palt"}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
body[data-phase=fly] #cv,body[data-phase=board] #cv{cursor:none}
body[data-phase=fly].ptr #cv{cursor:default}
#ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 18px rgba(30,20,60,.18)}
button{all:unset;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- title: the page itself is the poster ---------- */
#title{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
body[data-phase=title] #title{opacity:1}
#mark{position:absolute;left:calc(var(--m) - .055em);top:calc(var(--m) - .19em);margin:0;font-weight:700;
  font-size:clamp(96px,25.5vw,520px);line-height:1;letter-spacing:-.052em;color:#fbf8f2}
#lede{position:absolute;left:var(--m);top:calc(var(--m) + clamp(96px,25.5vw,520px)*.84);width:min(30em,46vw)}
#lede .rule{display:block;width:clamp(120px,19vw,360px);height:1px;background:var(--ink);opacity:.8;margin:0 0 14px}
#lede p{margin:0;font-size:clamp(13px,1.45vmin + 4px,19px);line-height:1.75;letter-spacing:.06em;font-weight:500}
#lede small{display:block;margin-top:6px;font-size:clamp(10px,.9vmin + 4px,13px);letter-spacing:.12em;color:var(--dim)}
#route{position:absolute;right:var(--m);bottom:var(--m);margin:0;padding:0;list-style:none;counter-reset:r;
  font-size:clamp(10px,.75vmin + 5px,13px);line-height:2.05;letter-spacing:.1em;color:var(--dim);text-align:right}
#route li{counter-increment:r}
#route li::after{content:counter(r,decimal-leading-zero);display:inline-block;width:2.6em;color:var(--ink);font-variant-numeric:tabular-nums}
#board{position:absolute;left:var(--m);bottom:var(--m);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
#pass{font-size:clamp(10px,.75vmin + 5px,12px);letter-spacing:.22em;color:var(--dim);font-variant-numeric:tabular-nums}
#go{display:inline-flex;align-items:center;gap:1.1em;padding:.95em 1.5em .95em 1.7em;border:1px solid rgba(255,252,247,.85);
  border-radius:999px;font-size:clamp(14px,1.1vmin + 7px,19px);letter-spacing:.24em;font-weight:500;
  background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .3s,color .3s,opacity .4s}
#go i{font-style:normal;letter-spacing:0;transition:transform .3s}
#go:hover{background:rgba(255,252,247,.92);color:#1b1730;text-shadow:none}
#go:hover i{transform:translateX(5px)}
#go[disabled]{opacity:.55;pointer-events:none}
#tools{position:absolute;right:var(--m);top:var(--m);display:flex;gap:8px;opacity:0;transition:opacity .6s}
body[data-phase=title] #tools,body[data-phase=end] #tools{opacity:1}
#tools button{font-size:11px;letter-spacing:.22em;padding:8px 11px;border:1px solid var(--hair);border-radius:999px;color:var(--dim)}
#tools button:hover{color:var(--ink);border-color:var(--ink)}
@media (max-width:760px){
  #lede{width:auto;right:var(--m)}
  #route{display:none}
}
@media (max-aspect-ratio:3/4){
  #mark{font-size:31vw}
  #lede{top:calc(var(--m) + 31vw*.84)}
  #tools{top:auto;bottom:calc(var(--m) + 4px);right:var(--m)}
  #tools button{padding:7px 9px;letter-spacing:.14em}
  #hint{bottom:auto;top:62%;white-space:normal;text-align:center;width:80vw}
}

/* ---------- in flight ---------- */
#cap{position:absolute;left:var(--m);bottom:calc(var(--m) + 8px);opacity:0;transform:translateY(6px);transition:opacity 1.1s ease,transform 1.4s ease}
#cap.on{opacity:1;transform:none}
#cap b{display:block;font-weight:500;font-size:clamp(10px,.7vmin + 5px,12px);letter-spacing:.3em;color:var(--dim);font-variant-numeric:tabular-nums}
#cap strong{display:block;margin:.3em 0 .35em;font-size:clamp(22px,2.4vmin + 10px,44px);letter-spacing:.06em;font-weight:700;line-height:1.2}
#cap em{display:block;font-style:normal;font-size:clamp(11px,.8vmin + 5px,14px);letter-spacing:.14em;color:var(--dim)}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,40em);text-align:center;opacity:0;transition:opacity 1s ease;
  font-size:clamp(13px,1.1vmin + 7px,19px);letter-spacing:.2em;line-height:2;font-weight:500}
#msg.on{opacity:1}
#msg small{display:block;font-size:.7em;letter-spacing:.3em;color:var(--dim)}

/* controls appear when the pointer moves */
#ctl{position:absolute;left:0;right:0;bottom:0;padding:44px var(--m) calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:18px;
  background:linear-gradient(to top,rgba(8,8,16,.55),rgba(8,8,16,0));opacity:0;transition:opacity .5s;pointer-events:none}
body[data-phase=fly].ptr #ctl{opacity:1}
body[data-phase=fly].ptr #ctl *{pointer-events:auto}
#ctl button{font-size:11px;letter-spacing:.2em;color:var(--dim);padding:6px 4px}
#ctl button:hover{color:var(--ink)}
#bar{position:relative;flex:1;height:22px;cursor:pointer}
#bar::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:var(--faint)}
#bar i{position:absolute;left:0;top:10px;height:1px;background:var(--ink);width:0}
#bar span{position:absolute;top:5px;width:1px;height:11px;background:var(--hair)}
#bar span:hover::after{content:attr(data-n);position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.14em;color:var(--ink)}
#ctl .time{font-size:11px;letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}

/* ---------- landing ---------- */
#end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 var(--m);opacity:0;transition:opacity 1.6s ease;pointer-events:none}
body[data-phase=end] #end{opacity:1}
body[data-phase=end] #end button{pointer-events:auto}
#end h2{margin:0;font-size:clamp(48px,11vw,220px);letter-spacing:-.02em;font-weight:700;line-height:1}
#end p{margin:.9em 0 2.2em;font-size:clamp(12px,.9vmin + 6px,17px);letter-spacing:.18em;color:var(--dim)}
#end .row{display:flex;gap:12px;flex-wrap:wrap}
#end button{padding:.85em 1.5em;border:1px solid var(--hair);border-radius:999px;font-size:clamp(12px,.8vmin + 6px,15px);letter-spacing:.2em}
#end button:first-child{border-color:var(--ink)}
#end button:hover{background:rgba(255,252,247,.9);color:#1b1730;text-shadow:none}

#hint{position:absolute;left:50%;bottom:var(--m);transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .8s;white-space:nowrap}
#hint.on{opacity:1}
#dbg{position:fixed;left:8px;top:8px;font:11px/1.4 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.5);padding:6px 8px;white-space:pre;display:none;pointer-events:none;z-index:9}
body.dbg #dbg{display:block}
#fail{position:fixed;inset:0;display:none;place-items:center;padding:var(--m);text-align:center;font-size:15px;line-height:1.9;letter-spacing:.08em;color:var(--dim)}
</style>
</head>
<body data-phase="boot">
<canvas id="cv" aria-label="ALOFT"></canvas>
<div id="ui">
  <section id="title">
    <h1 id="mark" aria-label="ALOFT">ALOFT</h1>
    <div id="lede"><span class="rule"></span><p id="t-lede"></p><small id="t-note"></small></div>
    <ol id="route"></ol>
    <div id="board"><div id="pass"></div><button id="go" type="button" disabled><span id="go-l"></span><i aria-hidden="true">→</i></button></div>
  </section>
  <div id="tools"><button id="b-lang" type="button">JA / EN</button><button id="b-snd" type="button"></button></div>
  <div id="cap" role="status"><b id="cap-n"></b><strong id="cap-p"></strong><em id="cap-s"></em></div>
  <div id="msg" role="status"></div>
  <div id="hint"></div>
  <nav id="ctl" aria-label="controls">
    <button id="c-play" type="button"></button>
    <div id="bar" role="slider" aria-label="progress"><i></i></div>
    <span class="time" id="c-time"></span>
    <button id="c-snd" type="button"></button>
    <button id="c-fs" type="button"></button>
    <button id="c-exit" type="button"></button>
  </nav>
  <section id="end"><h2 id="e-h"></h2><p id="e-p"></p><div class="row"><button id="e-again" type="button"></button><button id="e-title" type="button"></button></div></section>
</div>
<div id="fail"></div>
<div id="dbg"></div>
<canvas id="ov" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:8"></canvas>

<!-- ================================================================
     GLSL — shared by every scene program
     ================================================================ -->
<script type="x-glsl" id="g-common">
#define PI 3.14159265359
#define TAU 6.28318530718
#define SKYT 6.0e4

uniform vec2  uRes;      // render target size (px)
uniform vec2  uJit;      // sub-pixel jitter (px)
uniform float uPix;      // angular size of one pixel at the centre (rad)
uniform float uT;        // scene-local time (s)
uniform float uGT;       // global time (s)
uniform vec3  uCam;      // camera position (m)
uniform mat3  uRot;      // camera basis: right, up, forward
uniform vec2  uExt;      // Panini half extents
uniform float uPd;       // Panini distance
uniform vec3  uSun;      // direction to the sun
uniform vec3  uSunC;     // sun radiance
uniform vec3  uZen;      // sky at zenith
uniform vec3  uHor;      // sky at the horizon
uniform vec3  uAmb;      // sky light on surfaces
uniform vec3  uFogC;     // haze colour
uniform vec4  uFog;      // density, height falloff, base height, sun glow in haze
uniform vec4  uSkyK;     // horizon falloff, glow 1, glow 2, sun disk cos
uniform vec2  uHB;       // min / max terrain height (bounds for the march)
uniform float uStepK;    // heightfield march step factor (smaller for steeper worlds)
uniform vec2  uStepMax;  // cap on a march step: a + b·t (narrow spires must not be stepped over)
uniform float uFade;     // transition cloud 0..1
uniform vec3  uFadeC;    // transition cloud colour
uniform vec4  uP0;
uniform vec4  uP1;
uniform vec4  uP2;
uniform vec4  uP3;
uniform int   uQ;        // 0 low, 1 mid, 2 high
uniform int   uDbg;      // 1 = top-down map
uniform vec4  uDbgBox;   // map box x0 z0 x1 z1
uniform sampler2D uNz;   // 256² value noise, corners packed in RGBA (texelFetch)
uniform highp sampler3D uCl; // 64³ cloud noise: R value fbm, G worley fbm, B worley detail, A white
uniform sampler2D uFeat; // path feature map: signed distance to the path, s along it, -, strength
uniform vec4  uFeatBox;  // x0, z0, 1/w, 1/h
uniform sampler2D uProf; // corridor profile along s: row 0 floor, inner, outer, rise; row 1 left, right, floor detail, extra
uniform vec2  uProfK;    // path length, floor base

out vec4 oCol;

float sat(float x){ return clamp(x, 0.0, 1.0); }
vec3 sat3(vec3 x){ return clamp(x, 0.0, 1.0); }
float sq(float x){ return x*x; }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float ign(vec2 fc){ return fract(52.9829189*fract(dot(fc, vec2(0.06711056, 0.00583715)))); }
float smax(float a, float b, float k){ float h = max(k - abs(a - b), 0.0)/k; return max(a, b) + h*h*k*0.25; }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0)/k; return min(a, b) - h*h*k*0.25; }

const mat2 M2 = mat2(0.80, 0.60, -0.60, 0.80);

/* value noise with analytic derivatives: x = value in [-1,1], yz = gradient */
vec3 noised(vec2 x){
  vec2 p = floor(x), f = x - p;
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);
  vec2 du = 30.0*f*f*(f*(f - 2.0) + 1.0);
  vec4 c = texelFetch(uNz, ivec2(p) & 255, 0);
  float k1 = c.y - c.x, k2 = c.z - c.x, k4 = c.x - c.y - c.z + c.w;
  return vec3(2.0*(c.x + k1*u.x + k2*u.y + k4*u.x*u.y) - 1.0, 2.0*du*vec2(k1 + k4*u.y, k2 + k4*u.x));
}
float noise(vec2 x){
  vec2 p = floor(x), f = x - p;
  f = f*f*(3.0 - 2.0*f);
  vec4 c = texelFetch(uNz, ivec2(p) & 255, 0);
  return 2.0*mix(mix(c.x, c.y, f.x), mix(c.z, c.w, f.x), f.y) - 1.0;
}
/* smooth 3D value noise in [0,1] from the 64³ white channel */
float noise3(vec3 p){
  vec3 i = floor(p), f = p - i;
  f = f*f*(3.0 - 2.0*f);
  return textureLod(uCl, (i + f + 0.5)/64.0, 0.0).a;
}
/* eroded fbm (derivative-damped), fractional octave count for smooth LOD */
float fbmE(vec2 p, float oct){
  float a = 0.0, b = 0.5; vec2 d = vec2(0.0);
  int n = int(ceil(oct));
  for (int i = 0; i < 14; i++){
    if (i >= n) break;
    vec3 v = noised(p);
    d += v.yz;
    float w = b*min(1.0, oct - float(i));
    a += w*v.x/(1.0 + dot(d, d));
    b *= 0.5; p = M2*p*2.0;
  }
  return a;
}
/* the same, also handing back the first four octaves alone: the broad shape, which never changes with distance */
float fbmE2(vec2 p, float oct, out float broad){
  float a = 0.0, b = 0.5; vec2 d = vec2(0.0);
  int n = int(ceil(oct));
  broad = 0.0;
  for (int i = 0; i < 14; i++){
    if (i >= n) break;
    vec3 v = noised(p);
    d += v.yz;
    float w = b*min(1.0, oct - float(i));
    a += w*v.x/(1.0 + dot(d, d));
    if (i < 4) broad += b*v.x/(1.0 + dot(d, d));
    b *= 0.5; p = M2*p*2.0;
  }
  return a;
}
/* how much a wall faces x rather than z: texture walls on the world axes, blended across corners.
   (Axes taken from the normal itself slide the texture by metres whenever the normal wavers.) */
float wallX(vec3 n){ float ax = abs(n.x), az = abs(n.z); return smoothstep(0.3, 0.7, ax/(ax + az + 1e-5)); }
float fbm(vec2 p, int oct){
  float a = 0.0, b = 0.5;
  for (int i = 0; i < 10; i++){ if (i >= oct) break; a += b*noise(p); b *= 0.5; p = M2*p*2.03; }
  return a;
}
/* octave count for a feature scale lambda0 seen at distance t */
float lodAt(float t, float lambda0, float omax){
  return clamp(log2(lambda0/(2.2*max(t, 1.0)*uPix)), 1.0, omax);
}

/* ---- camera rays: Panini projection keeps a wide, dome-like view without stretched edges ---- */
vec3 paniniDir(vec2 q){
  float d = uPd, x2 = q.x*q.x, k = (d + 1.0)*(d + 1.0);
  float A = x2 + k, B = 2.0*d*x2, C = x2*d*d - k;
  float c = (-B + sqrt(max(B*B - 4.0*A*C, 0.0)))/(2.0*A);
  float s = q.x*(d + c)/(d + 1.0);
  float S = (d + 1.0)/(d + c);
  return normalize(vec3(s, q.y/S, c));
}
vec3 rayDir(vec2 fc){
  vec2 ndc = (fc + uJit)/uRes*2.0 - 1.0;
  return normalize(uRot*paniniDir(ndc*uExt));
}

/* ---- sky ---- */
vec3 skyCol(vec3 rd, float disk){
  float y = rd.y;
  vec3 c = mix(uZen, uHor, exp(-max(y, 0.0)*uSkyK.x));
  if (y < 0.0) c = mix(uHor, mix(uHor, uFogC, 0.5), sat(-y*6.0));
  float mu = dot(rd, uSun), m = max(mu, 0.0);
  c += uSunC*(uSkyK.y*pow(m, 6.0) + uSkyK.z*pow(m, 60.0));
  c += disk*uSunC*45.0*smoothstep(uSkyK.w, uSkyK.w + 0.5*(1.0 - uSkyK.w), mu);
  return c;
}

/* ---- aerial perspective: exponential height fog, integrated along the ray ---- */
vec3 fogE(vec3 ro, vec3 rd, float t){
  float a = uFog.x, b = uFog.y;
  float k = b*rd.y;
  float f = a*exp(-b*(ro.y - uFog.z))*(abs(k) > 1e-5 ? (1.0 - exp(-k*t))/k : t);
  return 1.0 - exp(-f*vec3(0.85, 1.0, 1.25));
}
vec3 fogCol(vec3 rd){ return uFogC + uSunC*uFog.w*pow(sat(dot(rd, uSun)), 8.0); }
vec3 applyFog(vec3 col, vec3 ro, vec3 rd, float t){ return mix(col, fogCol(rd), fogE(ro, rd, t)); }
/* clouds over whatever is behind them, hazed by their own distance */
vec3 overClouds(vec3 col, vec4 c, float cdep, vec3 ro, vec3 rd){
  vec3 e = fogE(ro, rd, min(cdep, 6.0e4));
  return col*c.a + mix(c.rgb, fogCol(rd)*(1.0 - c.a), e);
}

/* ---- the cloud we fly through between places ---- */
vec3 transit(vec3 col, vec3 rd){
  if (uFade < 0.002) return col;
  vec3 v = transpose(uRot)*rd;
  vec2 sc = v.xy/max(v.z, 0.08);
  float acc = 0.0, tt = uGT*0.42;
  for (int i = 0; i < 4; i++){
    float fi = float(i);
    float ph = fract(fi*0.25 - tt);
    float z = mix(0.5, 7.0, ph);
    vec2 q = sc*z*1.3 + vec2(fi*17.3, fi*5.1);
    float n = 0.5 + 0.5*(0.62*noise(q) + 0.28*noise(q*2.3 + 3.1) + 0.1*noise(q*5.1));
    acc += sin(ph*PI)*smoothstep(0.3, 0.85, n);
  }
  acc *= 0.5;
  float a = sat(uFade*1.5 - 0.15 + (acc - 0.45)*0.9*(1.0 - uFade*uFade));
  vec3 cc = uFadeC*(0.86 + 0.22*acc + 0.1*v.y);
  return mix(col, cc, a);
}

/* ---- water ---- */
float fres(float c, float f0){ return f0 + (1.0 - f0)*pow(1.0 - sat(c), 5.0); }
vec3 waveN(vec2 p, float t, float dist, float amp, float sc){
  vec2 g = vec2(0.0);
  vec2 q = p*sc;
  float a = amp, fade = 1.0/(1.0 + dist*0.0025/sc);
  vec2 drift = vec2(0.6, 0.35);
  for (int i = 0; i < 6; i++){
    vec3 n = noised(q + drift*t*(0.35 + 0.22*float(i)));
    g += a*n.yz;
    q = M2*q*1.93; a *= 0.58; drift = M2*drift;
  }
  g *= fade;
  return normalize(vec3(-g.x, 1.0, -g.y));
}

/* ---- the open sea: wind waves from a spectrum, deep-water dispersion (long waves run faster), crests
   sharpened and troughs rounded, and a long swell under them. Waves too small for the pixel are dropped
   and kept only as roughness, so the sun's glitter widens with distance the way it does on a real sea.
   calm: 0 open ocean .. 1 sheltered lagoon. Returns slope (dh/dx, dh/dz), crest height 0..1, unresolved
   slope variance ---- */
vec4 ocean(vec2 p, float t, float dist, float calm){
  float foot = max(0.04, 2.5*dist*uPix);
  float lam = mix(46.0, 6.5, calm), steep = mix(0.1, 0.065, calm);
  /* waves come in groups: a slow patchiness over the field keeps it from reading as a woven pattern */
  float grp = 0.65 + 0.35*noise(p*0.0065 + vec2(t*0.01, 3.0)) + 0.2*noise(p*0.021 + 7.0);
  vec2 g = vec2(0.0); float h = 0.0, hs = 0.0, var = 0.0;
  int nw = uQ == 0 ? 11 : uQ == 1 ? 16 : 22;
  for (int i = 0; i < 22; i++){
    if (i >= nw) break;
    float fi = float(i);
    float r1 = fract(sin(fi*91.73 + 3.1)*43758.55), r2 = fract(sin(fi*12.97 + 7.7)*24634.63), r3 = fract(sin(fi*45.11 + 1.9)*36457.25);
    float l = lam*pow(0.82, fi)*(0.9 + 0.2*r3);
    /* the rest are all shorter and smaller than this pixel: they only roughen it */
    if (foot/l > 0.7){ var += 0.1*steep*steep*float(nw - i)*0.9; break; }
    float k = 6.2831853/l, w = sqrt(9.81*k);
    float th = 0.62 + (r1 - 0.5)*(0.9 + 2.0*fi/22.0);
    vec2 d = vec2(cos(th), sin(th));
    float a = steep/k*(0.55 + 0.9*r2)*(i > 2 && i < 14 ? grp : 1.0);
    float ph = k*dot(d, p) - w*t + r3*6.2831853;
    float e = exp(sin(ph) - 1.0);
    float att = 1.0 - smoothstep(0.25, 0.6, foot/l);
    h += a*e*att; hs += a*att;
    g += a*k*e*cos(ph)*d*att;
    var += 0.1*(a*k)*(a*k)*(1.0 - att*att);
  }
  float sw = 1.0 - calm;
  for (int i = 0; i < 2; i++){
    float l = i == 0 ? 130.0 : 95.0, k = 6.2831853/l, w = sqrt(9.81*k), a = 0.035/k*sw;
    vec2 d = i == 0 ? vec2(0.92, -0.39) : vec2(0.8, -0.6);
    float ph = k*dot(d, p) - w*t + float(i)*1.3;
    g += a*k*cos(ph)*d*(1.0 - smoothstep(0.25, 0.6, foot/l));
  }
  return vec4(g, h/max(hs, 1e-4), var);
}

/* ---- tone helpers shared by scenes ---- */
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

/* ---- heightfield march: scenes provide mapH() ---- */
float mapH(vec2 xz, float lod);
float LAMBDA0 = 2600.0;   // largest feature scale of the scene, for LOD
float OMAX = 11.0;

float marchH(vec3 ro, vec3 rd, float tmin, float tmax, int maxSteps, float lodBias){
  float t = tmin;
  if (ro.y > uHB.y){
    if (rd.y >= 0.0) return -1.0;
    t = max(t, (ro.y - uHB.y)/(-rd.y));
  }
  float lt = t, lh = 0.0;
  for (int i = 0; i < 600; i++){
    if (i >= maxSteps || t > tmax) break;
    vec3 p = ro + rd*t;
    if (p.y > uHB.y && rd.y > 0.0) break;
    float h = p.y - mapH(p.xz, lodAt(t, LAMBDA0, OMAX) - lodBias);
    if (h < 0.0015*t){
      if (i == 0) return t;
      /* halve the bracket, then finish on the straight line between its ends: the hit then slides
         smoothly with the camera instead of snapping between march samples (which made walls crawl) */
      float a = lt, b = t, ha = lh - 0.0015*lt, hb = h - 0.0015*t;
      for (int j = 0; j < 8; j++){
        float m = 0.5*(a + b);
        vec3 q = ro + rd*m;
        float hm = q.y - mapH(q.xz, lodAt(m, LAMBDA0, OMAX) - lodBias) - 0.0015*m;
        if (hm < 0.0){ b = m; hb = hm; } else { a = m; ha = hm; }
      }
      return a + (b - a)*clamp(ha/max(ha - hb, 1e-6), 0.0, 1.0);
    }
    lt = t; lh = h;
    t += max(min(h*uStepK, uStepMax.x + uStepMax.y*t), 0.25 + 0.0012*t);
  }
  return -1.0;
}
vec3 normalH(vec2 xz, float t){
  float e = max(0.2, 0.9*t*uPix);
  float l = lodAt(t, LAMBDA0, OMAX) + 0.5;
  vec2 dx = vec2(e, 0.0);
  return normalize(vec3(mapH(xz - dx.xy, l) - mapH(xz + dx.xy, l), 2.0*e, mapH(xz - dx.yx, l) - mapH(xz + dx.yx, l)));
}
float shadowH(vec3 p, float k){
  float res = 1.0, t = 1.5;
  for (int i = 0; i < 40; i++){
    vec3 q = p + uSun*t;
    if (q.y > uHB.y) break;
    float h = q.y - mapH(q.xz, 6.0);
    res = min(res, k*h/t);
    if (res < 0.0) break;
    t += clamp(h*0.5, 1.0 + 0.03*t, 400.0);
  }
  res = sat(res);
  return res*res*(3.0 - 2.0*res);
}
vec4 feat(vec2 xz){
  vec2 uv = (xz - uFeatBox.xy)*uFeatBox.zw;
  if (uv.x <= 0.0 || uv.y <= 0.0 || uv.x >= 1.0 || uv.y >= 1.0) return vec4(1e4, 0.0, 1e4, 0.0);
  return textureLod(uFeat, uv, 0.0);
}
vec4 profA(float s){ return textureLod(uProf, vec2(s/uProfK.x, 0.25), 0.0); }
vec4 profB(float s){ return textureLod(uProf, vec2(s/uProfK.x, 0.75), 0.0); }
/* the corridor carved along the camera path. hNat - mean is the natural relief kept on its walls.
   returns the blend weight; hc = corridor height, f = feature sample, pb = profile row 1 */
float corridor(vec2 xz, float hNat, float mean, out float hc, out vec4 f, out vec4 pb){
  f = feat(xz);
  hc = hNat; pb = vec4(0.0);
  if (f.a <= 0.0) return 0.0;
  vec4 pa = profA(f.g);
  pb = profB(f.g);
  float d = f.b + 0.18*pa.y*noise(xz*0.0042) + 0.08*pa.y*noise(xz*0.017);
  float side = f.r > 0.0 ? pb.x : pb.y;
  float fl = pa.x + uProfK.y;
  float s = smoothstep(pa.y*0.6, pa.z, d);
  /* walls never cut into higher ground; the floor itself is exact (cut or filled).
     A negative rise turns the corridor into a ridge: the crest is the floor, the flanks fall away. */
  float prof = pa.w > 0.0 ? s*s : pow(sat((d - pa.y*0.5)/(pa.z - pa.y*0.5)), 0.85);
  float wall = fl + pa.w*side*prof + (hNat - mean)*(pb.z + (0.95 - pb.z)*s);
  hc = max(hNat, wall);
  hc = mix(hc, fl + (hNat - mean)*pb.z, 1.0 - smoothstep(pa.y*0.55, pa.y*1.25, d));
  return f.a*(1.0 - smoothstep(pa.z, pa.z*1.45, d));
}</script>

<!-- the main() of a scene program -->
<script type="x-glsl" id="g-main">
vec4 shade(vec3 ro, vec3 rd, vec2 fc);
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec3 ro = uCam, rd = rayDir(fc);
  if (uDbg == 1){
    vec2 uv = fc/uRes;
    ro = vec3(mix(uDbgBox.x, uDbgBox.z, uv.x), uHB.y + 50.0, mix(uDbgBox.y, uDbgBox.w, uv.y));
    rd = normalize(vec3(0.0001, -1.0, 0.0002));
  }
#ifdef HAS_CLOUDS
  if (uDbg == 3){
    /* cloud density along the view ray: red = at 20 m, green = at 100 m, blue = at 400 m */
    oCol = vec4(cloudD(ro + rd*20.0, true), cloudD(ro + rd*100.0, true), cloudD(ro + rd*400.0, true), 1.0);
    return;
  }
#endif
  if (uDbg == 2){
    vec2 uv = fc/uRes;
    vec2 xz = vec2(mix(uDbgBox.x, uDbgBox.z, uv.x), mix(uDbgBox.y, uDbgBox.w, uv.y));
    vec4 f = feat(xz);
    oCol = vec4(fract(abs(f.r)/100.0)*0.6 + step(f.r, 0.0)*0.4, fract(f.g/250.0), fract(f.b/100.0)*f.a, 1.0);
    return;
  }
  vec4 r = shade(ro, rd, fc);
  vec3 col = (uDbg == 1) ? r.rgb : transit(r.rgb, rd);
  if (uDbg == 1){
    vec4 f = feat(ro.xz);
    if (uDbgBox.z - uDbgBox.x > 1000.0) col = mix(col, vec3(1.0, 0.1, 0.05), (1.0 - smoothstep(4.0, 9.0, f.b))*step(f.r, 9e3));
    float ht = mapH(ro.xz, 6.0);
    float ci = uDbgBox.z - uDbgBox.x > 1000.0 ? 100.0 : 5.0;
    col *= 0.85 + 0.15*smoothstep(0.0, 0.08, abs(fract(ht/ci) - 0.5));
  }
  oCol = vec4(max(col, vec3(0.0)), min(r.a, SKYT));
}
</script>
