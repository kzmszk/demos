<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VENEZIA — Film</title>
<meta name="description" content="VENEZIA, a 68-second film of the web app: the Piazza, St Mark's, Caffè Florian, La Fenice, calli, bridges, canals, a gondola at night.">
<style>
  :root { --ink: #f6f1e7; --dim: rgba(246, 241, 231, .62); --line: rgba(246, 241, 231, .28);
    --sans: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  html, body { margin: 0; min-height: 100%; background: #0d0f12; color: var(--ink); font-family: var(--sans); }
  main { max-width: 1600px; margin: 0 auto; padding: clamp(16px, 3vw, 40px) 16px 40px; box-sizing: border-box; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: clamp(12px, 2vw, 24px); }
  .word { font-weight: 700; font-size: clamp(40px, 8vw, 112px); letter-spacing: -.055em; line-height: .8; margin-left: -.04em; }
  .top a, .meta a { color: var(--dim); text-decoration: none; font-size: 12px; letter-spacing: .14em; }
  .top a:hover, .meta a:hover { color: var(--ink); }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px 24px; margin-top: 14px; font-size: 13px; letter-spacing: .06em; color: var(--dim); }
  .meta .open { color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 2px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="top"><span class="word">VENEZIA</span><a class="back" href="../">← GALLERY</a></div>
  <!-- the site's media route first: it answers byte ranges (Safari plays nothing without them, and seeking needs them);
       the copy among the static files (which answer every range with the whole file) is the fallback, and what a local server has -->
  <video poster="movie/poster.jpg" controls playsinline preload="metadata">
    <source src="/media/movies/venezia-film/video.mp4" type="video/mp4">
    <source src="movie/venezia.mp4" type="video/mp4">
  </video>
  <div class="meta"><span class="cap"></span><a class="open" href="index.html"></a></div>
</main>
<script>
  // JA unless the browser (or #en) says otherwise, as the app itself
  (function () {
    var h = location.hash, en = (h === '#en' || (navigator.language || '').slice(0, 2) !== 'ja') && h !== '#ja';
    document.documentElement.lang = en ? 'en' : 'ja';
    document.querySelector('.cap').textContent = en ? 'A film of the web app · 68 s · its own music and sounds' : '紹介動画 · 68秒 · 音楽と音はアプリのもの';
    document.querySelector('.open').textContent = en ? 'Open the app ↗' : 'アプリを開く ↗';
    document.querySelector('.open').href = 'index.html' + (en ? '#en' : '#ja');
  })();
</script>
</body>
</html>
