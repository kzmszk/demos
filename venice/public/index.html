<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VENEZIA</title>
<style>
  :root { --ink: #f6f1e7; --dim: rgba(246, 241, 231, .62); --line: rgba(246, 241, 231, .28); --glass: rgba(14, 16, 20, .46);
    --sans: "Helvetica Neue", "Helvetica", "Arial", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #load { position: fixed; left: 24px; bottom: 20px; color: var(--dim); font: 12px/1.4 var(--sans); letter-spacing: .04em; z-index: 5; }
  .nogpu { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 max(16px, 8vw); color: var(--ink); font: 15px/1.7 var(--sans); z-index: 6; }
  .nogpu b { font-size: clamp(48px, 14vw, 180px); line-height: .9; letter-spacing: -.02em; margin-bottom: 28px; font-weight: 700; }
  .nogpu p { margin: 0 0 6px; max-width: 46em; color: var(--dim); } .nogpu p:first-of-type { color: var(--ink); font-size: 18px; }
  .ui { position: fixed; inset: 0; pointer-events: none; color: var(--ink); font-family: var(--sans); z-index: 4; }
  .ui button, .ui select, .ui a { pointer-events: auto; font: inherit; color: inherit; }
  /* title: the city itself is the artwork; huge cropped wordmark, small restrained text */
  .title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 4vw 6vh;
    background: linear-gradient(180deg, rgba(8, 10, 14, 0) 35%, rgba(8, 10, 14, .55) 100%); transition: opacity 1.1s ease; }
  .title.gone { opacity: 0; }
  .title .word { font-weight: 700; font-size: min(23vw, 40vh); line-height: .78; letter-spacing: -.055em; margin-left: -.06em;
    color: rgba(246, 241, 231, .92); mix-blend-mode: soft-light; user-select: none; }
  .title .sub { font-size: 15px; letter-spacing: .08em; color: var(--dim); margin: 2.2vh 0 3.2vh .2vw; }
  .title .starts { display: flex; gap: 10px; flex-wrap: wrap; }
  .title .start { pointer-events: auto; background: none; border: 1px solid var(--line); color: var(--ink); padding: 12px 22px; font-size: 14px; letter-spacing: .1em;
    cursor: pointer; transition: background .25s, border-color .25s; }
  .title .start:hover { background: rgba(246, 241, 231, .12); border-color: var(--ink); }
  .title .lang { position: absolute; top: 22px; right: 4vw; display: flex; gap: 2px; }
  .title .lang button, .bar button, .bar select, .bar a { background: none; border: 0; padding: 6px 10px; font-size: 12px; letter-spacing: .1em; color: var(--dim); cursor: pointer; text-decoration: none; }
  .title .lang button.on, .bar button.on { color: var(--ink); }
  /* bar: one thin strip */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid rgba(246, 241, 231, .12); transition: opacity .6s; }
  .bar.hidden { opacity: 0; pointer-events: none; }
  .bar .grp { display: flex; align-items: center; gap: 2px; }
  .bar .right { margin-left: auto; }
  .bar .modes button { font-size: 13px; color: var(--dim); }
  .bar .modes button.on { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
  .bar select { appearance: none; -webkit-appearance: none; background: none; color: var(--ink); max-width: 46vw; }
  .bar select option { color: #111; }
  .bar .speeds button { padding: 6px 6px; }
  .bar .br { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; letter-spacing: .1em; color: var(--dim); pointer-events: auto; }
  .bar .br input { -webkit-appearance: none; appearance: none; width: 88px; height: 18px; background: none; cursor: pointer; }
  .bar .br input::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .bar .br input::-moz-range-track { height: 1px; background: var(--line); }
  .bar .br input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); margin-top: -5px; }
  .bar .br input::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }
  .label { position: absolute; left: 18px; top: 16px; font-size: 12px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .help { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); font-size: 12px; letter-spacing: .08em; color: var(--dim); white-space: nowrap; opacity: 0; }
  .help.fade { animation: hl 7s ease forwards; }
  @keyframes hl { 0% { opacity: 0 } 8% { opacity: 1 } 75% { opacity: 1 } 100% { opacity: 0 } }
  .stick { position: absolute; bottom: 70px; left: 24px; width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--line); display: none; pointer-events: auto; touch-action: none; }
  .stick i { position: absolute; left: 39px; top: 39px; width: 32px; height: 32px; border-radius: 50%; background: rgba(246, 241, 231, .4); }
  @media (pointer: coarse) { .stick { display: block; } }
  @media (max-width: 640px) { .bar { flex-wrap: wrap; } .help { white-space: normal; text-align: center; width: 90vw; } .title .start { padding: 10px 14px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">読み込み中</div>
<script type="module" src="app.js"></script>
</body>
</html>
