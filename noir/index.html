<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>硝子のアリバイ — 一九四七年、港町の雨とトーチソング</title>
<meta name="description" content="白黒の銀幕で遊ぶ、短いフィルム・ノワールの探偵物語。一九四七年の架空の港町ポート・キャロウェイ。歌手ノーラ・ヴェイルのアリバイは、口紅のついたグラスひとつ。全五景、結末は三つ。">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
:root{
  --mincho: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", "BIZ UDPMincho", serif;
  --type: "Courier New", Courier, "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", "BIZ UDPMincho", monospace;
  --bone: #e9e6df;
  --ash: #8f8c86;
  --dim: #5c5a56;
  --paper: #efebe2;
  --paper-2: #dad3c4;
  --manila: #cfc19c;
  --manila-2: #b9a87c;
  --ink: #1c1b19;
  --red: #b3001b;
  --bar: clamp(40px, 5.6vh, 54px);
  --edge: clamp(16px, 2.5vh, 22px);
  --gut: clamp(16px, 4.8vw, 92px);
  --fs: clamp(15px, calc(.55vw + .95vh), 21px);
  --band: min(64%, 56vw);
  --mw: min(calc(100vw - 2 * var(--gut)), 1180px, 132vh);
  --mratio: .25;
  --mdrop: .3;
  color-scheme: dark;
}
*, *::before, *::after{ box-sizing: border-box; }
html, body{ margin: 0; height: 100%; overflow: hidden; background: #000; }
body{
  font-family: var(--mincho); color: var(--bone);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; font-kerning: normal;
}
button{ font: inherit; color: inherit; }
kbd{ font-family: var(--type); }
.sr{ position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.defs{ position: absolute; width: 0; height: 0; overflow: hidden; }
.mn{ font-family: var(--mincho); }
.ty{ font-family: var(--type); }
:focus{ outline: none; }
:focus-visible{ outline: 2px solid #f4f2ec; outline-offset: 3px; }

/* ---------- the film: letterbox bar, frame, edge ---------- */
.film{
  position: fixed; inset: 0; height: 100vh; height: 100dvh;
  display: grid; grid-template-rows: var(--bar) minmax(0, 1fr) var(--edge);
  background: #000;
}
.bar{
  position: relative; z-index: 8; display: flex; align-items: center; gap: clamp(10px, 2.2vw, 30px);
  padding: 0 max(var(--gut), env(safe-area-inset-right)) 0 max(var(--gut), env(safe-area-inset-left));
}
.brand{ display: block; height: 17px; width: auto; flex: none; fill: var(--bone); overflow: visible; }
.where{
  margin: 0; display: flex; gap: 1.1em; align-items: baseline; white-space: nowrap; min-width: 0;
  font-size: 12px; letter-spacing: .24em; color: var(--ash); opacity: 0; transition: opacity .8s;
}
.where.on{ opacity: 1; }
.where b{ font-weight: 400; color: #c9c6bf; }
.tools{ margin-left: auto; display: flex; align-items: center; gap: clamp(0px, 1vw, 14px); }
.tool{
  position: relative; display: inline-flex; align-items: center; gap: .55em;
  appearance: none; background: none; border: 0; border-radius: 2px; cursor: pointer;
  padding: 9px 8px; font-size: 13px; letter-spacing: .16em; color: #b8b5ad; white-space: nowrap;
  transition: color .25s;
}
.tool::after{
  content: ""; position: absolute; left: 8px; right: 8px; bottom: 5px; height: 1px; background: currentColor;
  transform: scaleX(0); transform-origin: left center; transition: transform .35s cubic-bezier(.2, .7, .2, 1);
}
.tool:hover{ color: #fff; }
.tool:hover::after{ transform: scaleX(1); }
.tool kbd{ font-size: 10px; line-height: 1; letter-spacing: 0; color: #6d6b66; border: 1px solid #2d2c2a; border-radius: 2px; padding: 2px 4px 1px; }
.count{
  position: relative; display: inline-grid; place-items: center; min-width: 1.75em; height: 1.75em; padding: 0 .3em;
  font: 11px/1 var(--type); letter-spacing: 0; color: #e6e3dc; border: 1px solid #4a4845; border-radius: 50%;
}
.count::after{ content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid #e6e3dc; opacity: 0; }
.stamped .count{ animation: stampCount .7s cubic-bezier(.2, 1.5, .4, 1); }
.stamped .count::after{ animation: inkRing .8s ease-out; }
@keyframes stampCount{ 0%{ transform: scale(2.3) rotate(-14deg); opacity: 0; } 55%{ transform: scale(.88) rotate(2deg); opacity: 1; } 100%{ transform: none; } }
@keyframes inkRing{ 0%{ opacity: .9; transform: scale(.6); } 100%{ opacity: 0; transform: scale(2.4); } }
.eq{ display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; }
.eq i{ width: 2px; height: 3px; background: currentColor; opacity: .55; }
.snd-on .eq i{ animation: eq .9s ease-in-out infinite alternate; opacity: .9; }
.snd-on .eq i:nth-child(2){ animation-delay: -.3s; }
.snd-on .eq i:nth-child(3){ animation-delay: -.6s; }
@keyframes eq{ from{ height: 2px; } to{ height: 10px; } }
.snd{ font-family: var(--type); color: #e9e6df; }
#bRestart.confirm{ color: #fff; }
.tool[aria-disabled="true"]{ opacity: .32; cursor: default; }
.tool[aria-disabled="true"]:hover{ color: #b8b5ad; }
.tool[aria-disabled="true"]:hover::after{ transform: scaleX(0); }

.frame{ position: relative; min-height: 0; overflow: hidden; background: #000; }
.reel{
  position: absolute; inset: 0; display: grid;
  grid-template-rows: var(--band) minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  will-change: transform;
}
.reel.shut{ visibility: hidden; }

/* ---------- the picture ---------- */
.screen{ grid-area: 1 / 1; position: relative; overflow: hidden; background: #050505; isolation: isolate; }
.screen > svg, .screen > canvas{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.screen > .depth{ will-change: transform; }
.sc{ display: none; }
[data-scene="office"] #s-office, [data-scene="office"] #f-office,
[data-scene="alley"] #s-alley, [data-scene="alley"] #f-alley,
[data-scene="club"] #s-club, [data-scene="club"] #f-club,
[data-scene="dressing"] #s-dressing, [data-scene="dressing"] #f-dressing,
[data-scene="pier"] #s-pier, [data-scene="pier"] #f-pier{ display: inline; }

.nora-door, .nora-room{ transition: opacity 1.4s ease; }
[data-nora="door"] .nora-room, [data-nora="room"] .nora-door,
[data-nora="gone"] .nora-door, [data-nora="gone"] .nora-room{ opacity: 0; }
.clue-lip, .clue-ferry{ transition: opacity 1.2s ease; }
.has-lipstick .clue-lip, .has-ferry .clue-ferry{ opacity: 0; }
.club-glass{ opacity: 0; transition: opacity 1.4s ease; }
.has-rim .club-glass{ opacity: 1; }
.pier-nora, .ferry, .pier-lamp, .gulls, .dawn-wash{ transition: opacity 2.4s ease, transform 18s linear; }
.gulls, .dawn-wash{ opacity: 0; }
[data-pier="leaving"] .pier-nora{ opacity: 0; }
[data-pier="leaving"] .ferry{ transform: translateX(240px); opacity: .15; }
[data-pier="dawn"] .pier-nora, [data-pier="dawn"] .ferry, [data-pier="dawn"] .pier-lamp{ opacity: 0; transition-duration: 0s; }
[data-pier="dawn"] .gulls{ opacity: 1; }
[data-pier="dawn"] .dawn-wash{ opacity: 1; transition-duration: 0s; }

.swing{ transform-box: view-box; transform-origin: 620px 145px; animation: swing 3.3s ease-in-out infinite alternate; }
.bulb-reflect{ transform-box: view-box; transform-origin: 620px 780px; animation: reflect 3.3s ease-in-out infinite alternate; }
@keyframes swing{ from{ transform: rotate(-5deg); } to{ transform: rotate(5deg); } }
@keyframes reflect{ from{ transform: translateX(10px); } to{ transform: translateX(-10px); } }
.steam path{ transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: steam 5.2s ease-in-out infinite; }
.steam .s2{ animation-delay: -1.7s; }
.steam .s3{ animation-delay: -3.4s; }
@keyframes steam{
  0%{ opacity: 0; transform: translateY(16px) scale(.9, .7); }
  25%{ opacity: .55; }
  70%{ opacity: .2; }
  100%{ opacity: 0; transform: translateY(-50px) scale(1.3, 1.2) skewX(10deg); }
}
.neon{ animation: neon 7.3s steps(1, end) infinite; }
@keyframes neon{ 0%, 60%, 63.5%, 66%, 100%{ opacity: .95; } 61%, 64.5%{ opacity: .3; } }
.lip-glow{ animation: glint 2.8s ease-in-out infinite; }
@keyframes glint{ 0%, 100%{ opacity: .25; } 50%{ opacity: .7; } }
.shimmer{ transform-box: fill-box; transform-origin: 50% 0; animation: shimmer 2.6s ease-in-out infinite alternate; }
@keyframes shimmer{ from{ transform: scaleX(.75) skewX(-4deg); } to{ transform: scaleX(1.2) skewX(4deg); } }
.sparkle{ animation: twinkle 3.1s ease-in-out infinite; }
@keyframes twinkle{ 0%, 100%{ opacity: .15; } 50%{ opacity: .85; } }

/* light through the blinds, headlights, lightning, vignette */
.blinds, .sweep, .flash, .vig{ position: absolute; pointer-events: none; }
.blinds{ inset: 0; opacity: 0; transition: opacity 1.2s; mix-blend-mode: screen; }
.blinds::before{
  content: ""; position: absolute; left: 4%; top: -6%; width: 64%; height: 84%;
  background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .11) 0 1.7%, transparent 1.7% 3.6%);
  transform: skewY(-11deg);
  -webkit-mask-image: radial-gradient(70% 62% at 58% 46%, #000 30%, transparent 78%);
  mask-image: radial-gradient(70% 62% at 58% 46%, #000 30%, transparent 78%);
}
[data-scene="office"] .blinds{ opacity: 1; }
.sweep{
  top: -12%; bottom: -12%; left: 0; width: 64%; opacity: 0; mix-blend-mode: screen;
  background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .15) 0 1.5%, transparent 1.5% 3.3%);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 32%, #000 68%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 32%, #000 68%, transparent);
  transform: translateX(-120%) skewX(-18deg);
}
.flash{ inset: 0; background: #d9d9d9; opacity: 0; mix-blend-mode: screen; }
.vig{
  inset: 0;
  background:
    radial-gradient(118% 92% at 50% 44%, transparent 48%, rgba(0, 0, 0, .5) 78%, rgba(0, 0, 0, .94) 100%),
    linear-gradient(to bottom, rgba(0, 0, 0, .35), transparent 16%, transparent 84%, rgba(0, 0, 0, .55));
}

/* ---------- the story: narration and index cards ---------- */
.story{
  grid-area: 2 / 1; position: relative; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); grid-auto-rows: max-content; align-content: start;
  gap: clamp(18px, 4.2vw, 76px); align-items: start;
  padding: clamp(16px, 3.3vh, 38px) var(--gut) clamp(14px, 2.6vh, 28px);
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: #2e2e2e transparent;
  transition: opacity .6s, visibility .6s;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 clamp(14px, 3vh, 30px));
  mask-image: linear-gradient(to bottom, transparent 0, #000 clamp(14px, 3vh, 30px));
}
.is-title .story{ opacity: 0; visibility: hidden; }
.narr{
  min-height: 2em; max-width: 35em; cursor: default;
  font-size: var(--fs); line-height: 1.95; letter-spacing: .045em;
}
.ln{ margin: 0 0 .4em; color: #b6b3ab; line-break: strict; text-wrap: pretty; transition: opacity .6s ease; }
.ln.past{ opacity: .5; }
.ln.q{ color: #f2efe8; }
.ln .rest{ visibility: hidden; }
.ln.typing .typed::after{
  content: ""; display: inline-block; width: .09em; height: 1.05em; margin-right: -.09em; vertical-align: -.17em;
  background: #f2efe8; animation: caret .75s steps(1, end) infinite;
}
@keyframes caret{ 50%{ opacity: 0; } }
.narr.fade .ln{ opacity: 0; }

.cards{
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.5vw, 18px) clamp(10px, 1.4vw, 18px);
  align-content: start; padding: .35em 0 .5em;
  position: sticky; top: 0;
}
.card{
  --tilt: 0deg;
  position: relative; display: flex; flex-direction: column; gap: .3em; min-height: 5.5em; margin: 0;
  padding: .62em 1em .95em; text-align: left; cursor: pointer; appearance: none; border: 0; border-radius: 2px;
  font-family: var(--type); font-size: clamp(13.5px, calc(.42vw + .78vh), 16.5px); line-height: 1.52; letter-spacing: .08em; color: #1d1c1a;
  background:
    linear-gradient(to bottom, transparent 1.95em, rgba(28, 28, 28, .55) 1.95em, rgba(28, 28, 28, .55) calc(1.95em + 1px), transparent calc(1.95em + 1px), transparent calc(1.95em + 3px), rgba(28, 28, 28, .3) calc(1.95em + 3px), rgba(28, 28, 28, .3) calc(1.95em + 4px), transparent calc(1.95em + 4px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.52em - 1px), rgba(40, 40, 40, .12) calc(1.52em - 1px), rgba(40, 40, 40, .12) 1.52em) 0 calc(1.95em + 4px) / 100% 100% no-repeat,
    radial-gradient(130% 110% at 28% 12%, #f4f1e9 0%, #e6e0d3 55%, #d4ccbb 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 16px 26px -14px rgba(0, 0, 0, .95), 0 2px 6px rgba(0, 0, 0, .55);
  transform: rotate(var(--tilt));
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, filter .3s;
  touch-action: manipulation;
}
.card:hover{ transform: rotate(calc(var(--tilt) * .25)) translateY(-5px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 26px 34px -16px rgba(0, 0, 0, .95), 0 3px 8px rgba(0, 0, 0, .5); }
.card:active{ transform: rotate(0deg) translateY(-1px) scale(.985); transition-duration: .08s; }
.card:focus-visible{ outline: 2px solid #f4f2ec; outline-offset: 5px; }
.card-no{ display: flex; justify-content: space-between; align-items: center; font-size: .7em; letter-spacing: .22em; color: #5a5750; }
.card-no kbd{ font-size: 1em; letter-spacing: 0; border: 1px solid rgba(40, 40, 40, .35); border-radius: 2px; padding: 0 .35em; color: #4a4843; }
.card-t{ position: relative; padding-top: .28em; }
.ch{ opacity: var(--o, 1); position: relative; top: var(--y, 0); }
.card.locked{ cursor: not-allowed; color: #6f6b63; filter: saturate(.6) brightness(.93); }
.card.locked:hover{ transform: rotate(var(--tilt)); }
.card.locked .card-t::after{
  content: ""; position: absolute; left: -.15em; right: -.15em; top: calc(50% + .14em); height: 2px;
  background: #27261f; transform: rotate(-1.4deg); opacity: .85;
}
.card-hint{ font-family: var(--mincho); font-size: .78em; letter-spacing: .03em; line-height: 1.55; color: #3e3b35; }
.card.shake{ animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake{ 20%{ transform: rotate(var(--tilt)) translateX(-5px); } 40%{ transform: rotate(var(--tilt)) translateX(5px); } 60%{ transform: rotate(var(--tilt)) translateX(-3px); } 80%{ transform: rotate(var(--tilt)) translateX(2px); } }

/* ---------- title card ---------- */
.titlecard{
  grid-area: 1 / 1 / 3 / 2; position: relative; z-index: 3; display: grid; grid-template-rows: inherit; min-height: 0;
  transition: opacity .9s ease, visibility .9s;
}
.reel:not(.is-title) .titlecard{ opacity: 0; visibility: hidden; pointer-events: none; }
.t-top{ grid-row: 1; align-self: end; padding: 0 var(--gut); display: flex; flex-direction: column; align-items: center; min-width: 0; }
.t-over{
  width: var(--mw); display: flex; justify-content: space-between; align-items: baseline; gap: 1em;
  margin: 0 0 clamp(6px, 1.4vh, 14px); padding-bottom: .7em; border-bottom: 1px solid rgba(233, 230, 223, .38);
  font-size: clamp(10px, 1.3vh, 13px); letter-spacing: .34em; color: #d4d1c9; text-shadow: 0 1px 8px #000;
}
.t-over .en{ font-family: var(--type); letter-spacing: .5em; font-size: .92em; }
.tmark{ display: block; width: var(--mw); height: auto; overflow: visible; margin-bottom: calc(var(--mw) * var(--mratio) * var(--mdrop) * -1); }
.tmark.tall{ display: none; }
.t-bottom{
  grid-row: 2; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  padding: calc(var(--mw) * var(--mratio) * var(--mdrop) + clamp(14px, 2.6vh, 30px)) var(--gut) clamp(12px, 2vh, 22px);
  display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); grid-auto-rows: max-content; align-content: start;
  gap: clamp(18px, 4.2vw, 76px); align-items: start;
}
.t-bottom::-webkit-scrollbar{ display: none; }
.t-tag{ margin: 0 0 .8em; font-size: clamp(16px, calc(.6vw + 1vh), 23px); line-height: 1.7; letter-spacing: .14em; color: #f0ede6; }
.t-bill{ margin: 0 0 1.4em; font-size: 12px; letter-spacing: .26em; line-height: 2; color: var(--ash); }
.t-bill span{ display: inline-block; margin-left: 1.4em; }
.t-rec{ display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 0; padding: 0; list-style: none; }
.t-rec-l{ font-size: 11px; letter-spacing: .3em; color: var(--dim); margin-right: 4px; }
.rec{
  display: inline-grid; justify-items: center; gap: 1px; padding: 5px 10px 4px; border: 1px solid #3a3936; outline: 1px solid #1e1d1b; outline-offset: 2px;
  font-size: 11px; letter-spacing: .18em; color: #57554f; transform: rotate(var(--r, -2deg));
}
.rec b{ font-weight: 600; }
.rec i{ font-style: normal; font-size: 9.5px; letter-spacing: .12em; }
.rec.seen{ color: #d8d5cd; border-color: #aaa69d; outline-color: #55534e; }
.t-cards{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-content: start; }
.t-cards .t-help{ grid-column: 1 / -1; }
.t-help{ margin: .2em 0 0; font-size: 11px; letter-spacing: .14em; color: var(--dim); line-height: 1.9; }

/* ---------- overlays: grain, flicker, intertitles, verdict ---------- */
.grain, .flick{ position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }
.grain{ display: block; }
.flick{ background: #000; opacity: .03; }
.inter{
  position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; padding: 16px;
  background: #000; opacity: 0; visibility: hidden; cursor: pointer; transition: opacity .45s ease, visibility .45s;
}
.inter.on{ opacity: 1; visibility: visible; }
.inter-card{
  position: relative; writing-mode: vertical-rl; text-align: center;
  padding: clamp(26px, 4.6vh, 50px) clamp(24px, 4vw, 54px);
  border: 1px solid rgba(233, 230, 223, .62); outline: 1px solid rgba(233, 230, 223, .24); outline-offset: 8px;
  color: var(--bone);
}
.inter-card::before, .inter-card::after{
  content: ""; position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; background: var(--bone); transform: rotate(45deg);
}
.inter-card::before{ top: -13px; }
.inter-card::after{ bottom: -13px; }
.inter-no{ text-align: start; margin: 0 0 0 1.3em; font-size: clamp(13px, 1.9vh, 17px); letter-spacing: .55em; color: #c4c1b9; }
.inter-title{ margin: 0 0 0 .9em; font-size: clamp(26px, min(5.4vh, 9vw), 56px); line-height: 1.25; letter-spacing: .32em; font-weight: 500; }
.inter-time{ text-align: end; margin: 0; font-size: clamp(12px, 1.6vh, 15px); letter-spacing: .42em; color: #8e8b84; }

.verdict{
  position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 18px;
  background: radial-gradient(80% 80% at 50% 50%, rgba(0, 0, 0, .45), rgba(0, 0, 0, .85));
  opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility .8s;
}
.verdict.on{ opacity: 1; visibility: visible; }
.vcard{
  position: relative; width: min(600px, 100%); max-height: 100%; overflow: auto; scrollbar-width: none;
  padding: clamp(20px, 3.4vh, 34px) clamp(20px, 3.6vw, 40px) clamp(18px, 3vh, 28px);
  font-family: var(--type); color: var(--ink);
  background:
    repeating-linear-gradient(to bottom, transparent 0 27px, rgba(60, 50, 30, .1) 27px 28px) 0 118px / 100% 100% no-repeat,
    radial-gradient(130% 100% at 30% 10%, #efe9da, #ddd4bf 70%, #cfc4aa);
  box-shadow: 0 40px 70px -20px #000, 0 4px 14px rgba(0, 0, 0, .6);
  transform: rotate(-1.2deg);
}
.vcard.torn{
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 1.6% 96%, 0 92%, 1.8% 88%, .4% 84%, 2% 79%, .2% 75%, 1.5% 70%, 0 66%, 1.9% 61%, .6% 57%, 2.1% 52%, .3% 48%, 1.6% 43%, 0 39%, 1.8% 34%, .5% 30%, 2% 25%, .2% 21%, 1.4% 16%, 0 12%, 1.7% 7%, .4% 3%);
  padding-left: clamp(30px, 5vw, 52px);
}
.v-head{ display: flex; justify-content: space-between; gap: 1em; margin: 0 0 1.3em; font-size: 11px; letter-spacing: .22em; color: #5b5445; border-bottom: 1px solid rgba(40, 32, 20, .5); padding-bottom: .8em; }
.v-kicker{ margin: 0; font-size: 12px; letter-spacing: .5em; color: #5b5445; }
.v-title{ margin: .1em 0 .2em; font-family: var(--mincho); font-weight: 600; font-size: clamp(30px, min(7.4vh, 11vw), 66px); line-height: 1.15; letter-spacing: .06em; }
.v-title span{ display: inline-block; white-space: nowrap; transform: scaleX(.8); transform-origin: 0 50%; }
.v-note{ margin: 0 0 1.4em; font-size: 13px; letter-spacing: .1em; line-height: 1.8; }
.v-stats{ display: grid; grid-template-columns: auto 1fr; gap: .45em 1.4em; margin: 0 0 1.6em; font-size: 12.5px; letter-spacing: .12em; }
.v-stats dt{ color: #5b5445; }
.v-stats dd{ margin: 0; display: flex; align-items: center; gap: 8px; }
.kiss-slot{ display: inline-block; width: 34px; height: 21px; border: 1px dashed rgba(40, 32, 20, .4); border-radius: 50%; }
.kiss{ display: inline-block; width: 34px; height: 21px; }
.stamp{
  position: absolute; right: 5%; top: clamp(70px, 14vh, 120px); width: min(290px, 52%); height: auto; color: #1f1d1a;
  transform: rotate(-9deg); mix-blend-mode: multiply; opacity: .9; pointer-events: none; overflow: visible;
}
.v-cards{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.vcard .card{ min-height: 4.4em; }

/* ---------- case file (manila drawer) ---------- */
dialog.file{
  position: fixed; inset: var(--bar) 0 var(--edge) auto; margin: 0; padding: 0; border: 0;
  width: min(560px, 100vw); height: auto; max-width: none; max-height: none; overflow: visible;
  background: transparent; color: var(--ink);
}
dialog.file::backdrop{ background: rgba(0, 0, 0, .55); }
.file-in{
  position: absolute; inset: 26px 0 0 0; display: flex; flex-direction: column;
  padding: clamp(18px, 3vh, 28px) clamp(18px, 3.2vw, 34px) clamp(12px, 2vh, 18px);
  background:
    repeating-linear-gradient(94deg, rgba(90, 70, 30, .035) 0 2px, transparent 2px 7px),
    radial-gradient(120% 80% at 20% 0%, #d8cba8, var(--manila) 45%, var(--manila-2));
  box-shadow: -30px 0 70px rgba(0, 0, 0, .75), inset 1px 0 0 rgba(255, 255, 255, .35);
  font-family: var(--type);
}
.file-tab{
  position: absolute; top: -26px; left: clamp(18px, 3.2vw, 34px); height: 27px; padding: 0 20px;
  border-radius: 7px 7px 0 0; background: #d6c9a6; font-size: 12px; line-height: 28px; letter-spacing: .4em; color: #3b3322;
}
.file-head{ border-bottom: 2px solid rgba(40, 32, 20, .55); padding-bottom: .8em; margin-bottom: .6em; }
.file-org{ margin: 0; font-size: 11px; letter-spacing: .3em; color: #5a4f38; }
.file-head h2{ margin: .3em 0 .5em; font-family: var(--mincho); font-weight: 600; font-size: clamp(20px, 2.8vh, 26px); letter-spacing: .14em; }
.file-meta{ display: grid; grid-template-columns: auto 1fr; gap: .2em 1.2em; margin: 0; font-size: 12px; letter-spacing: .1em; }
.file-meta dt{ color: #5a4f38; }
.file-meta dd{ margin: 0; }
.file-list{
  flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 4px 0 0; list-style: none; scrollbar-width: thin; scrollbar-color: rgba(60, 50, 30, .4) transparent;
}
.ent{ position: relative; display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 0 .6em; padding: .75em 3.2em .8em 0; border-bottom: 1px solid rgba(60, 48, 25, .28); }
.ent-no{ font-size: 13px; letter-spacing: .06em; color: #5a4f38; padding-top: .1em; }
.ent-t{ margin: 0 0 .2em; font-size: 14.5px; letter-spacing: .14em; font-weight: 700; }
.ent-d{ margin: 0; font-family: var(--type); font-size: 13px; line-height: 1.75; letter-spacing: .04em; color: #2a261f; }
.ent .kiss{ position: absolute; right: 0; top: .8em; width: 46px; height: 28px; transform: rotate(-12deg); }
.ent.blank{ color: rgba(60, 48, 25, .45); font-size: 13px; letter-spacing: .3em; padding: .9em 0; }
.ent.new{ animation: typedIn .9s ease both; }
@keyframes typedIn{ from{ background: rgba(255, 255, 255, .35); } to{ background: transparent; } }
.file-foot{ display: flex; justify-content: space-between; gap: 12px; padding-top: .9em; border-top: 2px solid rgba(40, 32, 20, .55); margin-top: .4em; }
.fbtn{
  appearance: none; border: 1px solid rgba(40, 32, 20, .55); background: rgba(255, 255, 255, .18); color: var(--ink);
  font-family: var(--type); font-size: 12.5px; letter-spacing: .18em; padding: .6em 1.1em; border-radius: 2px; cursor: pointer;
  transition: background .2s, transform .2s;
}
.fbtn:hover{ background: rgba(255, 255, 255, .42); transform: translateY(-1px); }
.fbtn:focus-visible{ outline: 2px solid #1c1b19; outline-offset: 3px; }
.fbtn kbd{ font-size: 10px; opacity: .6; margin-left: .4em; }

/* ---------- toast & edge ---------- */
.toast{
  position: absolute; z-index: 10; top: 12px; right: var(--gut); max-width: calc(100% - 2 * var(--gut));
  display: flex; gap: .9em; align-items: baseline; padding: .55em 1em .5em;
  font-family: var(--type); font-size: 12.5px; letter-spacing: .12em; color: var(--ink);
  background: linear-gradient(170deg, #efebe1, #d8d1c1); box-shadow: 0 12px 26px -10px #000;
  opacity: 0; transform: translateY(-14px) rotate(-1deg); pointer-events: none;
  transition: opacity .4s ease, transform .5s cubic-bezier(.2, .9, .3, 1.2);
}
.toast.on{ opacity: 1; transform: translateY(0) rotate(-1deg); }
.toast .t-k{ font-size: .86em; color: #5a574f; letter-spacing: .24em; }
.toast .t-t{ font-weight: 700; font-family: var(--mincho); letter-spacing: .1em; }
.edge{
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 max(var(--gut), env(safe-area-inset-right)) env(safe-area-inset-bottom) max(var(--gut), env(safe-area-inset-left));
  font: 10px/1 var(--type); letter-spacing: .28em; color: #4f4d49; white-space: nowrap; overflow: hidden;
}
.edge::before{
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px;
  background: repeating-linear-gradient(90deg, #141414 0 11px, transparent 11px 25px); pointer-events: none;
}
.edge span{ position: relative; background: #000; padding: 0 .9em; }
.edge span:first-child{ padding-left: 0; }
.edge span:last-child{ padding-right: 0; }

/* ---------- small screens ---------- */
@media (max-width: 760px){
  :root{ --band: min(40%, 66vw); --mw: calc(100vw - 2 * var(--gut)); --mratio: .85; --mdrop: .36; }
  .where{ display: none; }
  .tool{ padding: 9px 6px; letter-spacing: .08em; }
  .tool kbd{ display: none; }
  .story{ grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .cards{ grid-template-columns: minmax(0, 1fr); gap: 10px; position: static; }
  .card{ min-height: 0; padding: .55em .95em .75em; }
  .tmark.wide{ display: none; }
  .tmark.tall{ display: block; }
  .t-top{ align-items: stretch; }
  .t-over{ width: 100%; }
  .t-bottom{ grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .t-bill span{ display: block; margin-left: 0; }
  .v-cards{ grid-template-columns: minmax(0, 1fr); }
  .stamp{ top: 64px; width: 56%; }
  .edge .fic{ display: none; }
}
@media (max-width: 380px){
  .brand{ height: 14px; }
  .tool{ font-size: 12px; padding: 9px 4px; }
}
@media (max-height: 520px) and (min-aspect-ratio: 4/3){
  :root{ --band: 100%; --mw: min(calc(50vw - 2 * var(--gut)), 110vh); --mratio: .25; --mdrop: 0; }
  .reel{ grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .screen{ grid-area: 1 / 1; }
  .story{ grid-area: 1 / 2; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 14px 18px; }
  .cards{ grid-template-columns: minmax(0, 1fr); }
  .card{ min-height: 0; }
  .titlecard{ grid-area: 1 / 1 / 2 / 3; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .t-top{ grid-area: 1 / 1; padding: 0 14px 16px; }
  .tmark.wide{ display: block; }
  .tmark.tall{ display: none; }
  .t-bottom{ grid-area: 1 / 2; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 14px 18px; }
  .where{ display: none; }
}

@media (prefers-reduced-motion: reduce){
  .swing, .bulb-reflect, .steam path, .neon, .lip-glow, .shimmer, .sparkle, .snd-on .eq i{ animation: none; }
  .steam path{ opacity: .26; }
  .sparkle{ opacity: .5; }
  .card, .tool::after, .toast{ transition: none; }
  .stamped .count, .stamped .count::after{ animation: none; }
  .ln.typing .typed::after{ animation: none; }
  .ent.new{ animation: none; }
  .card.shake{ animation: none; }
}

    case '、': return 170;
    case '…': return nx === '…' ? 60 : 300;
    case '—': return nx === '—' ? 40 : 240;
    case '？': case '！': return 340;
    case '」': return nx ? 180 : 0;
    default: return 24 + Math.random() * 26;
  }
}

function keepVisible(el) {
  if (!el) return;
  const r = el.getBoundingClientRect(), sr = story.getBoundingClientRect();
  if (r.bottom > sr.bottom - 10) story.scrollTop += Math.min(r.bottom - sr.bottom + 16, Math.max(0, r.top - sr.top - 12));
}

function typeLine(text) {
  const p = document.createElement('p');
  p.className = 'ln' + (text[0] === '「' ? ' q' : '');
  narr.append(p);
  const all = narr.children;
  if (all.length > 3) for (let i = 0; i < all.length - 2; i++) all[i].classList.add('past');
  const lp = document.createElement('p');
  lp.textContent = text;
  live.append(lp);
  if (reduced || S.fast) {
    p.textContent = text;
    keepVisible(p);
    return Promise.resolve();
  }
  const a = document.createElement('span'), rest = document.createElement('span');
  a.className = 'typed';
  rest.className = 'rest';
  rest.textContent = text;
  p.append(a, rest);
  p.classList.add('typing');
  keepVisible(p);
  return new Promise((resolve) => {
    let i = 0, next = 0, raf = 0;
    const done = (quiet) => {
      cancelAnimationFrame(raf);
      a.textContent = text;
      rest.textContent = '';
      p.classList.remove('typing');
      TW.run = null;
      if (quiet !== true) bellSnd();
      resolve();
    };
    TW.run = { done };
    const step = (now) => {
      if (!next) next = now;
      let typed = false;
      while (now >= next && i < text.length) {
        const ch = text[i++];
        next += beatAfter(ch, text[i]);
        typed = true;
      }
      if (typed) {
        a.textContent = text.slice(0, i);
        rest.textContent = text.slice(i);
        keySnd();
      }
      if (i >= text.length) { done(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  });
}

function pause(ms) {
  if (!ms) return Promise.resolve();
  return new Promise((resolve) => {
    const t = setTimeout(() => { pauseRes = null; resolve(); }, ms);
    pauseRes = () => { clearTimeout(t); pauseRes = null; resolve(); };
  });
}

function skip() {
  if (TW.run) TW.run.done();
  else if (pauseRes) pauseRes();
}

function clearNarr() {
  if (!narr.children.length) return Promise.resolve();
  if (reduced || S.fast) { narr.textContent = ''; return Promise.resolve(); }
  narr.classList.add('fade');
  return sleep(220).then(() => { narr.textContent = ''; narr.classList.remove('fade'); story.scrollTop = 0; });
}

/* ================================================================
 *  index cards
 * ================================================================ */
const inked = (t) => Array.from(t).map((ch) => `<span class="ch" style="--o:${(0.74 + Math.random() * 0.26).toFixed(2)};--y:${(Math.random() * 1.2 - 0.6).toFixed(1)}px">${esc(ch)}</span>`).join('');

function makeCard(n, label, hint, onPick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'card' + (hint ? ' locked' : '');
  const tilt = rand(-2.3, 2.3);
  b.dataset.tilt = tilt.toFixed(2);
  b.style.setProperty('--tilt', tilt.toFixed(2) + 'deg');
  b.innerHTML = `<span class="card-no" aria-hidden="true"><span>No.${n}</span><kbd>${n}</kbd></span><span class="card-t" aria-hidden="true">${inked(label)}</span>${hint ? `<span class="card-hint" aria-hidden="true">※${esc(hint)}</span>` : ''}`;
  b.setAttribute('aria-label', `${n}　${label}${hint ? `（まだ選べません。${hint}）` : ''}`);
  if (hint) b.setAttribute('aria-disabled', 'true');
  b.addEventListener('click', () => onPick(b));
  return b;
}

function dropIn(els, delay = 0) {
  if (reduced || S.fast) return;
  els.forEach((el, i) => {
    const t = +el.dataset.tilt, d = delay + 70 + i * 95;
    el.animate(
      [
        { transform: `translateY(-34px) rotate(${t + 7}deg)`, opacity: 0 },
        { transform: `translateY(3px) rotate(${t - 0.6}deg)`, opacity: 1, offset: 0.72 },
        { transform: `rotate(${t}deg)`, opacity: 1 },
      ],
      { duration: 560, delay: d, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' }
    );
    setTimeout(paperSnd, d + 330);
  });
}

function cardsOf(b) {
  if (b.back) return [{ t: '続ける', go: b.back }];
  return (b.cards || []).filter((c) => test(c.show) && !(c.go && BEATS[c.go] && BEATS[c.go].back && S.used.has(c.go)));
}

function deal(list) {
  cardsEl.textContent = '';
  const els = list.map((c, i) => makeCard(i + 1, c.t, lockOf(c), (btn) => pickCard(c, btn)));
  cardsEl.append(...els);
  dropIn(els);
  if (lastInput === 'key' && els[0]) els[0].focus({ preventScroll: true });
  requestAnimationFrame(() => keepVisible(cardsEl.firstElementChild));
}

function nudge(btn, hint) {
  if (!reduced) {
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
  }
  say(hint);
  thudSnd();
}

function collect(chosen) {
  const els = Array.from(cardsEl.children);
  if (reduced || S.fast || !els.length) { cardsEl.textContent = ''; return Promise.resolve(); }
  const anims = els.map((el) => {
    const t = +el.dataset.tilt;
    return el === chosen
      ? el.animate(
          [
            { transform: `rotate(${t}deg)`, opacity: 1 },
            { transform: 'translateY(-8px) rotate(0deg) scale(1.03)', opacity: 1, offset: 0.3 },
            { transform: 'translateY(26px) rotate(-2deg) scale(.97)', opacity: 0 },
          ],
          { duration: 460, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }
        )
      : el.animate([{ opacity: 1, transform: `rotate(${t}deg)` }, { opacity: 0, transform: `translateY(18px) rotate(${t}deg)` }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
  });
  return Promise.all(anims.map((a) => a.finished.catch(() => {}))).then(() => { cardsEl.textContent = ''; });
}

function pickCard(c, btn) {
  if (S.busy || S.picking) return;
  const hint = lockOf(c);
  if (hint) { nudge(btn, hint); return; }
  S.picking = true;
  if (c.go) S.used.add(c.go);
  paperSnd();
  collect(btn).then(() => {
    S.picking = false;
    if (c.cut) cut(c.cut, c.go);
    else play(c.go);
  });
}

function activeCards() {
  if (verdictEl.classList.contains('on')) return $$('.card', verdictEl);
  if (S.title) return $$('.card', tCards);
  return $$('.card', cardsEl);
}

/* ================================================================
 *  beats, scenes, transitions
 * ================================================================ */
async function play(id) {
  const b = BEATS[id];
  if (!b) return;
  const token = ++S.token;
  S.beat = id;
  S.busy = true;
  if (b.state) setState(b.state);
  let lines = b.lines;
  if (b.hub && S.seen.has(id)) {
    const n = S.again[id] || 0;
    lines = [b.again[n % b.again.length]];
    S.again[id] = n + 1;
  }
  S.seen.add(id);
  await clearNarr();
  if (token !== S.token) return;
  live.textContent = '';
  for (const raw of lines) {
    const L = typeof raw === 'string' ? { t: raw } : raw;
    if (!test(L.if)) continue;
    if (L.set) setState(L.set);
    if (L.fx) sceneFx(L.fx);
    await typeLine(L.t);
    if (token !== S.token) return;
    await pause(reduced || S.fast ? 0 : 260);
    if (token !== S.token) return;
  }
  if (b.clue) record(b.clue);
  S.busy = false;
  if (b.end) { verdict(b.end); return; }
  deal(cardsOf(b));
}

function setState(st) {
  for (const [k, v] of Object.entries(st)) {
    S.state[k] = v;
    reel.dataset[k] = v;
  }
}

function setWhere(no, title, time) {
  $('#whereNo').textContent = no;
  $('#whereTitle').textContent = title;
  $('#whereTime').textContent = time || '';
  $('#sceneTitle').textContent = `${no}　${title}`;
}

function setScene(id, state, card) {
  const m = SCENES[id];
  S.scene = id;
  reel.dataset.scene = id;
  S.state = {};
  delete reel.dataset.nora;
  delete reel.dataset.pier;
  setState(Object.assign({}, m.state, state));
  screenEl.setAttribute('aria-label', m.aria);
  if (card) setWhere(card[0], card[1], card[2]);
  else setWhere(m.no, m.title, m.time);
  footage = 0;
  mode = m.wx;
  layout();
  resetTimers();
  mix(id);
}

function setTitle(on) {
  S.title = on;
  reel.classList.toggle('is-title', on);
  where.classList.toggle('on', !on);
  bRestart.setAttribute('aria-disabled', String(on));
  if (on) $('#sceneTitle').textContent = 'タイトル';
}

function irisAt() {
  const m = SCENES[S.scene].iris || [800, 450];
  const x = screenEl.offsetLeft + MAP.ox + m[0] * MAP.s, y = screenEl.offsetTop + MAP.oy + m[1] * MAP.s;
  return `${Math.round(x)}px ${Math.round(y)}px`;
}

function irisClose() {
  if (reduced || S.fast || !reel.animate) {
    reel.classList.add('shut');
    return sleep(reduced ? 160 : 0);
  }
  const at = irisAt();
  const a = reel.animate([{ clipPath: `circle(150% at ${at})` }, { clipPath: `circle(0% at ${at})` }], { duration: 900, easing: 'cubic-bezier(.55,0,.75,.45)', fill: 'forwards' });
  return a.finished.then(
    () => { reel.classList.add('shut'); a.cancel(); },
    () => { reel.classList.add('shut'); }
  );
}

function irisOpen() {
  reel.classList.remove('shut');
  if (reduced || S.fast || !reel.animate) return Promise.resolve();
  const at = irisAt();
  const a = reel.animate([{ clipPath: `circle(0% at ${at})` }, { clipPath: `circle(150% at ${at})` }], { duration: 1150, easing: 'cubic-bezier(.25,.6,.3,1)' });
  return a.finished.catch(() => {});
}

let interSkip = null;
function intertitle([no, title, time]) {
  $('#interNo').textContent = no;
  $('#interTitle').textContent = title;
  $('#interTime').textContent = time || '';
  say(`${no}　${title}${time ? '。' + time : ''}`);
  inter.classList.add('on');
  projector(true);
  return new Promise((resolve) => {
    let over = false;
    const finish = () => {
      if (over) return;
      over = true;
      clearTimeout(t);
      interSkip = null;
      inter.classList.remove('on');
      projector(false);
      setTimeout(resolve, reduced ? 0 : 420);
    };
    const t = setTimeout(finish, reduced ? 1500 : 2400);
    interSkip = finish;
  });
}

async function cut(spec, go) {
  const token = ++S.token;
  S.busy = true;
  await irisClose();
  if (token !== S.token) return;
  narr.textContent = '';
  cardsEl.textContent = '';
  live.textContent = '';
  story.scrollTop = 0;
  if (S.title) setTitle(false);
  const m = SCENES[spec.scene];
  setScene(spec.scene, spec.state || {}, spec.card);
  await intertitle(spec.card || [m.no, m.title, m.time]);
  if (token !== S.token) return;
  irisOpen();
  await sleep(reduced ? 0 : 420);
  if (token !== S.token) return;
  play(go || m.start);
}

function start(withSound) {
  if (!S.title || S.busy) return;
  if (withSound) setSound(true);
  cut({ scene: 'office', state: { nora: 'door' } }, 'o1');
}

function resetRun() {
  S.flags.clear();
  S.used.clear();
  S.seen.clear();
  S.found = [];
  S.again = {};
  S.ended = null;
  S.picking = false;
  S.filed = 0;
  for (const c of Array.from(reel.classList)) if (c.startsWith('has-')) reel.classList.remove(c);
  fileCount.textContent = '0';
}

async function restart() {
  const token = ++S.token;
  if (TW.run) TW.run.done(true);
  if (pauseRes) pauseRes();
  if (interSkip) interSkip();
  if (fileDlg.open) closeFile(true);
  S.busy = true;
  verdictOff();
  await irisClose();
  if (token !== S.token) return;
  resetRun();
  narr.textContent = '';
  cardsEl.textContent = '';
  live.textContent = '';
  setScene('office', { nora: 'door' });
  setTitle(true);
  renderTitle();
  await irisOpen();
  if (token !== S.token) return;
  S.busy = false;
  if (lastInput === 'key') { const c = $('.card', tCards); if (c) c.focus({ preventScroll: true }); }
}

/* two-step confirm for restarting in the middle of a case */
function confirmable(btn, label, ask) {
  let t = 0;
  btn.addEventListener('click', () => {
    if (S.title && !fileDlg.open) return;
    if (S.ended || btn.classList.contains('confirm')) {
      clearTimeout(t);
      btn.classList.remove('confirm');
      btn.textContent = label;
      restart();
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = ask;
    say(`${ask}　もう一度押すと、最初からやり直します。`);
    t = setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = label; }, 3200);
  });
}

/* ================================================================
 *  clues, case file, toast
 * ================================================================ */
let toastT = 0;
function record(id, quiet) {
  if (S.flags.has(id)) return;
  S.flags.add(id);
  reel.classList.add('has-' + id);
  if (!CLUES[id]) return;
  S.found.push(id);
  fileCount.textContent = String(S.found.length);
  if (quiet) return;
  const c = CLUES[id];
  toast.innerHTML = `<span class="t-k">事件簿に記録</span><span class="t-n">No.${pad(S.found.length)}</span><span class="t-t">${esc(c.t)}</span>`;
  toast.classList.remove('on');
  void toast.offsetWidth;
  toast.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => toast.classList.remove('on'), 2900);
  bFile.classList.remove('stamped');
  void bFile.offsetWidth;
  bFile.classList.add('stamped');
  stampSnd(0.35);
}

const kissSvg = (label) => `<svg class="kiss" viewBox="0 0 120 72" role="img" aria-label="${label}"><use href="#y-kiss"/></svg>`;

function renderFile() {
  fileMeta.textContent = `${S.found.length}／${CLUE_TOTAL}`;
  let h = '';
  S.found.forEach((id, i) => {
    const c = CLUES[id];
    h += `<li class="ent${i >= S.filed ? ' new' : ''}"><span class="ent-no">${pad(i + 1)}</span><div><h3 class="ent-t">${esc(c.t)}</h3><p class="ent-d">${esc(c.d)}</p></div>${c.key ? kissSvg('決定的な証拠') : ''}</li>`;
  });
  for (let i = S.found.length; i < CLUE_TOTAL; i++) h += `<li class="ent blank" aria-hidden="true"><span class="ent-no">${pad(i + 1)}</span><span>—— 未記入 ——</span></li>`;
  fileList.innerHTML = h;
  S.filed = S.found.length;
}

let fileReturn = null;
function openFile() {
  if (fileDlg.open) return;
  renderFile();
  fileReturn = document.activeElement;
  try { fileDlg.showModal(); } catch (e) { fileDlg.setAttribute('open', ''); }
  if (!reduced) fileIn.animate([{ transform: 'translateX(104%)' }, { transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.2,.85,.2,1)' });
  drawerSnd();
  $('#fileClose').focus({ preventScroll: true });
}

function closeFile(instant) {
  if (!fileDlg.open || fileDlg.dataset.closing) return;
  const fin = () => {
    delete fileDlg.dataset.closing;
    if (fileDlg.open) fileDlg.close();
    if (fileReturn && fileReturn.isConnected) fileReturn.focus({ preventScroll: true });
  };
  if (reduced || instant === true) { fin(); return; }
  fileDlg.dataset.closing = '1';
  const a = fileIn.animate([{ transform: 'none' }, { transform: 'translateX(104%)' }], { duration: 340, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' });
  a.finished.then(() => { fin(); a.cancel(); }, fin);
}

/* ================================================================
 *  verdict & title
 * ================================================================ */
function stampSvg(E) {
  const n = Array.from(E.stamp).length;
  return `<svg class="stamp" viewBox="0 0 380 170" aria-hidden="true" focusable="false"><g filter="url(#f-ink)" fill="currentColor"><rect x="6" y="6" width="368" height="158" rx="12" fill="none" stroke="currentColor" stroke-width="7"/><rect x="19" y="19" width="342" height="132" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text class="mn" x="190" y="106" font-size="80" font-weight="700" text-anchor="middle" textLength="${n * 64}" lengthAdjust="spacingAndGlyphs">${E.stamp}</text><text class="ty" x="190" y="140" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="7">${E.en}</text></g></svg>`;
}

function verdict(id) {
  const E = ENDINGS[id];
  S.ended = id;
  const seen = store.get(END_KEY, []);
  if (Array.isArray(seen) && !seen.includes(id)) { seen.push(id); store.set(END_KEY, seen); }
  const nKeys = KEYS.filter((k) => S.flags.has(k)).length;
  const kisses = KEYS.map((k) => (S.flags.has(k) ? kissSvg(CLUES[k].t) : '<span class="kiss-slot" aria-hidden="true"></span>')).join('');
  verdictEl.innerHTML = `<article class="vcard${E.torn ? ' torn' : ''}" aria-labelledby="vTitle">
    <p class="v-head"><span>E・クレイン探偵事務所</span><span>事件簿　最終頁</span></p>
    <p class="v-kicker">結末</p>
    <h2 class="v-title" id="vTitle"><span>${E.title}</span></h2>
    <p class="v-note">${E.note}</p>
    <dl class="v-stats"><dt>記録した手がかり</dt><dd>${S.found.length}／${CLUE_TOTAL}</dd><dt>決定的な証拠</dt><dd>${kisses}<span class="sr">${nKeys}／3</span></dd><dt>判定</dt><dd>${E.stamp}<span class="sr">（${E.en}）</span></dd></dl>
    ${stampSvg(E)}
    <div class="v-cards" role="group" aria-label="次の操作"></div>
  </article>`;
  const c1 = makeCard(1, '最初から', null, () => restart());
  const c2 = makeCard(2, '事件簿を見る', null, () => openFile());
  $('.v-cards', verdictEl).append(c1, c2);
  verdictEl.classList.add('on');
  say(`判定、${E.stamp}。結末「${E.title}」。`);
  const card = $('.vcard', verdictEl), stamp = $('.stamp', verdictEl);
  if (reduced || S.fast) {
    if (lastInput === 'key') c1.focus({ preventScroll: true });
    return;
  }
  card.animate([{ transform: 'translateY(40px) rotate(-4deg)', opacity: 0 }, { transform: 'rotate(-1.2deg)', opacity: 1 }], { duration: 760, delay: 250, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  stamp.animate(
    [
      { transform: 'scale(2.6) rotate(-18deg)', opacity: 0 },
      { transform: 'scale(.94) rotate(-8deg)', opacity: 0.95, offset: 0.78 },
      { transform: 'rotate(-9deg)', opacity: 0.9 },
    ],
    { duration: 340, delay: 1250, easing: 'cubic-bezier(.6,0,.9,.6)', fill: 'backwards' }
  );
  setTimeout(() => {
    stampSnd(1);
    card.animate([{ transform: 'rotate(-1.2deg)' }, { transform: 'rotate(-1.2deg) translate(2px,3px)' }, { transform: 'rotate(-1.2deg) translate(-1px,-1px)' }, { transform: 'rotate(-1.2deg)' }], { duration: 200 });
  }, 1510);
  dropIn([c1, c2], 1650);
  setTimeout(() => { if (lastInput === 'key' && c1.isConnected) c1.focus({ preventScroll: true }); }, 2000);
}

function verdictOff() {
  verdictEl.classList.remove('on');
  setTimeout(() => { if (!verdictEl.classList.contains('on')) verdictEl.textContent = ''; }, 820);
}

function renderTitle() {
  tCards.textContent = '';
  const c1 = makeCard(1, 'ドアを開ける', null, () => start(false));
  const c2 = makeCard(2, '音を入れて、ドアを開ける', null, () => start(true));
  const help = document.createElement('p');
  help.className = 't-help';
  help.textContent = 'カードはクリックか 1〜4 キー。文字をクリックするか Space で、その行を一度に表示。事件簿は C、音は S。';
  tCards.append(c1, c2, help);
  const seen = store.get(END_KEY, []);
  const got = Array.isArray(seen) ? seen : [];

  }).join('');
}

/* ================================================================
 *  audio — everything synthesized, off until the viewer asks
 * ================================================================ */
const AU = { ctx: null, on: false, master: null, rainG: null, rainLP: null, musG: null, musLP: null, sfx: null, noise: null, brown: null, timer: 0, next: 0, step: 0, lastKey: 0, proj: null };
const BEAT = 60 / 94;
/* a twelve-bar minor blues, walked in C */
const WALK = [
  36, 39, 43, 46, 48, 46, 43, 42, 41, 43, 39, 38, 36, 38, 39, 40,
  41, 44, 48, 44, 41, 44, 46, 47, 48, 46, 43, 39, 36, 38, 39, 43,
  44, 48, 51, 49, 43, 41, 38, 35, 36, 39, 43, 38, 43, 41, 38, 35,
];
const MIX = {
  office: [0.55, 1400, 0.42, 380],
  alley: [0.95, 7000, 0.5, 700],
  club: [0.12, 700, 1, 3600],
  dressing: [0.22, 900, 0.62, 1000],
  pier: [0.38, 2600, 0.22, 300],
};

function auInit() {
  if (AU.ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  let c;
  try { c = new AC(); } catch (e) { return false; }
  AU.ctx = c;
  const sr = c.sampleRate;
  const white = c.createBuffer(1, sr * 2, sr), wd = white.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
  const brown = c.createBuffer(1, sr * 3, sr), bd = brown.getChannelData(0);
  let last = 0;

/* ================================================================
 *  the film: weather canvas, grain, flicker, gate weave, lamps
 * ================================================================ */
let W = 1, H = 1, DPR = 1, mode = 'window', footage = 0;
const MAP = { s: 1, ox: 0, oy: 0 };
const px = (x) => MAP.ox + x * MAP.s, py = (y) => MAP.oy + y * MAP.s;
let drops = [], splashes = [], beads = [], runners = [], puffs = [], clip = null, gY = 0;

const SPRITE = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,.9)');
  g.addColorStop(0.5, 'rgba(255,255,255,.32)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  return c;
})();

function newDrop(anywhere) {
  const bx = clip || { x: 0, y: 0, w: W, h: H };
  const z = Math.random(), k = clip ? 0.6 : mode === 'fog' ? 0.8 : 1, s = Math.max(0.45, MAP.s);
  return {
    x: bx.x + (Math.random() * 1.2 - 0.15) * bx.w,
    y: anywhere ? bx.y + Math.random() * bx.h : bx.y - Math.random() * 0.4 * bx.h - 10,
    z, len: (10 + z * 32) * s * k, v: (500 + z * 1000) * s * k,
    land: gY + Math.random() * Math.max(1, H - gY),
  };
}
function newRunner(any) {
  const s = Math.max(0.6, MAP.s);
  return { x: clip.x + Math.random() * clip.w, y0: 0, y: clip.y + Math.random() * clip.h * (any ? 0.8 : 0.4), v: 0, r: (1.6 + Math.random() * 1.6) * s, wait: Math.random() * 4 };
}
function newPuff(any) {
  const s = Math.max(0.5, MAP.s);
  if (mode === 'fog') {
    const r = (180 + Math.random() * 280) * s;
    return { r, x: any ? -r + Math.random() * (W + 2 * r) : -r, y: H * (0.3 + Math.random() * 0.75), vx: (8 + Math.random() * 16) * s, vy: 0, gr: 0, a: 0.07 + Math.random() * 0.1, ph: Math.random() * 6, sq: 0.42 };
  }
  const r = (60 + Math.random() * 110) * s;
  return { r, x: Math.random() * W, y: any ? H * (0.15 + Math.random() * 0.85) : H + r * 0.5, vx: (3 + Math.random() * 10) * s, vy: -(6 + Math.random() * 12) * s, gr: (2 + Math.random() * 6) * s, a: 0.06 + Math.random() * 0.06, ph: Math.random() * 6, sq: 0.7 };
}

function seed() {
  drops = []; splashes = []; beads = []; runners = []; puffs = [];
  clip = mode === 'window' ? { x: px(1010), y: py(130), w: 440 * MAP.s, h: 500 * MAP.s } : null;
  gY = py(672);
  const area = clip ? clip.w * clip.h : W * H;
  const clampN = (v, a, b) => Math.round(Math.max(a, Math.min(b, v)));
  const n = mode === 'rain' ? clampN(area / 2200, 140, 520) : mode === 'window' ? clampN(area / 1800, 50, 200) : mode === 'fog' ? clampN(area / 9000, 30, 120) : 0;
  for (let i = 0; i < n; i++) drops.push(newDrop(true));
  if (clip) {
    const nb = Math.min(90, Math.round(area / 2200));
    for (let i = 0; i < nb; i++) beads.push({ x: clip.x + Math.random() * clip.w, y: clip.y + Math.random() * clip.h, r: (0.8 + Math.random() * 2.2) * Math.max(0.6, MAP.s) });
    for (let i = 0; i < 7; i++) runners.push(newRunner(true));
  }
  if (mode === 'smoke' || mode === 'fog') for (let i = 0; i < (mode === 'fog' ? 12 : 14); i++) puffs.push(newPuff(true));
}

function drawRain(dt) {
  const bx = clip || { x: 0, y: 0, w: W, h: H };
  const layers = [[], [], []];
  for (const d of drops) {
    d.y += d.v * dt;
    d.x += d.v * 0.14 * dt;
    if (mode === 'rain' && d.z > 0.55 && d.y > d.land) {
      if (splashes.length < 140) splashes.push({ x: d.x, y: d.land, t: 0, r: (1.5 + d.z * 3.5) * Math.max(0.5, MAP.s) * 1.6 });
      Object.assign(d, newDrop(false));
      continue;
    }
    if (d.y - d.len > bx.y + bx.h) { Object.assign(d, newDrop(false)); continue; }
    layers[d.z < 0.35 ? 0 : d.z < 0.7 ? 1 : 2].push(d);
  }
  const alpha = mode === 'fog' ? [0.08, 0.13, 0.19] : mode === 'window' ? [0.12, 0.2, 0.3] : [0.13, 0.22, 0.36];
  const widths = [0.6, 0.9, 1.3], lw = Math.max(0.7, MAP.s);
  wctx.lineCap = 'round';
  for (let l = 0; l < 3; l++) {
    wctx.strokeStyle = `rgba(225,225,225,${alpha[l]})`;
    wctx.lineWidth = widths[l] * lw;
    wctx.beginPath();
    for (const d of layers[l]) { wctx.moveTo(d.x, d.y); wctx.lineTo(d.x - d.len * 0.14, d.y - d.len); }
    wctx.stroke();
  }
}
function drawSplashes(dt) {
  wctx.lineWidth = Math.max(0.8, MAP.s * 0.9);
  for (let i = splashes.length - 1; i >= 0; i--) {
    const p = splashes[i];
    p.t += dt;
    const k = p.t / 0.3;
    if (k >= 1) { splashes.splice(i, 1); continue; }
    const rr = p.r * (0.4 + k * 1.6);
    wctx.strokeStyle = `rgba(215,215,215,${(0.42 * (1 - k)).toFixed(3)})`;
    wctx.beginPath();
    wctx.ellipse(p.x, p.y, rr, rr * 0.32, 0, Math.PI, Math.PI * 2);
    wctx.stroke();
    const hop = p.r * 3.2 * k * (1 - k) * 4;
    wctx.fillStyle = `rgba(225,225,225,${(0.5 * (1 - k)).toFixed(3)})`;
    wctx.fillRect(p.x - p.r * k * 1.4, p.y - hop, 1.3, 1.3);
    wctx.fillRect(p.x + p.r * k * 1.2, p.y - hop * 0.8, 1.3, 1.3);
  }
}
function drawBeads(dt) {
  wctx.fillStyle = 'rgba(210,210,210,.15)';
  wctx.beginPath();
  for (const b of beads) { wctx.moveTo(b.x + b.r, b.y); wctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); }
  wctx.fill();
  wctx.fillStyle = 'rgba(255,255,255,.4)';
  wctx.beginPath();
  for (const b of beads) wctx.rect(b.x - b.r * 0.35, b.y - b.r * 0.45, 1, 1);
  wctx.fill();

    if (u.wait > 0) {
      u.wait -= dt;
      if (u.wait <= 0) u.y0 = u.y;
    } else {
      u.v = Math.min(u.v + 90 * dt * MAP.s, 160 * MAP.s);
      u.y += u.v * dt;
      u.x += Math.sin(u.y * 0.07) * 0.15;
    }
    if (u.y > clip.y + clip.h + 6) { Object.assign(u, newRunner(false)); continue; }
    if (u.wait <= 0 && u.y0) {
      wctx.strokeStyle = 'rgba(210,210,210,.13)';
      wctx.lineWidth = u.r * 0.7;
      wctx.beginPath();
      wctx.moveTo(u.x, u.y0);
      wctx.lineTo(u.x, u.y);
      wctx.stroke();
    }
    wctx.fillStyle = 'rgba(228,228,228,.3)';
    wctx.beginPath();
    wctx.arc(u.x, u.y, u.r, 0, Math.PI * 2);
    wctx.fill();
  }
}
function drawPuffs(dt) {
  for (const p of puffs) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += p.gr * dt;
    p.ph += dt * 0.4;
    if (p.x - p.r > W || p.y + p.r * p.sq < 0) Object.assign(p, newPuff(false));
    wctx.globalAlpha = p.a * (0.75 + 0.25 * Math.sin(p.ph));
    wctx.drawImage(SPRITE, p.x - p.r, p.y - p.r * p.sq, p.r * 2, p.r * 2 * p.sq);
  }
  wctx.globalAlpha = 1;
}
function drawWeather(dt) {
  wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  wctx.clearRect(0, 0, W, H);
  if (mode === 'window') {
    wctx.save();
    wctx.beginPath();
    wctx.rect(clip.x, clip.y, clip.w, clip.h);
    wctx.clip();
    drawRain(dt);
    drawBeads(dt);
    wctx.restore();
  } else if (mode === 'rain') {
    drawRain(dt);
    drawSplashes(dt);
  } else if (mode === 'smoke') {
    drawPuffs(dt);
  } else if (mode === 'fog') {
    drawPuffs(dt);
    drawRain(dt);
  }
}

/* grain: four baked noise tiles, stepped at half the frame rate */
const TILE = 160, pats = [];
function bakeGrain() {
  for (let k = 0; k < 4; k++) {
    const c = document.createElement('canvas');
    c.width = c.height = TILE;
    const x = c.getContext('2d'), img = x.createImageData(TILE, TILE), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (Math.random() + Math.random() + Math.random() - 1.5) * 1.6, w = v > 0;
      d[i] = d[i + 1] = d[i + 2] = w ? 255 : 0;
      d[i + 3] = Math.min(1, Math.abs(v)) * (w ? 20 : 30);
    }
    x.putImageData(img, 0, 0);
    pats.push(gctx.createPattern(c, 'repeat'));
  }
}
let scratches = [];
function drawGrain(still) {
  const w = grain.width / DPR, h = grain.height / DPR;
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, grain.width, grain.height);
  const ox = (Math.random() * TILE) | 0, oy = (Math.random() * TILE) | 0;
  gctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
  gctx.fillStyle = pats[(Math.random() * pats.length) | 0];
  gctx.fillRect(-ox, -oy, w, h);
  gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (still) return;
  if (Math.random() < 0.035) scratches.push({ x: Math.random() * w, life: (3 + Math.random() * 12) | 0, a: 0.1 + Math.random() * 0.25, lw: 0.5 + Math.random() * 0.9, c: Math.random() < 0.6 ? '255,255,255' : '0,0,0', dx: Math.random() * 1.2 - 0.6 });
  for (const s of scratches) {
    gctx.strokeStyle = `rgba(${s.c},${s.a})`;
    gctx.lineWidth = s.lw;
    gctx.beginPath();
    gctx.moveTo(s.x, 0);
    gctx.quadraticCurveTo(s.x + Math.random() * 4 - 2, h / 2, s.x + Math.random() * 6 - 3, h);
    gctx.stroke();
    s.x += s.dx;
    s.life--;
  }
  scratches = scratches.filter((s) => s.life > 0);
  if (Math.random() < 0.09) {
    gctx.fillStyle = Math.random() < 0.55 ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.35)';
    gctx.beginPath();
    gctx.arc(Math.random() * w, Math.random() * h, 0.6 + Math.random() * 1.8, 0, Math.PI * 2);
    gctx.fill();
  }
  if (Math.random() < 0.006) {
    const x = Math.random() * w, y = Math.random() * h;
    gctx.strokeStyle = 'rgba(0,0,0,.45)';
    gctx.lineWidth = 0.8;
    gctx.beginPath();
    gctx.moveTo(x, y);
    gctx.bezierCurveTo(x + 14, y - 10, x + 6, y + 18, x + 22, y + 12);
    gctx.stroke();
  }
}

function layout() {
  const r = screenEl.getBoundingClientRect();
  W = Math.max(1, r.width);
  H = Math.max(1, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  wx.width = Math.round(W * DPR);
  wx.height = Math.round(H * DPR);
  MAP.s = Math.max(W / 1600, H / 900);
  MAP.ox = (W - 1600 * MAP.s) / 2;
  MAP.oy = (H - 900 * MAP.s) / 2;
  const fr = frame.getBoundingClientRect();
  grain.width = Math.max(1, Math.round(fr.width * DPR));
  grain.height = Math.max(1, Math.round(fr.height * DPR));
  seed();
  if (reduced || !FX.raf) drawStill();
}

function drawStill() {
  drawWeather(0);
  drawGrain(true);
  flick.style.opacity = '0.03';
}

const FX = { raf: 0, last: 0, frame: 0, weaveAt: 0, weaving: 0, sweepAt: 0, boltAt: 0 };
const LAMP = { on: true, until: 0, burst: 0, shown: 1 };
let lampEls = [], bulbs = [];
const PX = { tx: 0, ty: 0, x: 0, y: 0 };

function resetTimers() {
  const now = performance.now();
  FX.sweepAt = now + rand(3500, 8000);
  FX.boltAt = now + rand(9000, 18000);
  FX.weaveAt = now + rand(2000, 5000);
}

function lampTick(now) {
  if (now < LAMP.until) return;
  if (LAMP.burst > 0) {
    LAMP.burst--;
    LAMP.on = !LAMP.on;
    LAMP.until = now + (LAMP.on ? rand(40, 150) : rand(30, 110));
  } else {
    LAMP.on = true;
    LAMP.until = now + rand(1600, 6500);
    LAMP.burst = Math.random() < 0.7 ? 2 * ((1 + Math.random() * 3) | 0) : 0;
  }
  const v = LAMP.on ? 1 : rand(0.22, 0.45);
  if (v !== LAMP.shown) { LAMP.shown = v; for (const el of lampEls) el.style.opacity = v.toFixed(2); }
}
function bulbTick(now) {
  for (const b of bulbs) {
    if (!b.flaky || b.forced || now < b.until) continue;
    b.on = !b.on;
    b.until = now + (b.on ? rand(500, 5000) : rand(60, 700));
    b.el.style.opacity = b.on ? '1' : '0.12';
  }
}

function sceneFx(name) {
  if (name === 'knock') knockSnd();
  else if (name === 'horn') hornSnd();
  if (reduced) return;
  if (name === 'lamp') { LAMP.burst = 7; LAMP.until = 0; }
  else if (name === 'bulb' || name === 'bulbs') {
    const steady = bulbs.filter((b) => !b.flaky);
    if (steady.length < 2) return;
    const a = pick(steady), b = pick(steady.filter((x) => x !== a));
    const out = name === 'bulb' ? [a] : [a, b];
    out.forEach((x) => { x.forced = true; x.el.style.opacity = '0.1'; });
    setTimeout(() => { a.el.style.opacity = '1'; a.forced = false; }, 900);
    if (name === 'bulbs') setTimeout(() => { b.el.style.opacity = '1'; b.forced = false; }, 2800);
  }
}

function loop(now) {
  FX.raf = requestAnimationFrame(loop);
  const dt = FX.last ? Math.min(0.05, (now - FX.last) / 1000) : 1 / 60;
  FX.last = now;
  FX.frame++;
  drawWeather(dt);
  if (FX.frame % 2 === 0) {
    drawGrain(false);
    flick.style.opacity = (0.02 + Math.random() * 0.05 + (Math.random() < 0.012 ? 0.14 : 0)).toFixed(3);
  }
  /* gate weave: a few frames of jitter every several seconds */
  if (!FX.weaving && now > FX.weaveAt) FX.weaving = 5;
  if (FX.weaving && FX.frame % 2 === 0) {
    FX.weaving--;
    reel.style.transform = FX.weaving ? `translate(${rand(-2.4, 2.4).toFixed(1)}px,${rand(-3.2, 3.2).toFixed(1)}px)` : '';
    if (!FX.weaving) FX.weaveAt = now + rand(2800, 7200);
  }
  const m = SCENES[S.scene];
  if (S.scene === 'office') lampTick(now);
  if (S.scene === 'dressing') bulbTick(now);
  if (m.sweep && now > FX.sweepAt) {
    FX.sweepAt = now + rand(9000, 17000);
    sweepEl.animate(
      [
        { transform: 'translateX(-120%) skewX(-18deg)', opacity: 0 },
        { opacity: 0.95, offset: 0.25 },
        { opacity: 0.95, offset: 0.7 },
        { transform: 'translateX(175%) skewX(-18deg)', opacity: 0 },
      ],
      { duration: rand(2300, 3300), easing: 'cubic-bezier(.4,0,.6,1)' }
    );
    carSnd();
  }
  if (m.bolt && now > FX.boltAt) {
    FX.boltAt = now + rand(24000, 50000);
    flashEl.animate([{ opacity: 0 }, { opacity: 0.5, offset: 0.08 }, { opacity: 0.04, offset: 0.2 }, { opacity: 0.34, offset: 0.3 }, { opacity: 0 }], { duration: 720, easing: 'linear' });
    thunderSnd(rand(0.9, 2.4));
  }
  /* a little parallax between the back plate and the foreground */
  PX.x += (PX.tx - PX.x) * 0.06;
  PX.y += (PX.ty - PX.y) * 0.06;
  if (Math.abs(PX.tx - PX.x) > 0.001 || Math.abs(PX.ty - PX.y) > 0.001) {
    const b = `translate3d(${(-PX.x * 4).toFixed(2)}px,${(-PX.y * 3).toFixed(2)}px,0)`;
    backEl.style.transform = b;
    wx.style.transform = b;
    frontEl.style.transform = `translate3d(${(-PX.x * 11).toFixed(2)}px,${(-PX.y * 6).toFixed(2)}px,0) scale(1.02)`;
  }
  footage += dt * 24;
  if (FX.frame % 12 === 0) edgeCode.textContent = `第${m.reel}巻　${String(Math.floor(footage / 16)).padStart(4, '0')}＋${pad(Math.floor(footage % 16))}`;
}
function startLoop() {
  if (FX.raf || reduced || document.hidden) return;
  FX.last = 0;
  FX.raf = requestAnimationFrame(loop);
}
function stopLoop() {
  cancelAnimationFrame(FX.raf);
  FX.raf = 0;
}

/* ================================================================
 *  wiring
 * ================================================================ */
function init() {
  buildArt();
  lampEls = $$('#f-office .lampglow');
  bulbs = $$('#bulbs .bulb').map((el, i) => ({ el, flaky: [2, 9, 13, 18].includes(i), on: true, until: 0, forced: false }));
  bakeGrain();
  renderTitle();
  setScene('office', { nora: 'door' });
  setTitle(true);
  startLoop();
  if (!FX.raf) drawStill();

  bFile.addEventListener('click', openFile);
  bSound.addEventListener('click', () => setSound(!AU.on));
  confirmable(bRestart, '最初から', '本当に最初から？');
  confirmable($('#fileRestart'), '最初からやり直す', '本当に？もう一度押す');
  $('#fileClose').addEventListener('click', () => closeFile());
  fileDlg.addEventListener('cancel', (e) => { e.preventDefault(); closeFile(); });
  fileDlg.addEventListener('close', () => { delete fileDlg.dataset.closing; });
  fileDlg.addEventListener('click', (e) => { if (e.target === fileDlg) closeFile(); });
  inter.addEventListener('click', () => { if (interSkip) interSkip(); });
  story.addEventListener('click', (e) => { if (!e.target.closest('.card')) skip(); });
  screenEl.addEventListener('click', skip);

  document.addEventListener('pointerdown', () => { lastInput = 'pointer'; }, true);
  film.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || reduced) return;
    PX.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    PX.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  document.addEventListener('keydown', (e) => {
    lastInput = 'key';
    if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    const k = e.key;
    if (fileDlg.open) {
      if (k === 'c' || k === 'C') { e.preventDefault(); closeFile(); }
      return;
    }
    if (interSkip && inter.classList.contains('on')) {
      if (k !== 'Tab' && k !== 'Shift') { e.preventDefault(); interSkip(); }
      return;
    }
    if (k >= '1' && k <= '4') {
      const c = activeCards()[+k - 1];
      if (c) { e.preventDefault(); c.click(); }
      return;
    }
    if (k === 'c' || k === 'C') { e.preventDefault(); openFile(); return; }
    if (k === 's' || k === 'S') { e.preventDefault(); setSound(!AU.on); return; }
    if ((k === ' ' || k === 'Enter') && !(e.target instanceof Element && e.target.closest('button, a, dialog'))) {
      if (TW.run || pauseRes) { e.preventDefault(); skip(); }
    }
  });

  let rq = 0;
  const onResize = () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(layout); };
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(frame);
  window.addEventListener('resize', onResize);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopLoop();
      if (AU.ctx && AU.on) { clearInterval(AU.timer); AU.timer = 0; AU.ctx.suspend(); }
    } else {
      startLoop();
      if (AU.ctx && AU.on) setSound(true);
    }
  });
  const onMotion = (e) => {
    reduced = e.matches;
    if (reduced) {
      stopLoop();
      reel.style.transform = '';
      backEl.style.transform = wx.style.transform = frontEl.style.transform = '';
      for (const el of lampEls) el.style.opacity = '1';
      for (const b of bulbs) b.el.style.opacity = '1';
      drawStill();
    } else startLoop();
  };
  if (mq.addEventListener) mq.addEventListener('change', onMotion);
  else if (mq.addListener) mq.addListener(onMotion);
}

/* hooks for cover shots and tests: NOIR.jump('c1', ['lipstick']) etc. */
async function jump(id, clues = []) {
  const b = BEATS[id];
  if (!b) return;
  ++S.token;
  if (TW.run) TW.run.done(true);
  if (pauseRes) pauseRes();
  if (fileDlg.open) closeFile(true);
  verdictEl.classList.remove('on');
  verdictEl.textContent = '';
  inter.classList.remove('on');
  interSkip = null;
  resetRun();
  cardsEl.textContent = '';
  clues.forEach((c) => record(c, true));
  reel.classList.remove('shut');
  setTitle(false);
  setScene(b.sc, b.state || {});
  S.fast = true;
  try { await play(id); } finally { S.fast = false; }
}
window.NOIR = {
  start: (withSound) => start(!!withSound),
  jump,
  end: (id, clues = []) => jump({ closed: 'e_closed', ferry: 'e_ferry2', cold: 'e_cold2' }[id], clues),
  file: (open = true) => (open ? openFile() : closeFile(true)),
  skip,
};

init();
})();
</script>
